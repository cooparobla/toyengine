window:
  title: "toyengine"
  width: 1920
  height: 1080
  vsync: false
  visible: true              # false = never-mapped window (headless); what the test suite uses

scene:
  default_scene: "assets/scenes/pixel_demo/scene.yaml"

render:
  # =========================================================================
  # 1. RENDER FEATURES -- master on/off. One switch per feature; off means the
  #    feature contributes nothing and (where marked startup-fixed) costs nothing.
  #    Sub-options that only shape a feature already switched on live in block 2.
  # =========================================================================
  shadows_enabled: true
  ssao_enabled: true
  ssr_enabled: true          # also gates the SSGI diffuse-bounce term (ssgi_intensity)
  transparency_enabled: true # forward BLEND-material pass
  refraction_enabled: true   # screen-space refraction for BLEND MESH objects (needs transparency_enabled)
  sdf_enabled: true          # signed-distance-field raymarching (SdfRenderer/SdfShape)
  bloom_enabled: true        # additive glow from bright HDR regions
  fog_enabled: false         # GLOBAL analytic fog (the Fog block below is its only source)
  volumetrics_enabled: true  # raymarched LOCAL volumes (Volume components in the scene)
  dof_enabled: false         # physically-based depth of field, at render resolution before bloom
  tilt_shift_enabled: false  # diorama blur at DISPLAY resolution, after the upscale
  auto_exposure_enabled: true # eye adaptation: meter the frame and scale `exposure` by it
  grading_enabled: true      # colour-grading LUT (no-op until `grading_lut` names a file)
  outline_enabled: false
  palette_enabled: false
  dither_enabled: false
  world_ui_enabled: true     # WorldSpace canvases, at INTERNAL resolution (startup-fixed)
  screen_ui_enabled: true    # ScreenSpaceOverlay canvases, at WINDOW resolution (startup-fixed)
  aa_mode: taa               # AA's master switch -- off | fxaa | smaa | taa. Not a boolean, but
                             # "off" is this block's meaning of off. taa reprojects +
                             # age-accumulates, so a still camera converges.

  # =========================================================================
  # 2. FEATURE OPTIONS -- booleans one layer below block 1. Each needs its parent
  #    feature switched on above; on its own, none of these turns anything on.
  # =========================================================================
  # Shadows (need shadows_enabled)
  soft_shadows: true         # true = Vogel-disk PCF penumbra; false = single hard depth compare
  shadow_pcss_enabled: false # PCSS contact hardening: a blocker search drives the penumbra, sharp
                             # at contact and widening to shadow_softness with distance. Needs
                             # soft_shadows -- shadow_softness becomes the MAXIMUM width, not a fixed one.
  contact_shadows_enabled: false # short screen-space march toward the sun, closing the normal-bias
                             # gap at object bases (deferred/directional light only). The one
                             # exception to this block's needs-its-parent rule: works without
                             # shadows_enabled -- shadows_enabled: false + this true renders a
                             # contact-only view for isolating the effect. Follows soft_shadows:
                             # on = a PCSS-style penumbra that softens with blocker distance,
                             # widened by shadow_pcss_light_size; off = a hard single-ray edge.
  sdf_shadows_enabled: true  # SDFs cast shadows; independent of sdf_enabled
  # SSR / SSGI (need ssr_enabled)
  ssr_reflect_transparent: true # opaque surfaces also reflect transparent geometry (~2x SSR cost; needs transparency_enabled too)
  ssr_temporal_enabled: true # accumulate the reflection across frames
  ssgi_traced: true          # traced cosine-hemisphere bounce instead of the single normal-offset
                             # mip tap -- directional colour bleed rather than a uniform lift
  # SSAO (needs ssao_enabled)
  ssao_temporal_enabled: true # accumulate the AO estimate across frames (needed for stability)
  # Volumetrics (needs volumetrics_enabled)
  volumetrics_shadows_enabled: true # shadow the sun in-scatter term -- this is what makes light shafts
  # Refraction (needs refraction_enabled)
  refraction_fresnel: true   # dim transmission at grazing angles
  refraction_include_reflections: true # refraction samples the post-SSR image, so it sees reflections
  # Depth of field (needs dof_enabled)
  dof_focus_cover_object: true # object focus also fits the sharp band to the subject's depth extent
  # Shading / sampling style
  texel_aa: true             # texel-AA texture sampling (startup-fixed): hard texels at rest,
                             # but texel boundaries blend over one screen pixel so magnified
                             # faces stop crawling under camera motion; false = raw NEAREST
  soft_lighting: true        # true = smooth Cook-Torrance; false = banded cel-shaded look
  camera_pixel_snap: false   # orthographic cameras only

  # =========================================================================
  # 3. DEBUG VIEW -- one field, one intermediate channel, raw (no tonemap, no
  #    bloom, no TAA history blend) so the numbers on screen are the numbers
  #    the renderer computed. Runtime.
  # =========================================================================
  debug_view: off
  # off              normal render
  # --- G-buffer / material ---
  # albedo           G0.rgb
  # normals          G1.rgb, remapped to 0..1
  # roughness        G2.a
  # metallic         G1.a
  # emissive         G3.rgb
  # material_ao      G0.a (baked/material AO, before SSAO)
  # world_pos        G2.rgb, fract()-wrapped per metre
  # depth            linear view depth, normalized over the camera's clip range
  # --- lighting terms ---
  # direct           direct light sum only (no ambient, no emissive)
  # indirect         sky-gradient ambient + indirect specular only
  # shadows          directional shadow-MAP occlusion alone (no contact term)
  # contact_shadows  the resolved contact-shadow buffer lighting consumes, unscaled by
  #                  strength (needs contact_shadows_enabled -- black without it, since
  #                  the march early-outs when its strength is 0)
  # ssao             the occlusion buffer lighting consumes
  # --- screen-space ---
  # ssr              resolved reflection radiance (needs ssr_enabled)
  # ssr_confidence   that buffer's confidence/alpha as grayscale
  # ssgi             resolved diffuse bounce radiance (needs ssr_enabled + ssgi_traced)
  # --- in-chain (need their own feature enabled) ---
  # dof              signed circle-of-confusion field (needs dof_enabled)
  # volumetrics      accumulated density alone (needs volumetrics_enabled)
  # --- overlay ---
  # lines            normal image + physics collider/contact wireframes

  # =========================================================================
  # Quality -- low | med | high | ultra ("med" and "medium" both work)
  # high = the engine defaults. Each tier sets that feature's resolutions and
  # sample/step counts; writing one of the covered keys explicitly (e.g.
  # shadow_pcf_samples) still overrides its preset.
  # =========================================================================
  shadow_quality:      high  # map resolutions + PCF taps + PCSS blocker taps + contact-shadow steps
  ssao_quality:        high  # slices, march steps, pixel radius, temporal depth
  ssr_quality:         high  # specular raymarch iteration budget
  ssgi_quality:        high  # traced-bounce iteration budget (separate chain from ssr_quality)
  dof_quality:         high  # bokeh gather taps (ultra = high: shader cap)
  volumetrics_quality: high  # raymarch step count + how many lights in-scatter (they multiply)
  sdf_quality:         high  # SDF march + SDF shadow-march step budgets
  water_quality:       high  # buoyancy/ripple range, water mesh density + LOD, shader detail (live)

  # =========================================================================
  # Per-feature settings
  # =========================================================================

  # --- Internal resolution ---
  resolution_mode: fixed     # fixed | divisor
  render_width: 1920
  render_height: 1080
  scale_divisor: 4           # used when resolution_mode: divisor
  upscale_mode: fit          # fit | integer

  # --- Lighting & sky ---
  exposure: 1.0              # baseline stop; auto-exposure (block 1) scales this rather than replacing it
  auto_exposure_compensation: 1.0  # multiplier on the metered exposure
  auto_exposure_speed_up: 3.0      # adaptation rate (1/sec) when the scene gets brighter
  auto_exposure_speed_down: 1.0    # ...and when it gets darker (slower, as the eye is)
  auto_exposure_min: 0.05          # clamps on the adapted multiplier
  auto_exposure_max: 8.0
  light_bands: 4             # banded-lighting step count (soft_lighting: false only)
  spec_threshold: 0.55
  rim_strength: 0.0
  ambient_intensity: 1.0     # sky gradient's contribution as indirect diffuse
  sky_intensity: 1.0         # sky-gradient indirect specular base
  sky_zenith:  [0.05, 0.18, 0.55]   # sky gradient: straight up
  sky_horizon: [0.25, 0.35, 0.45]   # sky gradient: at the horizon
  sky_ground:  [0.05, 0.045, 0.04]  # sky gradient: straight down

  # --- Shadows ---
  shadow_bias: 0.005
  shadow_normal_bias: 1.0    # normal-offset bias in shadow-map texels beyond the PCF disk
  shadow_distance: 60.0      # how far from the camera the directional shadow frustum reaches
  shadow_cascades: 4         # directional cascades, 1..4. Each gets its own ortho fit to one
                             # slice of the depth range and its own tile of the shadow atlas, so
                             # close-up shadows are sharp and distant ones coarse. Costs one extra
                             # pass over the shadow casters per cascade. 1 = one box over the whole
                             # range (the single-map behaviour). Tile size is shadow_map_resolution,
                             # driven by shadow_quality -- the atlas is up to 2x that per axis.
  shadow_cascade_split_lambda: 0.75 # where the cascade boundaries fall: 1 = logarithmic (equal
                             # world-per-texel across cascades), 0 = uniform. Ignored at 1 cascade.
  shadow_softness: 0.15      # directional penumbra radius, WORLD units
  point_shadow_softness: 3.0 # point-light penumbra radius, CUBE-MAP texels
  spot_shadow_softness: 0.15 # spot penumbra radius, WORLD units (converted per pixel from light distance)
  shadow_pcss_light_size: 0.02 # tan of the sun's angular radius; penumbra growth per metre of gap.
                             # Also drives the soft contact-shadow penumbra (when soft_shadows is on);
                             # contact shadows are short-range, so they scale it up internally to stay visible.
  shadow_pcss_search_texels: 8.0 # blocker-search radius, shadow-map texels (1..16)
  # shadow_pcss_taps: 8      # blocker-search taps (1..16). Driven by shadow_quality (4/6/8/16);
                             # uncomment only to override the tier. The PCSS cost dial, since
                             # the search runs on every shadowed pixel.
  contact_shadow_length: 0.5    # march length, world units
  contact_shadow_strength: 1.0  # occlusion strength of a contact hit
  contact_shadow_thickness: 0.15 # assumed occluder thickness, world units
  # contact_shadow_steps: 8     # march steps (1..24). Driven by shadow_quality (4/6/8/16);
                                # uncomment only to override the tier. This march is the
                                # feature's whole cost.

  # --- SSAO ---
  ssao_radius: 2.0           # world-space gather radius
  ssao_half_res: true        # AO at half res + depth-aware upsample (Unity/Unreal default; ~4x cheaper). Startup-fixed
  ssao_blur_light: true      # 4x4 blur over the same footprint as the 8x8 (a quarter of the fetches)
  ssao_bias: 0.025           # world-space normal lift before the horizon march; keep << ssao_radius
  ssao_power: 1.0            # exponent on visibility
  ssao_direct_lighting_strength: 0.25 # how much occlusion darkens DIRECT lighting; 0 = indirect only

  # --- SSR + SSGI ---
  ssr_max_distance: 30.0     # world-space trace cutoff
  ssr_thickness: 0.08        # hit acceptance thickness
  ssr_thickness_scale: 0.02  # extra thickness per unit distance
  ssr_bias_texels: 3.5
  ssr_roughness_cutoff: 1.0  # roughness above which surfaces stop tracing; 1.0 = everything traces.
                             # Measured on terrain_test, 1.0 vs 0.6 moves whole-frame saturation
                             # by 0.002 and contrast by 0.2 -- i.e. nothing. Note this engine has
                             # no reflection probes (indirect_hooks.glsl's hook_env_specular
                             # returns the raw analytic sky term), so a lower cutoff does not hand
                             # rough surfaces to a better estimator, it just stops tracing them.
  ssr_start_mip: 0
  ssr_min_mip0_steps: 1
  ssr_temporal_frames: 32    # frames the reflection averages over (blends frame N at 1/N)
  ssgi_temporal_frames: 48   # same for the diffuse bounce; deeper, it is the noisier estimator
  ssr_temporal_blend: 0.85   # fallback fixed-rate blend, only where no shared count buffer exists
  ssr_temporal_gamma: 2.0    # variance-clipping width (std devs) for history rejection
  ssr_blur_radius: 0.5       # world-space sigma of the spatial denoise
  ssr_blur_light: true       # 3x3 denoise footprint instead of 5x5 (a third of the reads)
  ssr_blur_zero_skip: true   # skip the denoise where the reflection buffer is all zero (exact, pure saving)
  ssr_jitter: 0.25           # stochastic ray jitter as a fraction of the GGX lobe cone
  ssr_half_res: true         # trace SSR/SSGI at half res per axis (~4x cheaper; depth-aware upsample). Startup-fixed
  ssr_skip_negligible: true  # skip SSR rays whose specular weight can't exceed ssr_skip_threshold (rough dielectrics)
  ssr_skip_threshold: 0.02   # weight below which ssr_skip_negligible skips the trace
  ssgi_intensity: 0.6        # diffuse colour-bleed strength; 0 = specular-only SSR
  ssgi_distance: 0.5         # world-space offset along the normal for the FALLBACK bounce lookup
  ssgi_max_distance: 8.0     # world-space ray length for the traced-SSGI march
  ssgi_blur_radius: 1.0      # world-space sigma of the bounce's spatial denoise
  ssgi_blur_light: true      # 3x3 denoise footprint instead of 5x5 (a third of the reads)
  # ssgi_max_iterations: 32  # Hi-Z steps for the bounce march. Driven by ssgi_quality
                             # (12/20/32/48); uncomment only to override the tier. Lower than
                             # ssr_max_iterations on purpose: the bounce ray is short and lands
                             # in a coarse mip, so it converges in fewer steps.

  # --- Refraction (BLEND MESH objects only) ---
  refraction_ior: 1.45       # default IOR for materials without their own (glass ~1.45, water ~1.33)
  refraction_thickness: 0.25 # default world-space travel distance through the object
  refraction_strength: 1.0   # multiplier on the screen-space UV offset
  refraction_max_offset: 0.08 # UV-space clamp; stops smearing at grazing angles
  refraction_chromatic: 0.0  # RGB IOR split; 0 = single tap
  refraction_blur: 1.0       # roughness -> scene-colour mip scale (frosted glass)
  refraction_density: 1.0    # Beer-Lambert absorption strength through refraction_tint
  refraction_tint: [1.0, 1.0, 1.0]

  # --- Fog (GLOBAL; local volumes are Volume components in the scene) ---
  fog_mode: 2                # 0 Linear, 1 Exponential, 2 Exp2
  fog_density: 0.03          # extinction per world unit at the height falloff base
  fog_linear_start: 3.0      # Linear mode: distance fog starts
  fog_linear_end: 25.0       # Linear mode: distance fog reaches max_opacity
  fog_color: [0.6, 0.66, 0.75]
  fog_height_base: -0.5      # world Z of full density (engine is Z-up)
  fog_height_falloff: 2.0    # exponential height falloff distance; <= 0 disables height fog
  fog_sky_blend: 0.5         # 0 = flat fog_color, 1 = blended toward the sky gradient
  fog_sun_amount: 0.3        # Henyey-Greenstein sun in-scatter strength; 0 disables
  fog_sun_anisotropy: 0.7    # HG g; 0 isotropic, ~1 tight forward scatter
  fog_max_opacity: 1.0       # ceiling on how much fog can occlude
  fog_max_distance: 60.0     # distance the fog term (and sky-pixel evaluation) saturates at

  # --- Volumetrics (shared march settings; per-volume look lives on the Volume component) ---
  volumetrics_max_distance: 40.0  # distance the march stops at
  volumetrics_mode: froxel        # froxel (grid, Unreal/HDRP-style; fast) | raymarch (per-pixel march; sharper). Startup-fixed
  volumetrics_froxel_tile: 8      # froxel mode: render pixels per froxel (each axis). Startup-fixed
  volumetrics_froxel_slices: 64   # froxel mode: depth slices along the view ray. Startup-fixed
  volumetrics_froxel_history: 0.9 # froxel mode: temporal reprojection weight (0 = off)
  volumetrics_froxel_miss_samples: 4    # froxel mode: samples per froxel where history was rejected (1 = off)
  volumetrics_froxel_lookup_jitter: 0.0 # froxel mode: per-pixel lookup jitter for TAA to resolve (0 = off; ~1 = Unreal-style)
  volumetrics_resolution_scale: 2 # raymarch mode: march at 1/N render resolution per axis (1 = full); depth-aware upsample
  volumetrics_max_opacity: 0.85   # ceiling on how much volumetrics can occlude
  volumetrics_sun_anisotropy: 0.6 # HG g, shared across volumes
  volumetrics_light_scatter: 1.0  # point/spot in-scatter strength; 0 disables the light loop
  # volumetrics_max_scatter_lights: 4 # how many lights in-scatter (0..4, nearest win). Driven by
                                  # volumetrics_quality (0/2/4/4); uncomment only to override the
                                  # tier. Multiplies against the step count.

  # --- Mesh visibility (frustum culling + instanced batching run always; these tune them) ---
  mesh_lod_bias: 1.0              # >1 keeps mesh LOD detail longer, <1 drops it sooner (meshes with `lods` only)
  shadow_min_caster_texels: 1.0   # skip shadow casters smaller than this many texels in a shadow view; 0 = off

  # --- Depth of field ---
  dof_focus_mode: manual     # manual | orbit_target | object; a camera's own focus_object overrides this
  dof_focus_object: ""       # ':'-separated scene path, used when dof_focus_mode: object
  dof_focus_smoothing: 8.0   # focus-rack rate, 1/sec; <= 0 snaps
  dof_focus_range: 0.0       # metres of extra forced-sharp half-depth around the focal plane
  dof_blur_scale: 1.0        # |CoC| multiplier -- the blur-strength dial; 0 bypasses DoF
  dof_focus_distance: 8.0    # metres; used in manual mode
  dof_aperture: 2.8          # f-stop; lower = shallower depth of field
  dof_focal_length: 0.0      # mm; <= 0 takes the active camera's lens
  dof_sensor_width: 0.0      # mm; <= 0 takes the active camera's sensor_width
  dof_max_radius: 16.0       # |CoC| safety ceiling in render-resolution pixels (not a strength dial)
  dof_blade_count: 0         # < 3 = perfect disc bokeh; else N-sided polygonal iris
  dof_blade_rotation: 0.0    # degrees; rotates the polygonal iris

  # --- Tilt shift ---
  tilt_shift_focus_center: 0.55 # 0..1 screen position of the sharp band's centre (0 = top)
  tilt_shift_focus_width:  0.15 # 0..1 half-height of the fully-sharp band
  tilt_shift_ramp_width:   0.22 # 0..1 distance the blur ramps in over
  tilt_shift_blur_top:     0.3  # strength above the band
  tilt_shift_blur_bottom:  0.2  # strength below the band
  tilt_shift_max_radius:   4.0  # max blur radius in DISPLAY pixels
  tilt_shift_angle:        0.0  # degrees off horizontal

  # --- Bloom ---
  bloom_threshold: 1.0       # brightness (max of R,G,B) below which nothing glows
  bloom_soft_knee: 0.5       # 0..1 fraction of the threshold the quadratic knee spans
  bloom_intensity: 5.0       # final multiplier on the composited glow; <= 0 disables
  bloom_scatter: 0.7         # per-level blend toward the coarser tent; higher = wider halo
  bloom_radius: 1.0          # tent-filter width multiplier on the upsample
  bloom_clamp: 20.0          # per-tap HDR ceiling before thresholding; firefly guard

  # --- Anti-aliasing tuning ---
  fxaa_subpixel: 0.75        # blend weight of FXAA's subpixel-aliasing term
  fxaa_edge_threshold: 0.166 # local contrast below which FXAA does nothing
  fxaa_edge_threshold_min: 0.0312 # absolute contrast floor
  smaa_threshold: 0.1        # SMAA edge-detection contrast threshold
  smaa_max_search_steps: 16  # SMAA blend-weight search distance, texels
  taa_blending_weight: 0.99  # history weight TAA's accumulation converges to at rest
  taa_feedback_motion: 0.85  # history weight floor under fast camera motion
  taa_weight_scale: 30       # feedback hits its floor at ~100/scale px of per-frame velocity
  taa_sharpness: 0.25        # motion-gated high-frequency restore; 0 disables
  taa_variance_gamma: 1.0    # history clip half-width, std deviations of the 3x3 YCoCg box

  # --- Outline ---
  outline_thickness: 0.6     # low-resolution texels
  outline_color: [0.05, 0.04, 0.08, 1.0]
  depth_threshold: 0.02      # relative depth step that counts as an edge; scale-invariant
  normal_threshold: 0.75

  # --- Palette / dither ---
  palette: "assets/palettes/duel-1x.png"
  # Colour-grading strip LUT (N*N by N, e.g. 1024x32). Empty = no grading.
  grading_lut: ""
  dither_strength: 0.08

  # --- SDF capacities (startup-fixed SSBO sizing) ---
  sdf_max_renderers: 64
  sdf_max_shapes: 512

jobs:
  worker_threads: 0          # 0 = std::thread::hardware_concurrency()
  parallel_threshold: 4      # low on purpose: exercises the parallel path on the pixel demo

# Project-wide physics settings (coopa::physx::util::PhysicsSettings) -- see
# physxcoopa/util/physics_settings.h for the full schema; every key here is optional.
physics:
  gravity: { x: 0.0, y: 0.0, z: -9.81 }
  fixed_timestep: 0.016666667
  solver:
    velocity_iterations: 16
    relax_iterations: 2
    position_iterations: 4
  layers: ["Default", "Ground", "Triggers"]
  ignore_layer_collisions:
    - [Triggers, Triggers]   # trigger volumes never need to push each other apart
  cloth:
    substeps: 4              # XPBD substeps per fixed substep -- the quality knob that matters
    iterations: 1            # constraint iterations within each substep
  debug_draw: [Colliders, Contacts] # what a DebugLinePass draw gathers, when enabled
  parallel_threshold: 16     # low on purpose, same reasoning as jobs.parallel_threshold

output:
  save_on_exit: true
  filepath: "./output/frame.png"
  save_low_res: false        # false = final display-res frame; true = pre-tilt-shift low-res buffer, no UI
