  bloom_intensity: 5.0
  bloom_radius: 1.0
  bloom_scatter: 0.7
  bloom_soft_knee: 0.5
  bloom_threshold: 1.0
  camera_pixel_snap: false
  cloud_altitude: 1500
  cloud_coverage: 0.4
