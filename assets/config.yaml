scene: { default_scene: assets/scenes/gameplay/character_demo/scene.yaml }
debug: { overlay: "off" }
jobs: { parallel_threshold: 4, worker_threads: 0 }
output: { filepath: ./output/frame.png, save_low_res: false, save_on_exit: true }
particles: { gpu_enabled: true }
physics:
  cloth: { iterations: 1, substeps: 4 }
  debug_draw: [Colliders, Contacts]
  fixed_timestep: 0.016666667
  gravity: { x: 0.0, y: 0.0, z: -9.81 }
  ignore_layer_collisions:
    - [Triggers, Triggers]
  layers: [Default, Ground, Triggers]
  parallel_threshold: 16
  solver: { position_iterations: 4, relax_iterations: 2, velocity_iterations: 16 }
render:
  aa_mode: taa
  ambient_intensity: 1.0
  atmosphere_density: 1.0
  auto_exposure_compensation: 1.0
  auto_exposure_enabled: true
  auto_exposure_max: 8.0
  auto_exposure_min: 0.05
  auto_exposure_speed_down: 1.0
  auto_exposure_speed_up: 3.0
  bloom_clamp: 2.0e+01
