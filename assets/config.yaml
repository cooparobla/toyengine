window:
  title: "toyengine"
  width: 1920
  height: 1080
  vsync: true
  # false renders into a window that is never mapped: nothing appears on screen, nothing
  # takes focus, and the cursor is never captured. What the test suite runs with; for a
  # scripted capture, pair it with ONESHOT/CAPTURE_FRAMES.
  visible: true

scene:
  default_scene: "assets/scenes/pixel_demo/scene.yaml"

render:
  # --- Internal resolution ---
  resolution_mode: fixed     # fixed | divisor
  render_width: 1440
  render_height: 960
  scale_divisor: 4
  upscale_mode: fit          # fit | integer

  # --- Feature toggles ---
  outline_enabled: false
  palette_enabled: false
  dither_enabled: false
  camera_pixel_snap: false
  soft_lighting: true        # true = smooth Cook-Torrance direct lighting; false = banded/ramped cel-shaded look (this engine's default)
  ssao_enabled: true
  ssao_debug_view: false     # renders SsaoPass's blurred output fullscreen in place of lighting;
                              # runtime toggle, see PixelRenderConfig::ssao_debug_view
  ssr_enabled: true          # also gates the SSGI diffuse-bounce term (ssgi_intensity)
  transparency_enabled: true # forward BLEND-material pass; off by default (no demo scene uses it yet)
  ssr_reflect_transparent: true # opaque surfaces also reflect transparent geometry (roughly doubles SSR cost; requires ssr_enabled + transparency_enabled)
  refraction_enabled: true   # screen-space refraction for BLEND MESH objects only (not SdfRenderer glass); requires transparency_enabled
  fog_enabled: false          # Unity-style GLOBAL fog, analytic; parameters below are its only source
  volumetrics_enabled: true   # raymarched LOCAL volumes: kind fog | wind | haze (see gfxcoopa's VolumetricsPass)
  sdf_enabled: true           # signed-distance-field raymarching (SdfRenderer/SdfShape); see toyengine's sdf_*.frag
  sdf_shadows_enabled: true   # independent of sdf_enabled -- SDFs can be visible without casting shadows
  bloom_enabled: true         # additive glow from bright HDR regions; independent BloomPass pyramid (no longer reuses SSR's mip chain)
  tilt_shift_enabled: true    # Link's Awakening (Switch) style diorama blur; runs at DISPLAY
                              # resolution after the upscale (a lens effect, not a pixel-grid
                              # effect) -- startup-fixed, like bloom/fog (see gfxcoopa's TiltShiftPass)
  dof_enabled: true          # physically-based depth of field; runs at RENDER resolution, on
                              # linear HDR, before bloom (so defocused highlights bloom into real
                              # bokeh) -- startup-fixed, like bloom/fog/tilt_shift above. Independent
                              # of tilt_shift_enabled: they compose (depth-driven lens blur here,
                              # screen-position diorama blur there); see gfxcoopa's DofPass
  dof_debug_view: false       # renders the signed circle-of-confusion field in place of the image
                              # (red = near field, blue = far field, black = in focus); RUNTIME
                              # flag, like ssao_debug_view
  debug_lines_enabled: false  # physics collider/contact wireframes (toyengine's DebugLinePass);
                              # per-frame toggle -- see the `physics.debug_draw` block below for
                              # which categories (Colliders/Contacts/BVH) get gathered
  shadows_enabled: true
  world_ui_enabled: true      # WorldSpace canvases (uicoopa UiWorldPass), drawn at the INTERNAL
                              # render resolution so they stay on the pixel-art grid; STARTUP-FIXED
  screen_ui_enabled: true     # ScreenSpaceOverlay canvases (uicoopa UiPass), drawn at full WINDOW
                              # resolution; STARTUP-FIXED. Both UI layers composite AFTER every post
                              # effect -- DoF, AA and tilt shift never touch them
  aa_mode: taa                 # off | fxaa | smaa | taa -- startup-fixed, like bloom/fog/tilt_shift above.
                                # "taa" jitters the camera every frame, which fights camera_pixel_snap --
                                # expected at this engine's low internal resolution; intended for a future
                                # higher-resolution mode where the jitter's sub-texel footprint is finer
                                # than a rendered pixel. Previously also skipped outright whenever
                                # dof_enabled was true (DofPass's bokeh gather used a fixed, unrotated tap
                                # pattern that visibly swam under the jitter); no longer needed now that
                                # the gather is per-pixel rotated -- see the jitter block's own comment in
                                # PixelRenderPipeline::render().

  # --- Bloom ---                                
  bloom_threshold: 1.0        # brightness (max of R,G,B) below which nothing glows; 1.0 = "brighter than white"
  bloom_soft_knee: 0.5        # 0..1 fraction of the threshold the quadratic knee spans; 0 = hard cutoff (pops under camera motion)
  bloom_intensity: 5.0        # final multiplier on the composited glow; <= 0 disables
  bloom_scatter: 0.7          # per-level blend toward the coarser tent (Unity URP's "Scatter"); higher = wider, softer halo
  bloom_radius: 1.0           # tent-filter width multiplier on the upsample
  bloom_clamp: 20.0           # per-tap HDR ceiling before thresholding; firefly guard

  # --- Tilt shift ---
  tilt_shift_focus_center: 0.55  # 0..1 screen position of the sharp band's centre (0 = top);
                                  # slightly below middle, as in the reference
  tilt_shift_focus_width:  0.15  # 0..1 half-height of the fully-sharp band
  tilt_shift_ramp_width:   0.22  # 0..1 distance the blur ramps in over; smoothstepped
  tilt_shift_blur_top:     1.0   # strength above the band (the "far" half -- strongest)
  tilt_shift_blur_bottom:  0.7   # strength below the band (the "near" half)
  tilt_shift_max_radius:   4.0   # max blur radius in DISPLAY pixels
  tilt_shift_angle:        0.0   # degrees; rotates the focus band off horizontal

  # --- Depth of field ---
  dof_focus_mode:      manual  # manual | orbit_target | object -- global fallback; the demo
                                # camera's own `focus_object: cube.000` (scene.yaml) overrides
                                # this for that camera, so this global setting only matters for
                                # a camera that doesn't set focus_object itself
  dof_focus_object:    ""      # ':'-separated scene path (e.g. sdf_blob:sdf_blob_sphere), used
                                # when dof_focus_mode == object
  dof_focus_smoothing: 8.0     # focus-rack rate, 1/sec; <= 0 snaps. Object-focus mode only --
                                # eases the focal plane onto a newly (re)resolved target rather
                                # than snapping, e.g. when focus_object first resolves or changes
  dof_focus_distance: 8.0     # metres; fallback used only when dof_focus_mode == manual, or
                              # orbit_target with a non-Orbit-mode camera (e.g. Fly)
  dof_aperture:       2.8     # f-stop; lower = shallower depth of field (stronger blur away from focus)
  dof_focal_length:   0.0     # mm; <= 0 takes the active camera's `lens`
  dof_sensor_width:   0.0     # mm; <= 0 takes the active camera's `sensor_width`
  dof_max_radius:     16.0    # |CoC| ceiling, in render-resolution pixels. Previously lowered to
                              # 6.0 to hide a screen-locked dot lattice in the background -- but
                              # that lattice was dof_spiral_tap()'s spiral being unrotated, since
                              # fixed (gfxcoopa's dof_common.glsl now rotates it per-pixel via
                              # dof_ign_angle()), and dof_composite.frag's blend used to be
                              # normalized BY this value, so lowering it also silently raised
                              # blur opacity on in-focus objects (see that shader's own fix
                              # comment). With the blend now a fixed full-res-pixel band
                              # independent of this ceiling, 16.0 sits above this demo's physical
                              # CoC-at-infinity (~12.7px at 85mm/f2.0/~11.5m focus/1440px render
                              # width), so this is a true no-op safety clamp again, not a de facto
                              # strength dial -- retune dof_aperture (or the camera's own
                              # `aperture`/`lens` in scene.yaml) to change how strong the blur is.
  dof_sample_count:   48      # spiral gather taps; clamped to [8, 48] in-shader. Kept at the
                              # in-shader ceiling now that max_radius is bigger again -- more
                              # taps are needed to keep density up over the larger disc
  dof_blade_count:    0       # < 3 = perfect disc bokeh; else an N-sided polygonal iris
  dof_blade_rotation: 0.0     # degrees; rotates the polygonal iris

  # --- Lighting ---
  exposure: 1.0
  light_bands: 4
  spec_threshold: 0.55
  rim_strength: 0.0
  ambient_intensity: 1.0     # scales the sky gradient's contribution as indirect diffuse
  sky_intensity: 1.0         # scales the sky-gradient indirect specular base
  # The three colours the sky gradient (ambient light, skybox background, SSR's
  # env-specular base, and fog's sky blend -- all driven from the same values)
  # mixes between: straight up / at the horizon / straight down. Kept well below
  # 1.0 so ACES tonemapping doesn't wash the gradient out to flat grey.
  sky_zenith:  [0.05, 0.18, 0.55]
  sky_horizon: [0.25, 0.35, 0.45]
  sky_ground:  [0.05, 0.045, 0.04]

  # --- Shadows ---
  shadow_map_resolution: 2048
  cube_shadow_resolution: 512
  shadow_bias: 0.005
  shadow_distance: 60.0       # Unity-style "Shadow Distance": how far from the camera shadows
                              # are computed. The directional shadow frustum is fit to the
                              # camera's OWN view frustum out to this distance -- never to scene
                              # content -- so no object's position (however far off, however it
                              # got there) can perturb or blow out the shadow map. See
                              # PixelRenderConfig::shadow_distance's doc
  soft_shadows: true           # true = rotated Vogel-disk PCF penumbra; false = single hard depth compare
  shadow_softness: 0.15       # directional penumbra radius in WORLD units, converted to a texel
                              # count each frame against the ortho box actually in effect -- so the
                              # penumbra stays visually constant as the box refits to the camera
  point_shadow_softness: 3.0  # point-light cube PCF penumbra radius in CUBE-MAP TEXELS, converted
                              # to a tangent-space offset each frame against cube_shadow_resolution
                              # (not comparable to shadow_softness's world units above)
  shadow_pcf_samples: 24      # Vogel disk taps, 1..32; lower is cheaper and grainier

  # --- Outline ---
  outline_thickness: 0.6
  outline_color: [0.05, 0.04, 0.08, 1.0]
  depth_threshold: 0.02      # relative depth step (fraction of the fragment's own distance); scale-invariant
  normal_threshold: 0.75

  # --- Palette ---
  palette: "assets/palettes/duel-1x.png"

  # --- Dither ---
  dither_strength: 0.08

  # --- SSAO ---
  ssao_radius: 0.75
  ssao_bias: 0.025          # world-space depth offset for the occlusion test in ssao.frag.
                            # MUST stay well under ssao_radius * 0.57 (the kernel's max sample
                            # reach, see SsaoKernel) -- a larger bias makes the test in
                            # ssao.frag:95 unsatisfiable and silently flattens AO to 1.0,
                            # which is indistinguishable from ssao_enabled: false.
  ssao_power: 2.5
  ssao_kernel_size: 24
  ssao_temporal_enabled: true
  ssao_temporal_blend: 0.85

  # --- SSR + SSGI ---
  ssr_max_distance: 30.0
  ssr_max_iterations: 64
  ssr_thickness: 0.08         # loosened from 0.05 -- reduces spurious thickness-test rejections
                               # of otherwise-valid hits near silhouette edges (patchy reflection
                               # boundaries); paired with the new SSR blur pass, not a substitute
                               # for it -- this only shifts where the raw hit/miss boundary sits.
  ssr_thickness_scale: 0.02   # loosened from 0.01, same reasoning as ssr_thickness above
  ssr_bias_texels: 3.5
  ssr_roughness_cutoff: 1.0   # 1.0 so rough surfaces still trace and feed the bounce
  ssr_start_mip: 0
  ssr_min_mip0_steps: 1
  ssr_temporal_enabled: true
  ssr_temporal_blend: 0.85
  ssr_blur_radius: 0.5        # world-space sigma for the spatial SSR denoise -- smooths raw
                               # hit/miss noise at reflection boundaries that temporal
                               # accumulation alone doesn't fully resolve
  ssr_jitter: 0.25             # stochastic ray jitter, as a fraction of the GGX lobe cone --
                               # turns the hard hit/miss silhouette boundary that causes rotation
                               # shimmer into per-pixel noise the temporal/blur stages below can
                               # integrate into a soft edge. Re-measured on this scene (pixel_demo,
                               # roughness-0.8 floor, fog off) with a fixed-timestep frame-sequence
                               # sweep across 0.15-0.4: the aggregate frame-to-frame flicker metric
                               # over the FLOOR's own primary reflection is statistically identical
                               # at every nonzero value tested, including vs 0.0 -- at this
                               # roughness the cone-LOD colour sample is already saturated at the
                               # mip clamp (see gfx_ssr_trace's own doc), so perturbing the ray
                               # barely changes what gets sampled. It's kept ON, at a middling
                               # value, because it has a real, separately-verified benefit: at this
                               # camera framing the small glass sphere's SECONDARY reflection trace
                               # only ever registers a hit with a jittered ray -- the deterministic
                               # mirror ray misses the sphere's silhouette entirely from every floor
                               # pixel tested. 0 would make that reflection permanently invisible
                               # rather than merely faint. No visible downside found (denoised
                               # output is visually identical to the jitter-off render).
  ssr_temporal_gamma: 2.0     # variance-clipping width (std deviations) for the SSR temporal
                               # resolve's history rejection, widened from 1.0 to pair with
                               # ssr_jitter > 0 above -- at gamma 1.0 the resolve's neighbourhood
                               # sigma is small on an otherwise-uniform floor patch, so gamma*sigma
                               # is a much tighter band than the jitter's own induced noise,
                               # meaning history gets clipped almost every frame instead of
                               # integrating the noise into a stable average. 2.0 was verified (not
                               # just assumed) via the same frame-sequence sweep as ssr_jitter.
  ssgi_intensity: 0.6         # diffuse colour-bleed strength; 0 = specular-only SSR
  ssgi_distance: 0.5          # world-space offset along N for the bounce lookup

  # --- Refraction (transparent/BLEND MESH objects only; SdfRenderer glass is unaffected) ---
  refraction_ior: 1.45              # engine-wide default IOR for materials that don't set their own (glass ~1.45, water ~1.33)
  refraction_thickness: 0.25        # engine-wide default world-space distance the ray travels through the object
  refraction_strength: 1.0          # global multiplier on the screen-space UV offset
  refraction_max_offset: 0.08       # clamp in UV units; stops smearing at grazing angles
  refraction_chromatic: 0.0         # RGB IOR split (chromatic aberration); 0 = single tap
  refraction_blur: 1.0              # roughness -> scene-colour mip scale; frosted glass
  refraction_density: 1.0           # Beer-Lambert absorption strength through refraction_tint
  refraction_fresnel: true          # dim transmission at grazing angles (energy already in the SSR/sky term)
  refraction_tint: [1.0, 1.0, 1.0]  # engine-wide default transmission tint
  refraction_include_reflections: true  # source refraction's own scene-colour chain from the SSR composite
                                         # (vs. the plain pre-SSR image) so refraction sees SSR reflections too

  # --- Fog ---
  # GLOBAL fog, and this block is its ONLY source -- there is no fog component and no
  # local fog volume. Anything bounded is a Volume component in the scene instead.
  # Every value below is re-read each frame, so it can be changed at runtime through
  # Engine::render_config(); fog_enabled above is the exception, being startup-fixed.
  fog_mode: 2                 # 0 Linear, 1 Exponential, 2 Exp2 (Unity's default)
  fog_density: 0.03           # extinction per world unit at the height falloff base
  fog_linear_start: 3.0       # world-space distance fog starts ramping in (Linear mode)
  fog_linear_end: 25.0        # world-space distance fog reaches max_opacity (Linear mode)
  fog_color: [0.6, 0.66, 0.75] # base fog colour
  fog_height_base: -0.5       # world Z fog is at full density below (engine is Z-up; plane.000 sits at z=-0.5)
  fog_height_falloff: 2.0     # exponential height falloff distance in world units; <= 0 disables height fog
  fog_sky_blend: 0.5          # 0 = flat fog_color, 1 = fully blended toward the sky gradient at the horizon
  fog_sun_amount: 0.3         # additive Henyey-Greenstein sun in-scatter tint strength; 0 disables
  fog_sun_anisotropy: 0.7     # HG g; 0 isotropic, close to 1 = tight forward scatter toward the sun
  fog_max_opacity: 1.0        # ceiling on how much fog can occlude the scene (1 = fully opaque at max density)
  fog_max_distance: 60.0      # distance the global fog term saturates at, and the distance sky pixels are evaluated
                               # at -- prevents a hard seam where a grazing near-horizon ray's apparent distance
                               # blows up against an otherwise-unfogged sky

  # --- Volumetrics (raymarched LOCAL volumes; see gfxcoopa's VolumetricsPass) ---
  # Only SHARED march settings live here. How a volume looks -- kind, density, noise,
  # advection, colour -- is per-volume and authored on a Volume component in the scene,
  # because volumes are local by definition. Kinds: fog (static pocket), wind (ribbons),
  # haze (drifting billows). Fog above is the GLOBAL atmosphere and is config-only.
  # There is deliberately no global wind or haze: place a large Volume if you want one.
  volumetrics_step_count: 48      # raymarch steps -- the primary perf knob
  volumetrics_max_distance: 40.0  # distance the march stops at
  volumetrics_max_opacity: 0.85   # ceiling on how much volumetrics can occlude the scene
  volumetrics_sun_anisotropy: 0.6 # HG g; shared because it's a property of the light, not a volume
  volumetrics_debug_view: false   # output accumulated density alone, scene colour suppressed

  # --- Anti-aliasing (ported from blendy's PbrRenderPipeline; see PixelRenderConfig::aa_mode) ---
  fxaa_subpixel: 0.75           # blend weight of FXAA's subpixel-aliasing term
  fxaa_edge_threshold: 0.166    # local contrast (fraction of lumaMax) below which FXAA does nothing
  fxaa_edge_threshold_min: 0.0312 # absolute contrast floor -- avoids AA-ing near-black noise
  smaa_threshold: 0.1           # SMAA edge-detection local contrast threshold
  smaa_max_search_steps: 16     # SMAA blend-weight pass's max search distance, in texels
  taa_blending_weight: 0.9      # TAA's blend weight toward the (AABB-clamped) history sample
  taa_weight_scale: 30.0        # plumbed for parity with blendy; gfxcoopa's taa.frag never reads this

  # --- SDF ---
  sdf_max_steps: 64            # global ceiling on SdfRenderer::max_steps
  sdf_shadow_max_steps: 32     # cheaper budget for the depth-only shadow march
  sdf_max_renderers: 64        # SdfData renderer SSBO capacity (startup-fixed)
  sdf_max_shapes: 512          # SdfData shape SSBO capacity (startup-fixed)

jobs:
  worker_threads: 0        # 0 = std::thread::hardware_concurrency()
  parallel_threshold: 4    # low on purpose: exercises the parallel path in the pixel demo
                            # (8 MeshRenderers, 4 SdfRenderers); libcoopa's own house value
                            # for production-sized workloads is 256 (AnimationSystem)

# Project-wide physics settings (coopa::physx::util::PhysicsSettings) -- see
# physxcoopa/util/physics_settings.h for the full schema; every key here is optional.
physics:
  gravity: { x: 0.0, y: 0.0, z: -9.81 }
  fixed_timestep: 0.016666667
  solver:
    velocity_iterations: 16
    relax_iterations: 2
    position_iterations: 4
  layers: ["Default", "Ground", "Triggers"]
  ignore_layer_collisions:
    - [Triggers, Triggers]   # trigger volumes never need to push each other apart
  cloth:
    # XPBD substeps per fixed substep, and constraint iterations within each -- the two knobs
    # governing cloth quality. Substeps are the one that matters: for a fixed budget, more
    # substeps converges strictly better than more iterations (Macklin et al. 2019), which is
    # why the ratio is the reverse of solver.velocity_iterations above. 4 keeps a 25x25 sheet
    # under 0.15 ms; raise toward 8 if a fast-moving anchor shows visible stretch.
    substeps: 4
    iterations: 1
  debug_draw: [Colliders, Contacts]   # what a DebugLinePass draw would gather, when enabled
  parallel_threshold: 16     # low on purpose, same reasoning as jobs.parallel_threshold above --
                              # exercises PhysicsSystem's/PhysicsWorld's job-parallel passes on
                              # physics_test's modest body count instead of always falling back serial

output:
  save_on_exit: true
  filepath: "./output/frame.png"
  save_low_res: false  # false captures the final DISPLAY-resolution frame (after tilt
                        # shift, with both UI layers composited on top); true captures the
                        # pixel-perfect low-res buffer instead, which is BEFORE tilt shift
                        # and contains NO UI at all -- neither layer is part of it
