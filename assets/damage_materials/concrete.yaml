# A wall, a slab: hard and brittle -- a strong enough impact or blast fractures it outright
# rather than denting, and it has no grain for a slash to cleave along.
hardness: 0.9
toughness: 0.2
fibrous: 0.0
hit_points: 300
resistance: { impact: 1.0, slash: 1.4, pierce: 1.3, explosive: 0.8, fire: 1.5 }
