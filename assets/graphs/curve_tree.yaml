# A tree grown along an authored Curve, in three levels of wood plus foliage.
#
# The curve IS the trunk: Pen Mode draws where it leans and bends, and this graph dresses it.
# That is the point of the demo -- a tree is a path plus some rules, and the path is exactly the
# part a node graph is bad at describing and a pen is good at.
#
#   trunk    ONE swept mesh along the curve. Not chained instances: those merely abut, so every
#            joint is a seam and a bend opens a notch on its outside. A sweep shares the ring
#            between sections, so the surface is continuous by construction.
#   branches points off the upper trunk, leaning away from it on a PROFILE -- long and near
#            horizontal low down, short and upright at the top, which is a pine's silhouette --
#            and spiralled around the trunk by the golden angle so they never leave in one plane.
#   twigs    swept tubes rooted on their branch's `surface` points: spaced evenly ALONG the
#            branch and spiralled around it, each leaving along the outward normal. Sampling the
#            branch TRIANGLES instead is area-weighted, and a tapered tube carries most of its
#            area at the fat end -- so twigs crowded the base and the outer half came out bare.
#   foliage  cards on the twigs' own surface points, the same way: evenly along each twig rather
#            than bunched at its root.
#
# Meshes: tools/gen_curve_tree_assets.py, leaf texture: tools/gen_foliage_texture.py.
name: curve_tree
inputs:
  - { id: path, type: Curve, label: Trunk path }
  - { id: trunk_segments, type: Int, label: Trunk segments, default: 16, min: 2, max: 80 }
  - { id: trunk_radius, type: Float, label: Trunk radius, default: 0.3, min: 0.02, max: 2.0 }
  - { id: tip_taper, type: Float, label: Tip taper, default: 0.18, min: 0.02, max: 1.0 }
  - { id: branch_count, type: Int, label: Branches, default: 14, min: 0, max: 60 }
  - { id: branch_length, type: Float, label: Branch length, default: 1.3, min: 0.1, max: 6.0 }
  - { id: branch_spread, type: Float, label: Branch droop, default: 0.55, min: 0.0, max: 3.2 }
  - { id: lean_low, type: Float, label: Lean at base (deg), default: 72.0, min: 0.0, max: 90.0 }
  - { id: lean_high, type: Float, label: Lean at top (deg), default: 28.0, min: 0.0, max: 90.0 }
  - { id: length_low, type: Float, label: Length at base, default: 1.5, min: 0.1, max: 4.0 }
  - { id: length_high, type: Float, label: Length at top, default: 0.45, min: 0.1, max: 4.0 }
  - { id: twigs_per_branch, type: Int, label: Twigs per branch, default: 7, min: 0, max: 40 }
  - { id: twig_length, type: Float, label: Twig length, default: 0.3, min: 0.05, max: 3.0 }
  - { id: leaves_per_twig, type: Int, label: Leaves per twig, default: 8, min: 0, max: 40 }
  - { id: leaf_size, type: Float, label: Leaf size, default: 0.28, min: 0.05, max: 3.0 }
outputs:
  - { id: object, type: ObjectSpec }
nodes:
  - { type: GroupInput, id: 1, pos: [-1000, 0] }
  - { type: String, id: 3, pos: [-1000, 520], props: { value: objects/props/tree_foliage } }

  # --- trunk: one swept tube along the curve --------------------------------------------------
  - { type: SweepCurve, id: 10, pos: [-740, -260] }
  # `tip_taper` is a RATIO of the base radius, so it has to be multiplied by it. Wired straight
  # into radius_end it was an ABSOLUTE radius -- equal to the base on one tree and wider on
  # another, which is why the trunk never narrowed.
  - { type: Math, id: 11, pos: [-900, -200], props: { operation: multiply } }

  # --- branches: points up the trunk, lean and length profile ---------------------------------
  - { type: CurveToPoints, id: 20, pos: [-740, -40] }
  - { type: Float, id: 21, pos: [-940, 60], props: { value: 0.32 } }
  - { type: Float, id: 22, pos: [-940, 120], props: { value: 1.0 } }
  - { type: TubesOnPoints, id: 23, pos: [-500, -40] }
  - { type: Float, id: 24, pos: [-740, 110], props: { value: 0.09 } }
  - { type: Float, id: 25, pos: [-740, 170], props: { value: 0.025 } }
  # Branches start at the trunk's CENTRE, so they are buried already; sinking pushes their base
  # out the far side as a nub on the bark.
  - { type: Float, id: 12, pos: [-740, 230], props: { value: 0.0 } }

  # --- twigs: on the branches' evenly-spaced surface points -----------------------------------
  - { type: TubesOnPoints, id: 33, pos: [-60, 120] }
  - { type: Float, id: 34, pos: [-260, 260], props: { value: 0.03 } }
  - { type: Float, id: 35, pos: [-260, 320], props: { value: 0.006 } }
  - { type: Float, id: 36, pos: [-260, 380], props: { value: 0.35 } }
  - { type: Float, id: 32, pos: [-260, 450], props: { value: 0.025 } }
  - { type: Float, id: 13, pos: [-500, 400], props: { value: 0.45 } }
  - { type: Float, id: 14, pos: [-500, 470], props: { value: 1.3 } }

  # --- foliage: cards on the twigs' surface points --------------------------------------------
  - { type: InstanceOnPoints, id: 42, pos: [380, 320], props: { kind: object } }
  - { type: Float, id: 44, pos: [0, 530], props: { value: 3.1 } }
  - { type: CombineXYZ, id: 45, pos: [180, 460] }

  # --- assembly -------------------------------------------------------------------------------
  - { type: JoinGeometry, id: 50, pos: [600, 60] }
  - { type: MakeInstancer, id: 51, pos: [780, 200] }
  - { type: SetMaterial, id: 52, pos: [600, -180] }
  - { type: String, id: 53, pos: [420, -180], props: { value: materials/natural/bark } }
  - { type: ObjectOutput, id: 60, pos: [960, 60], props: { name: CurveTree } }
  - { type: GroupOutput, id: 99, pos: [1140, 60] }
links:
  # trunk
  - [1, path, 10, curve]
  - [1, trunk_segments, 10, sections]
  - [1, trunk_radius, 10, radius_start]
  - [1, trunk_radius, 11, a]
  - [1, tip_taper, 11, b]
  - [11, result, 10, radius_end]

  # branches, with a lean and length profile up the trunk
  - [1, path, 20, curve]
  - [1, branch_count, 20, count]
  - [21, value, 20, trim_start]
  - [22, value, 20, trim_end]
  - [1, lean_low, 20, lean_start]
  - [1, lean_high, 20, lean_end]
  - [1, length_low, 20, length_start]
  - [1, length_high, 20, length_end]
  - [20, points, 23, points]
  - [1, branch_length, 23, length]
  - [24, value, 23, radius_start]
  - [25, value, 23, radius_end]
  - [1, branch_spread, 23, droop]
  - [12, value, 23, sink]
  # Attachment points spread evenly ALONG each branch, which is what puts twigs near the tips.
  - [1, twigs_per_branch, 23, surface_points]

  # twigs on those points
  - [23, surface, 33, points]
  - [1, twig_length, 33, length]
  - [34, value, 33, radius_start]
  - [35, value, 33, radius_end]
  - [36, value, 33, length_jitter]
  - [13, value, 33, spread]
  - [14, value, 33, droop]
  - [32, value, 33, sink]
  - [1, leaves_per_twig, 33, surface_points]

  # foliage on the twigs' own surface points
  - [33, surface, 42, points]
  - [3, value, 42, prototype]
  - [1, leaf_size, 45, x]
  - [1, leaf_size, 45, y]
  - [1, leaf_size, 45, z]
  - [45, vector, 42, scale]
  - [44, value, 42, random_rotation]

  # Assembly. All the wood is ONE mesh, materialled once; the cards stay instanced.
  #
  # The card instances go into the OBJECT OUTPUT's geometry, not only into Make Instancer:
  # publish builds the InstancePainter from the output object's own instances, so instances that
  # reach only the component are never painted and the foliage silently disappears.
  - [10, geometry, 50, geometry, 0]
  - [23, geometry, 50, geometry, 1]
  - [33, geometry, 50, geometry, 2]
  - [42, instances, 50, geometry, 3]
  - [50, geometry, 52, geometry]
  - [53, value, 52, material]
  - [52, geometry, 60, geometry]
  - [52, geometry, 51, instances]
  - [51, component, 60, components, 0]
  - [60, object, 99, object]
