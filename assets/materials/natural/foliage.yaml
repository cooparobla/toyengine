# Wind-swayed CUTOUT leaf card for the `foliage` surface shader (two-sided; it bends in the
# weather's wind -- see shaders/foliage_surface.glsl).
# shader_params: [flexibility, frequency, height (mesh units), up axis (0 = +Z, 1 = +Y)].
# This card is the plane primitive stood up by its transform: +Y is its up; its upper half
# (y 0..1) sways, the lower half stays planted.
albedo: { r: 0.25, g: 0.55, b: 0.2 }
metallic: 0.0
roughness: 0.7
ao: 1.0
alpha_mode: CUTOUT
alpha_cutoff: 0.5
texture_alpha_mask: textures/noise_mask.png
shader: foliage
shader_params: [0.12, 1.6, 1.0, 1.0]
