# horse: a rideable quadruped object-hierarchy rig (joints are empties, parts are capsule
# meshes), facing +Y, origin on the ground. Clips idle / walk / trot / gallop. Ride it with a
# Rider on the player (F near a mount point) -- see tools/gen_horse.py and toyengine/scene/mount.h.
# GENERATED by tools/gen_horse.py; edit that, not this file.
object:
  name: horse
  components:
    - type: Transform
      position: {x: 0, y: 0, z: 0}
    - type: Animator
      auto_play: idle
      default_crossfade: 0.25
      states:
        - {name: idle, clip: animations/horse/idle.yaml}
        - {name: walk, clip: animations/horse/walk.yaml}
        - {name: trot, clip: animations/horse/trot.yaml}
        - {name: gallop, clip: animations/horse/gallop.yaml}
    # The body: a capsule round the barrel (head and rump overhang it). Its Mount steers it.
    - type: CharacterController
      radius: 0.62
      height: 2.0
      step_height: 0.4
      slope_limit: 40
      snap_distance: 0.45
      acceleration: 40
      jump_height: 0.9
      face_movement: false
      push_strength: 500
      player_input: false
    - type: Mount
      walk_speed: 1.344       # the gait clips' ground speeds (m/s)
      trot_speed: 3.22
      gallop_speed: 7.5
      acceleration: 4
      braking: 6
      turn_rate: 150
      gallop_turn_rate: 70
      saddle: body/saddle
      stirrup_l: body/saddle/stirrup_l
      stirrup_r: body/saddle/stirrup_r
      rein_l: body/neck/rein_l
      rein_r: body/neck/rein_r
      mount_point_l: mount_point_l
      mount_point_r: mount_point_r
      camera_offset_z: 2.2
      camera_distance: 6.5
    # Four hooves on the ground; the body rises / drops and pitches between front and hind.
    - type: FootIK
      pelvis: body
      mode: solve
      body_pitch: true
      max_body_pitch: 18
      ray_up: 0.45
      ray_down: 0.45
      max_pelvis_drop: 0.3
      max_foot_angle: 25
      blend_speed: 10
      legs:
        - {thigh: body/fore_upper_l, shin: body/fore_upper_l/fore_lower_l, foot: body/fore_upper_l/fore_lower_l/fore_hoof_l, front: true}
        - {thigh: body/fore_upper_r, shin: body/fore_upper_r/fore_lower_r, foot: body/fore_upper_r/fore_lower_r/fore_hoof_r, front: true}
        - {thigh: body/hind_upper_l, shin: body/hind_upper_l/hind_lower_l, foot: body/hind_upper_l/hind_lower_l/hind_hoof_l, pole: {x: 0, y: -1, z: 0}}
        - {thigh: body/hind_upper_r, shin: body/hind_upper_r/hind_lower_r, foot: body/hind_upper_r/hind_lower_r/hind_hoof_r, pole: {x: 0, y: -1, z: 0}}
