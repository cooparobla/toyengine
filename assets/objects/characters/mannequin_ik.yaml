# mannequin: a 1.8 m humanoid object-hierarchy rig (joints are empties, parts are capsule
# meshes), facing +Y, origin at the feet. Clips idle / walk / run / jump. Joint names are a
# contract (clips, foot IK and ragdolls address them) -- see tools/gen_mannequin.py.
# Fully IK: its clips key only the *_target / *_pole empties; IK poses every bone (see the generator).
# GENERATED by tools/gen_mannequin.py; edit that, not this file.
object:
  name: mannequin_ik
  components:
    - type: Transform
      position: {x: 0, y: 0, z: 0}
    - type: Animator
      auto_play: idle
      default_crossfade: 0.2
      states:
        - {name: idle, clip: animations/mannequin_ik/idle.yaml}
        - {name: walk, clip: animations/mannequin_ik/walk.yaml}
        - {name: run, clip: animations/mannequin_ik/run.yaml}
        - {name: jump, clip: animations/mannequin_ik/jump.yaml, wrap: once}
    # Spine first (a chain: spine > chest; the chest takes its target's rotation, twist and
    # all, and the neck rides on it), then the limbs hanging from it, then the head --
    # IkSystem's default order for equal priorities.
    - type: ChainIK
      root: pelvis/spine
      tip: pelvis/spine/chest
      target: spine_target
      match_target_rotation: true
    - type: TwoBoneIK
      upper: pelvis/thigh_l
      lower: pelvis/thigh_l/shin_l
      end: pelvis/thigh_l/shin_l/foot_l
      target: foot_target_l
      pole: knee_pole_l
      soft_limit: 0.0
      match_target_rotation: true
    - type: TwoBoneIK
      upper: pelvis/spine/chest/upper_arm_l
      lower: pelvis/spine/chest/upper_arm_l/lower_arm_l
      end: pelvis/spine/chest/upper_arm_l/lower_arm_l/hand_l
      target: hand_target_l
      pole: elbow_pole_l
      soft_limit: 0.0
      match_target_rotation: true
    - type: TwoBoneIK
      upper: pelvis/thigh_r
      lower: pelvis/thigh_r/shin_r
      end: pelvis/thigh_r/shin_r/foot_r
      target: foot_target_r
      pole: knee_pole_r
      soft_limit: 0.0
      match_target_rotation: true
    - type: TwoBoneIK
      upper: pelvis/spine/chest/upper_arm_r
      lower: pelvis/spine/chest/upper_arm_r/lower_arm_r
      end: pelvis/spine/chest/upper_arm_r/lower_arm_r/hand_r
      target: hand_target_r
      pole: elbow_pole_r
      soft_limit: 0.0
      match_target_rotation: true
    - type: LookAtIK
      bone: pelvis/spine/chest/neck/head
      target: look_target
      max_angle: 89
