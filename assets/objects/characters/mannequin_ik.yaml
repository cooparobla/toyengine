# mannequin_ik: the same 1.8 m rig as mannequin.yaml (rigs/mannequin.yaml), but posed by
# bone-space IK instead of keyframes: a SkeletalAnimator plays the ordinary mannequin clips
# ONLY for the pelvis bone's height bob and root motion (IK overwrites every bone it targets,
# at a later update order, so the animator's contribution to those bones never survives to
# the final pose); a plain Animator drives the floating target/pole empties that steer the IK.
# GENERATED by tools/gen_mannequin.py; edit that, not this file.
object:
  name: mannequin_ik
  components:
    - type: Transform
      position: {x: 0, y: 0, z: 0}
    - type: Rig
      rig: rigs/mannequin.yaml
    - type: SkeletalAnimator
      auto_play: idle
      default_crossfade: 0.2
      states:
        - {name: idle, clip: animations/mannequin/idle.yaml}
        - {name: walk, clip: animations/mannequin/walk.yaml}
        - {name: run, clip: animations/mannequin/run.yaml}
        - {name: jump, clip: animations/mannequin/jump.yaml, wrap: once}
        - {name: ride, clip: animations/mannequin/ride.yaml}
    - type: Animator
      auto_play: idle
      default_crossfade: 0.2
      states:
        - {name: idle, clip: animations/mannequin_ik/idle.yaml}
        - {name: walk, clip: animations/mannequin_ik/walk.yaml}
        - {name: run, clip: animations/mannequin_ik/run.yaml}
        - {name: jump, clip: animations/mannequin_ik/jump.yaml, wrap: once}
        - {name: ride, clip: animations/mannequin_ik/ride.yaml}
    # Spine first (a chain: spine -> chest; the chest takes its target's rotation, twist and
    # all, and the neck rides on it), then the limbs hanging from it, then the head --
    # IkSystem's default order for equal priorities.
    - type: ChainIK
      root: spine
      tip: chest
      target: pelvis_socket/spine_target
      match_target_rotation: true
    - type: TwoBoneIK
      upper: thigh_l
      lower: shin_l
      end: foot_l
      target: foot_target_l
      pole: knee_pole_l
      soft_limit: 0.0
      match_target_rotation: true
    - type: TwoBoneIK
      upper: upper_arm_l
      lower: lower_arm_l
      end: hand_l
      target: pelvis_socket/hand_target_l
      pole: pelvis_socket/elbow_pole_l
      soft_limit: 0.0
      match_target_rotation: true
    - type: TwoBoneIK
      upper: thigh_r
      lower: shin_r
      end: foot_r
      target: foot_target_r
      pole: knee_pole_r
      soft_limit: 0.0
      match_target_rotation: true
    - type: TwoBoneIK
      upper: upper_arm_r
      lower: lower_arm_r
      end: hand_r
      target: pelvis_socket/hand_target_r
      pole: pelvis_socket/elbow_pole_r
      soft_limit: 0.0
      match_target_rotation: true
    - type: LookAtIK
      bone: head
      target: pelvis_socket/look_target
      max_angle: 89
  children:
    - name: pelvis_shape
      components:
        - type: Transform
          rotation: {x: 0, y: -90, z: 0}
          scale: {x: 1, y: 0.8, z: 1}
        - type: BoneAttachment
          bone: pelvis
        - type: MeshRenderer
          mesh_path: mannequin_pelvis
          material: {albedo: {r: 0.62, g: 0.66, b: 0.72}, roughness: 0.55, metallic: 0.05}
      children: []
    - name: abdomen_shape
      components:
        - type: Transform
          position: {x: 0, y: 0.06, z: 0}
          rotation: {x: -90, y: 90, z: 0}
