          radius: 0.055
          height: 0.28
          center: {x: 0, y: 0, z: -0.14}
          mass: 2.5
          joint: cone_twist
          axis: {x: 0, y: 0, z: -1}
          swing: 80
          twist_min: -45
          twist_max: 45
        - bone: pelvis/spine/chest/upper_arm_l/lower_arm_l
