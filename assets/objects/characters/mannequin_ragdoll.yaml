          radius: 0.04
          height: 0.36
          center: {x: 0, y: 0, z: -0.17}
          mass: 2
          joint: hinge
          axis: {x: 1, y: 0, z: 0}
          limit_min: 0
          limit_max: 140
        - bone: pelvis/thigh_l
