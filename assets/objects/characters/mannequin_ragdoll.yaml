# mannequin: a 1.8 m humanoid object-hierarchy rig (joints are empties, parts are capsule
# meshes), facing +Y, origin at the feet. Clips idle / walk / run / jump. Joint names are a
# contract (clips, foot IK and ragdolls address them) -- see tools/gen_mannequin.py.
# With a Ragdoll: R (input_toggle) or Ragdoll::activate() goes limp, deactivate() recovers.
# GENERATED by tools/gen_mannequin.py; edit that, not this file.
format: toyengine-object
object:
  name: mannequin_ragdoll
  components:
    - type: Transform
      position: {x: 0, y: 0, z: 0}
    - type: Animator
      auto_play: idle
      default_crossfade: 0.2
      states:
        - {name: idle, clip: animations/mannequin/idle.yaml}
        - {name: walk, clip: animations/mannequin/walk.yaml}
        - {name: run, clip: animations/mannequin/run.yaml}
        - {name: jump, clip: animations/mannequin/jump.yaml, wrap: once}
    - type: Ragdoll
      mode: animated
      blend_time: 0.6
      recover_state: idle
      drag: 0.05
      angular_drag: 0.8
      bones:
        - bone: pelvis
          shape: capsule
          radius: 0.12
          height: 0.32
          direction: x
          mass: 12
        - bone: pelvis/spine
          shape: capsule
          radius: 0.11
          height: 0.36
          direction: x
          center: {x: 0, y: 0, z: 0.08}
          mass: 8
          joint: cone_twist
          axis: {x: 0, y: 0, z: 1}
          swing: 25
          twist_min: -20
          twist_max: 20
        - bone: pelvis/spine/chest
          shape: capsule
          radius: 0.13
          height: 0.44
          direction: x
          center: {x: 0, y: 0, z: 0.1}
          mass: 12
          joint: cone_twist
          axis: {x: 0, y: 0, z: 1}
          swing: 20
          twist_min: -20
          twist_max: 20
        - bone: pelvis/spine/chest/neck/head
          shape: sphere
          radius: 0.12
          center: {x: 0, y: 0, z: 0.11}
          mass: 5
          joint: cone_twist
          anchor: {x: 0, y: 0, z: -0.05}
          axis: {x: 0, y: 0, z: 1}
          swing: 35
          twist_min: -45
          twist_max: 45
        - bone: pelvis/spine/chest/upper_arm_l
