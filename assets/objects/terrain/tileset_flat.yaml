# tileset_flat: the `flat` terrain tile style -- every piece a styled terrain is built from,
# one child each, named by piece (see toyengine/world/tile_topology.h's TilePiece). A Terrain
# uses it with `styles: { flat: objects/tileset_flat }`; duplicate it in the editor for a new
# look. GENERATED by tools/gen_tile_styles.py; edit that, or a duplicate, not this file.
object:
  name: tileset_flat
  tile_set: true
  components:
    - type: Transform
      position: {x: 0, y: 0, z: 0}
  children:
    - name: top_inner
      components:
        - type: Transform
          position: {x: 1.00, y: 1.00, z: 0}
          rotation: {x: 0, y: 0, z: 180}
        - type: MeshRenderer
          mesh_path: tile_flat_top_inner
          material: {albedo: {r: 0.45, g: 0.72, b: 0.3}, metallic: 0.0, roughness: 0.85}
      children: []
    - name: top_edge
