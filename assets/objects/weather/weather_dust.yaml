# weather_dust: wind-blown sand for `sandstorm` -- streaks of grit racing past the viewer plus a tan haze.
# The wind (strong in a sandstorm) is added to the particles' velocity and drives the haze.
object:
  name: weather_dust
  components:
    - type: Transform
      position: {x: 0, y: 0, z: 0}
  children:
    - name: weather_dust_grit
      components:
        - type: Transform
          position: {x: 0, y: 0, z: 1.5}
        - type: ParticleSystem
          shape: box
          box: {x: 40, y: 40, z: 5}
          rate: 500
          max_particles: 4000
          prewarm: true
          start_lifetime: [2.5, 4.0]
          start_speed: 0.0
          start_size: [0.03, 0.07]
          start_color: {r: 0.80, g: 0.66, b: 0.46, a: 0.7}
          noise_strength: 2.0
          noise_frequency: 0.2
          alpha_over_life: [{t: 0.0, value: 0.0}, {t: 0.15, value: 1.0}, {t: 0.85, value: 1.0}, {t: 1.0, value: 0.0}]
          render_mode: stretched
          sprite: soft
          stretch_speed: 0.03
          lit: 1.0
          scatter: 1.5
          scatter_anisotropy: 0.7
          reactive: 1.0
          sort: none
      children: []
    - name: weather_dust_puffs
      components:
        - type: Transform
          position: {x: 0, y: 0, z: 1.0}
        - type: ParticleSystem
          shape: box
          box: {x: 40, y: 40, z: 2}
          rate: 30
          max_particles: 400
          prewarm: true
          start_lifetime: [4, 6]
          start_speed: 0.0
          start_size: [3.0, 6.0]
          start_color: {r: 0.76, g: 0.62, b: 0.44, a: 0.25}
          size_over_life: [{t: 0.0, value: 0.6}, {t: 1.0, value: 1.4}]
          alpha_over_life: [{t: 0.0, value: 0.0}, {t: 0.3, value: 1.0}, {t: 1.0, value: 0.0}]
          render_mode: billboard
          sprite: puff
          lit: 1.0
          scatter: 1.0
          scatter_anisotropy: 0.6
          soft_distance: 1.0
          sort: distance
      children: []
    - name: weather_dust_haze
      components:
        - type: Transform
          position: {x: 0, y: 0, z: 3}
        - type: Volume
          kind: haze
          shape: box
          extent: {x: 40, y: 40, z: 6}
          falloff: 0.25
          density: 0.05
          noise_scale: 0.15
          coverage: 0.0
          gate_scale: 0.0
          streak: 3.0
          speed: 2.0
          direction: {x: 1, y: 0, z: 0}
          height_falloff: 4.0
          occlusion: 0.6
          sun_amount: 0.9
          color: {r: 0.78, g: 0.62, b: 0.42}
      children: []
