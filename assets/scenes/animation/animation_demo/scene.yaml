# animation_demo -- rigs as object hierarchies, animated by clip files (toyengine + toyeditor).
# GENERATED by tools/gen_animation_demo_scene.py; edit that, not this file.
#
#   * robot_arm: an object-hierarchy rig, clips `wave` (auto-played) and `idle`.
#   * tentacle: a skinned rig -- vertex groups bind the tube mesh to its chain of bones.
#   * bouncing_ball: a squash-and-stretch bounce.
#   * ik_watcher: LookAtIK -- a head tracking a glowing target (clamped, smoothed).
#   * ik_reacher: TwoBoneIK -- an arm reaching for a moving target, its elbow toward a pole.
#   * swarm: behind them, 50 skinned tentacle instances (objects/tentacle) swaying out of phase --
#     the GPU-vs-CPU skinning load:
#       HEADLESS=1 PROFILE=1 MAX_FRAMES=600 SCENE=animation_demo ./build/toyengine
#     with render.skinning: gpu, then cpu, comparing the skinning scopes in the summary.
# Clips and meshes are shared with the object assets (assets/objects/): assets/animations/,
# assets/meshes/ -- paths resolve next to this scene first, then from assets/.
#
# In the toyeditor, select any rig object and open the Timeline tab (bottom panel).
scene:
  scene_name: animation_demo
  root_objects:
    - name: ground
      components:
        - type: Transform
          position: {x: 0, y: 0, z: -0.05}
