# character_cloth_demo -- a FITTED SKIRT on a walking rig: CharacterCloth over a painted mesh.
#
# The garment (meshes/animation/jacket.yaml, GENERATED by tools/gen_jacket_mesh.py) is a closed
# tube around the hips, skinned across spine/pelvis, carrying the cloth channels the editor's
# Cloth Paint mode authors. It is deliberately two things at once:
#
#   * the waist:      max_distance 0 -> WORN. Those vertices ride the skinning exactly, so the
#     garment is fitted and creases with the hips rather than flapping.
#   * below the hips: max_distance ramping to 0.30 m -> a loose skirt that simulates, swings,
#     and is pushed around by the thighs as they swing through it.
#   * backstop + anim_drive in the skirt only: it is kept off the legs and settles back toward
#     its skinned shape at rest instead of hanging dead.
#
# That boundary -- worn above, flowing below -- is the thing to look at. ClothMeshSystem
# simulates it at update order 346, after the rig pose is final (zero frame lag against the walk
# cycle) and before TransformResolve.
#
# It stops at the waist rather than the collar because the mannequin's arms hang against its
# sides and there is no room for fabric between them and its chest -- see the generator's doc,
# which measures both.
#
# Collision is the whole body: auto_colliders fits a capsule around every PART MESH riding the
# rig, so the legs genuinely displace the skirt and no limb reaches past its own collider. World
# collision is on too, so the ground is there.
#
# Select the jacket and press the inspector's "Paint Cloth Channels" to repaint it.
#
#   HEADLESS=1 MAX_FRAMES=240 ./build/toyengine animation/character_cloth_demo
scene:
  scene_name: character_cloth_demo
  render:
    skinning: gpu
  root_objects:
    - name: ground
      components:
        - type: Transform
          position: {x: 0, y: 0, z: -0.05}
          scale: {x: 10, y: 10, z: 0.1}
        - type: MeshRenderer
          mesh_path: cube
          material: {albedo: {r: 0.40, g: 0.43, b: 0.47}, metallic: 0.0, roughness: 0.9}
        - type: BoxCollider
          size: {x: 1.0, y: 1.0, z: 1.0}
      children: []
    - name: hero
      prefab: objects/characters/mannequin
      components:
        - type: Transform
          position: {x: 0, y: 0, z: 0}
        # Merged onto the prefab's own SkeletalAnimator: same clip list, walking instead of idle.
        - type: SkeletalAnimator
          auto_play: walk
      children:
        - name: jacket
          components:
            - type: Transform
            # No mesh_path: the SkinnedMeshRenderer below supplies the mesh, this supplies the
            # material. cull_backfaces off -- the skirt's inside shows whenever it lifts.
            - type: MeshRenderer
              material:
                # Deliberately nothing like the mannequin's grey: the whole point of the demo is
                # watching where the garment stops following the body, which is invisible when
                # the two are the same colour.
                albedo: {r: 0.46, g: 0.10, b: 0.16}
                metallic: 0.0
                roughness: 0.72
                cull_backfaces: false
                affects_reflection_probes: false
            - type: SkinnedMeshRenderer
              mesh_path: animation/jacket
              rig: hero
            - type: CharacterCloth
              mass_per_area: 0.30
              # Softer than the engine default (5e-3): the skirt's rings are 6 cm apart, half the
              # ball demo's spacing, so the same fabric creases over a shorter span.
              bend_compliance: 0.008
              damping: 0.10
              # 6 mm, not the usual 30: at the hip the hands sweep within 18 mm of the pelvis on
              # each stride, and a standoff of 10 mm on BOTH surfaces leaves the fabric nothing to
              # occupy -- it gets squeezed and ends up inside one of them.
              thickness: 0.006
              friction: 0.45
              anim_drive_compliance: 0.0015
              air_drag: 0.04
              air_lift: 0.03
              weather_wind: 1.0
              # No bone_colliders: auto_colliders fits a capsule around each PART MESH riding the
              # rig -- the body a viewer actually sees -- so the thighs push the skirt aside as
              # they swing and no limb reaches past its own collider. This scene used to carry a
              # dozen hand-measured corrections here, copied out of gen_mannequin.py by eye; they
              # were all either the fit the system now derives or (hands, chest, pelvis) 3-5 cm
              # SHORT of the drawn part, which is cloth laid straight through a limb. Write an
              # entry only to correct a part the automatic fit cannot describe -- a box-section
              # shape -- or to drop one with `radius: 0`.
          children: []
    - name: camera
      components:
        - type: Transform
          position: {x: 2.4, y: -2.6, z: 1.5}
        - type: Camera
          main: true
          fov: 50
        - type: CameraController
          mode: orbit
          tracker: hero
          distance: 3.2
          # Orbit looks at the tracker's ORIGIN plus this -- the mannequin's origin is at its
          # feet, so without it the whole frame is ground. (`height:` is not an orbit key; it
          # parses as nothing at all.)
          target_offset: {x: 0.0, y: 0.0, z: 0.95}
          pitch_deg: 10.0
      children: []
    - name: sun
      components:
        - type: Transform
        - type: DirectionalLight
          direction: {x: -0.45, y: 0.35, z: -0.82}
          intensity: 1.15
          cast_shadows: true
          shadow_intensity: 0.6
      children: []
