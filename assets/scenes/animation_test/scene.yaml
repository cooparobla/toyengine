# animation_test -- rigs as object hierarchies, animated by clip files (toyengine + toyeditor).
# GENERATED by tools/gen_animation_test_scene.py; edit that, not this file.
#
#   * RobotArm: an object-hierarchy rig, clips `wave` (auto-played) and `idle`.
#   * Tentacle: a skinned rig -- vertex groups bind the tube mesh to its chain of bones.
#   * BouncingBall: a squash-and-stretch bounce.
# Clips and meshes are shared with the object assets (assets/objects/): assets/animations/,
# assets/meshes/ -- paths resolve next to this scene first, then from assets/.
#
# In the toyeditor, select any rig object and open the Timeline tab (bottom panel).
format: blender
scene:
  scene_name: AnimationTest
  root_objects:
    - name: Ground
      components:
        - type: Transform
          position: {x: 0, y: 0, z: -0.05}
          scale: {x: 12, y: 8, z: 0.1}
        - type: MeshRenderer
          mesh_path: cube
          material: {albedo: {r: 0.42, g: 0.45, b: 0.48}, metallic: 0.0, roughness: 0.9}
        - type: BoxCollider
          size: {x: 1.0, y: 1.0, z: 1.0}
      children: []
    - name: RobotArm
      components:
        - type: Transform
          position: {x: -2.2, y: 0.0, z: 0.0}
        - type: Animator
          auto_play: wave
          states:
            - {name: wave, clip: animations/RobotArm/wave.yaml}
            - {name: idle, clip: animations/RobotArm/idle.yaml}
      children:
        - name: Base
          components:
            - type: Transform
              position: {x: 0, y: 0, z: 0}
          children:
            - name: BasePlate
              components:
                - type: Transform
                  position: {x: 0, y: 0, z: 0.15}
                  scale: {x: 0.9, y: 0.9, z: 0.3}
                - type: MeshRenderer
                  mesh_path: cube
                  material: {albedo: {r: 0.2, g: 0.22, b: 0.25}, metallic: 0.2, roughness: 0.45}
              children: []
            - name: Shoulder
              components:
                - type: Transform
                  position: {x: 0, y: 0, z: 0.35}
              children:
                - name: ShoulderJoint
                  components:
                    - type: Transform
                      position: {x: 0, y: 0, z: 0}
                      scale: {x: 0.36, y: 0.36, z: 0.36}
                    - type: MeshRenderer
                      mesh_path: cube
                      material: {albedo: {r: 0.95, g: 0.5, b: 0.15}, metallic: 0.2, roughness: 0.45}
                  children: []
                - name: UpperArm
                  components:
                    - type: Transform
                      position: {x: 0, y: 0, z: 0}
                  children:
                    - name: UpperArmShape
                      components:
                        - type: Transform
                          position: {x: 0, y: 0, z: 0.55}
                          scale: {x: 0.26, y: 0.26, z: 1.1}
                        - type: MeshRenderer
                          mesh_path: cube
                          material: {albedo: {r: 0.55, g: 0.58, b: 0.62}, metallic: 0.2, roughness: 0.45}
                      children: []
                    - name: Elbow
                      components:
                        - type: Transform
                          position: {x: 0, y: 0, z: 1.1}
                      children:
                        - name: ElbowJoint
                          components:
                            - type: Transform
                              position: {x: 0, y: 0, z: 0}
                              scale: {x: 0.3, y: 0.3, z: 0.3}
                            - type: MeshRenderer
                              mesh_path: cube
                              material: {albedo: {r: 0.95, g: 0.5, b: 0.15}, metallic: 0.2, roughness: 0.45}
                          children: []
                        - name: Forearm
                          components:
                            - type: Transform
                              position: {x: 0, y: 0, z: 0}
                          children:
                            - name: ForearmShape
                              components:
                                - type: Transform
                                  position: {x: 0, y: 0, z: 0.45}
                                  scale: {x: 0.2, y: 0.2, z: 0.9}
                                - type: MeshRenderer
                                  mesh_path: cube
                                  material: {albedo: {r: 0.55, g: 0.58, b: 0.62}, metallic: 0.2, roughness: 0.45}
                              children: []
                            - name: Wrist
                              components:
                                - type: Transform
                                  position: {x: 0, y: 0, z: 0.9}
                              children:
                                - name: Hand
                                  components:
                                    - type: Transform
                                      position: {x: 0, y: 0, z: 0.1}
                                  children:
                                    - name: Palm
                                      components:
                                        - type: Transform
                                          position: {x: 0, y: 0, z: 0}
                                          scale: {x: 0.34, y: 0.16, z: 0.12}
                                        - type: MeshRenderer
                                          mesh_path: cube
                                          material: {albedo: {r: 0.95, g: 0.5, b: 0.15}, metallic: 0.2, roughness: 0.45}
                                      children: []
                                    - name: FingerL
                                      components:
                                        - type: Transform
                                          position: {x: -0.12, y: 0, z: 0.18}
                                          scale: {x: 0.06, y: 0.12, z: 0.28}
                                        - type: MeshRenderer
                                          mesh_path: cube
                                          material: {albedo: {r: 0.2, g: 0.22, b: 0.25}, metallic: 0.2, roughness: 0.45}
                                      children: []
                                    - name: FingerR
                                      components:
                                        - type: Transform
                                          position: {x: 0.12, y: 0, z: 0.18}
                                          scale: {x: 0.06, y: 0.12, z: 0.28}
                                        - type: MeshRenderer
                                          mesh_path: cube
                                          material: {albedo: {r: 0.2, g: 0.22, b: 0.25}, metallic: 0.2, roughness: 0.45}
                                      children: []
    - name: Tentacle
      components:
        - type: Transform
          position: {x: 0.8, y: 0.6, z: 0.0}
        - type: Animator
          auto_play: sway
          states:
            - {name: sway, clip: animations/Tentacle/sway.yaml}
      children:
        - name: Seg0
          components:
            - type: Transform
              position: {x: 0, y: 0, z: 0.0}
          children:
            - name: Seg1
              components:
                - type: Transform
                  position: {x: 0, y: 0, z: 0.75}
              children:
                - name: Seg2
                  components:
                    - type: Transform
                      position: {x: 0, y: 0, z: 0.75}
                  children:
                    - name: Seg3
                      components:
                        - type: Transform
                          position: {x: 0, y: 0, z: 0.75}
                      children:
                        []
        - name: TentacleSkin
          components:
            - type: Transform
            - type: MeshRenderer
              material: {albedo: {r: 0.45, g: 0.75, b: 0.6}, metallic: 0.0, roughness: 0.5}
            - type: SkinnedMeshRenderer
              mesh_path: tentacle
          children: []
    - name: BouncingBall
      components:
        - type: Transform
          position: {x: 3.2, y: -1.2, z: 0.0}
        - type: Animator
          auto_play: bounce
          states:
            - {name: bounce, clip: animations/BouncingBall/bounce.yaml}
      children:
        - name: Ball
          components:
            - type: Transform
              position: {x: 0, y: 0, z: 2.2}
              scale: {x: 0.6, y: 0.6, z: 0.6}
            - type: MeshRenderer
              mesh_path: ball
              material: {albedo: {r: 0.85, g: 0.15, b: 0.2}, metallic: 0.0, roughness: 0.35}
          children: []
    - name: Camera
      components:
        - type: Transform
          position: {x: 0.5, y: -9.0, z: 3.4}
          rotation: {x: 78.0, y: 0.0, z: 0.0}
        - type: Camera
          main: true
          projection: Perspective
          fov: 50.0
          near_clip_plane: 0.1
          far_clip_plane: 200.0
        - type: CameraController
          mode: orbit
          target: {x: 0.5, y: 0.0, z: 1.3}
          distance: 9.0
          yaw_deg: 0.0
          pitch_deg: 16.0
          movement_smoothing: 0.25
          min_distance: 2.0
          max_distance: 40.0
          capture_cursor: true
      children: []
    - name: Sun
      components:
        - type: Transform
          position: {x: 0, y: 0, z: 10}
        - type: DirectionalLight
          direction: {x: -0.45, y: 0.4, z: -0.8}
          color: {r: 1.0, g: 0.96, b: 0.9}
          intensity: 1.3
          cast_shadows: true
          shadow_intensity: 1.0
      children: []
    - name: Sky
      components:
        - type: Transform
        - type: EnvironmentLight
          sky_color: {r: 0.5, g: 0.62, b: 0.85}
          ground_color: {r: 0.22, g: 0.2, b: 0.18}
          sky_intensity: 1.0
      children: []
