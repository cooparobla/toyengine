# audio_panel -- the audio_demo control panel: Music / Spatial / UI Sounds / Mixer tabs.
#
# Everything is wired in YAML with reactors on the root (MusicOnSignal, AudioSourceOnSignal,
# PlaySoundOnSignal) listening to the buttons and toggles by name, and a UiSoundPlayer giving
# every widget hover / press / value / tab sounds. Generated by tools/gen_audio_demo_scene.py.
object:
  name: audio_panel
  components:
    - type: RectTransform
      anchor_min: {x: 0, y: 0}
      anchor_max: {x: 1, y: 1}
      pivot: {x: 0.5, y: 0.5}
      anchored_position: {x: 0, y: 0}
      size_delta: {x: 0, y: 0}
    - type: Canvas
      mode: ScaleWithScreenSize
      reference_resolution: {x: 1920, y: 1080}
      match_width_or_height: 0.5
      sort_order: 10
    - {type: Theme, source: ui/themes/default.yaml}
    - type: UiSoundPlayer
      cues:
        - {signal: hover_enter, sound: ui_hover_tick, min_interval: 0.04}
        - {signal: press, sound: ui_click_soft}
        - {signal: value_changed, sound: ui_slider_tick, min_interval: 0.03}
        - {signal: selection_changed, sound: ui_tab_switch}
    - {type: MusicOnSignal, listen_object: MusicPrevious, listen_signal: click, action: previous}
    - {type: MusicOnSignal, listen_object: MusicPause, listen_signal: click, action: toggle_pause}
    - {type: MusicOnSignal, listen_object: MusicNext, listen_signal: click, action: next}
    - {type: MusicOnSignal, listen_object: MusicStop, listen_signal: click, action: stop}
    - {type: MusicOnSignal, listen_object: PlayMeadow, listen_signal: click, action: play, track: meadow, fade: 2.5}
    - {type: MusicOnSignal, listen_object: PlayExpedition, listen_signal: click, action: play, track: expedition, fade: 2.5}
    - {type: MusicOnSignal, listen_object: PlayNocturne, listen_signal: click, action: play, track: nocturne, fade: 2.5}
    - {type: MusicOnSignal, listen_object: MusicPop, listen_signal: click, action: pop}
    - {type: MusicOnSignal, listen_object: MusicPush, listen_signal: click, action: push, track: expedition, fade: 0.4}
    - {type: MusicOnSignal, listen_object: MusicPlaylist, listen_signal: click, action: playlist, target: music}
    - {type: AudioSourceOnSignal, listen_object: BeaconNorth, listen_signal: value_changed, action: follow, target: beacon_north}
    - {type: AudioSourceOnSignal, listen_object: BeaconEast, listen_signal: value_changed, action: follow, target: beacon_east}
    - {type: AudioSourceOnSignal, listen_object: BeaconSouth, listen_signal: value_changed, action: follow, target: beacon_south}
    - {type: AudioSourceOnSignal, listen_object: BeaconWest, listen_signal: value_changed, action: follow, target: beacon_west}
    - {type: AudioSourceOnSignal, listen_object: Drone, listen_signal: value_changed, action: follow, target: drone}
    - {type: AudioSourceOnSignal, listen_object: Crickets, listen_signal: value_changed, action: follow, target: crickets}
    - {type: AudioSourceOnSignal, listen_object: Chimes, listen_signal: value_changed, action: follow, target: chimes}
    - {type: AudioSourceOnSignal, listen_object: Campfire, listen_signal: value_changed, action: follow, target: campfire}
    - {type: AudioSourceOnSignal, listen_object: MusicBox, listen_signal: value_changed, action: follow, target: music_box}
    - {type: AudioSourceOnSignal, listen_object: PingLeft, listen_signal: click, action: play, target: ping_left}
    - {type: AudioSourceOnSignal, listen_object: PingRight, listen_signal: click, action: play, target: ping_right}
    - {type: AudioSourceOnSignal, listen_object: PingFront, listen_signal: click, action: play, target: ping_front}
    - {type: AudioSourceOnSignal, listen_object: PingBehind, listen_signal: click, action: play, target: ping_behind}
    - {type: AudioSourceOnSignal, listen_object: PingAbove, listen_signal: click, action: play, target: ping_above}
    - {type: PlaySoundOnSignal, listen_object: SoundConfirm, listen_signal: click, sound: confirm}
    - {type: PlaySoundOnSignal, listen_object: SoundDenied, listen_signal: click, sound: denied}
    - {type: PlaySoundOnSignal, listen_object: SoundCoin, listen_signal: click, sound: coin}
    - {type: PlaySoundOnSignal, listen_object: SoundLevelUp, listen_signal: click, sound: level_up}
    - {type: PlaySoundOnSignal, listen_object: SoundError, listen_signal: click, sound: error}
    - {type: PlaySoundOnSignal, listen_object: SoundNotify, listen_signal: click, sound: notify}
    - {type: PlaySoundOnSignal, listen_object: SoundPageTurn, listen_signal: click, sound: page_turn}
    - {type: PlaySoundOnSignal, listen_object: SoundPowerup, listen_signal: click, sound: powerup}
    - {type: PlaySoundOnSignal, listen_object: SoundWhoosh, listen_signal: click, sound: whoosh_short}
  children:
    - name: Panel
      components:
