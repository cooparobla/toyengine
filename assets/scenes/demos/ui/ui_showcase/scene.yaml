# UI showcase: the HUD (prefab: ui/hud) over a small scene, with a world-space nameplate.
# HealthDriver binds the HUD's Health bar by name. Generated by tools/gen_ui_templates.py.
format: toyengine
scene:
  scene_name: ui_showcase
  root_objects:
    - name: Camera
      components:
        - type: Transform
          position: {x: 6, y: -8, z: 5}
        - {type: Camera, main: true, fov: 55}
        - type: CameraController
          mode: Orbit
          target: {x: 0, y: 0, z: 1}
          distance: 11
          pitch_deg: 22
    - name: Sun
      components:
        - {type: Transform}
        - type: DirectionalLight
          direction: {x: -0.4, y: -0.5, z: -0.75}
          intensity: 1.2
          cast_shadows: true
    - name: Ground
      components:
        - type: Transform
          scale: {x: 12, y: 12, z: 1}
        - {type: MeshRenderer, mesh_path: plane, material: materials/stone}
    - name: Hero
      components:
        - type: Transform
          position: {x: 0, y: 0, z: 1}
        - {type: MeshRenderer, mesh_path: cube, material: materials/copper}
      children:
        - name: Nameplate
          components:
            - type: Transform
              position: {x: 0, y: 0, z: 1.3}
            - {type: RectTransform, anchor_preset: StretchAll}
            - type: Canvas
              render_mode: WorldSpace
              world_size: {x: 260, y: 60}
              pixels_per_unit: 160
              text_supersample: 2
            - {type: Theme, source: ui/themes/default.yaml}
          children:
            - name: HeroName
              components:
                - type: RectTransform
                  anchor_min: {x: 0, y: 1}
                  anchor_max: {x: 1, y: 1}
                  pivot: {x: 0.5, y: 1}
                  anchored_position: {x: 0, y: 0}
                  size_delta: {x: 0, y: 30}
                - {type: ThemedText, text: Aldric, font_role: Heading, align: Center}
            - name: HeroHealth
              components:
                - type: RectTransform
                  anchor_min: {x: 0, y: 0}
                  anchor_max: {x: 1, y: 0}
                  pivot: {x: 0.5, y: 0}
                  anchored_position: {x: 0, y: 4}
                  size_delta: {x: -20, y: 18}
                - {type: StatBar, role: health, max: 100, value: 100, show_label: false, bar_height: 14}
    - name: hud
      prefab: ui/hud
      components:
        - {type: HealthDriver, bar_object: Health, max_health: 100, damage_per_second: 18, regen_per_second: 12}
