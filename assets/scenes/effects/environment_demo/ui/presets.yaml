# environment_demo's preset panel: pick which environment plays in the clearing.
#
# A scene-local UI asset (the scene references it as `prefab: ui/presets`, resolved next to
# scene.yaml). Deliberately NOT in assets/ui/ -- those files are generated by
# tools/gen_ui_templates.py and would be overwritten.
#
# Styled with ui/themes/blender.yaml rather than default.yaml: that theme was generated from
# editor/themes/blender_dark.yaml, so it IS the editor's palette -- neutral greys, a #4772b3
# blue, 30 px rows. The panel folds away from its header so the clearing is never obscured.
#
# Each MenuList item's `name` is the channel its click is published on (the scene event bus,
# keyed by object name). EnvPresetSwitcher in scene.yaml listens on those eight names; nothing
# here knows what a preset is.
object:
  name: preset_panel
  components:
    - type: RectTransform
      anchor_min: {x: 0, y: 0}
      anchor_max: {x: 1, y: 1}
      pivot: {x: 0.5, y: 0.5}
      anchored_position: {x: 0, y: 0}
      size_delta: {x: 0, y: 0}
    - type: Canvas
      mode: ScaleWithScreenSize
      reference_resolution: {x: 1920, y: 1080}
      match_width_or_height: 0.5
      sort_order: 50
    - {type: Theme, source: ui/themes/blender.yaml}
  children:
    # Anchored TOP-LEFT: anchor and pivot at {0, 1}. y = 1 is the top, so the panel moves DOWN
    # the screen with a NEGATIVE anchored_position.y.
    - name: Dock
      components:
        - type: RectTransform
          anchor_min: {x: 0, y: 1}
          anchor_max: {x: 0, y: 1}
          pivot: {x: 0, y: 1}
          anchored_position: {x: 24, y: -24}
          size_delta: {x: 330, y: 470}
        # A column with a size fitter, so the framed box shrinks to the header when the
        # Collapsible folds instead of leaving an empty frame hanging below it.
        - {type: VerticalLayoutGroup, spacing: 8, child_force_expand_width: true}
        - {type: ContentSizeFitter, vertical_fit: PreferredSize}
      children:
        - name: Environment
          components:
            - type: RectTransform
              size_delta: {x: 330, y: 404}
            # expanded_extent is the open height to restore when unfolding. Without it the first
            # collapse shrinks this object to its header and the re-expand has nothing to grow
            # back to -- CollapsiblePanel never writes a negative extent.
            - {type: Collapsible, title: Environment, start_expanded: true, expanded_extent: 404}
          children:
            - name: Presets
              components:
                - type: RectTransform
                  size_delta: {x: 310, y: 300}
                - type: MenuList
                  direction: vertical
                  align: UpperCenter
                  button_height: 34
                  spacing: 4
                  items:
                    - {name: BtnCalm, label: "Calm"}
                    - {name: BtnRotor, label: "Rotor Downwash"}
                    - {name: BtnSwing, label: "Sword Swing"}
                    - {name: BtnVent, label: "Steam Vent"}
                    - {name: BtnPuddle, label: "Puddle"}
                    - {name: BtnSnowPile, label: "Snow Pile"}
                    - {name: BtnGale, label: "Gale"}
                    - {name: BtnShelter, label: "Gale + Shelter"}
            # EnvPresetSwitcher writes the active preset's one-line blurb here.
            - name: PresetLabel
              components:
                - type: RectTransform
                  size_delta: {x: 310, y: 54}
                - {type: ThemedText, text: "Pick an environment.", font_role: Caption, align: Left, wrap: true}
    - name: Hint
      components:
        - type: RectTransform
          anchor_min: {x: 0, y: 0}
          anchor_max: {x: 0, y: 0}
          pivot: {x: 0, y: 0}
          anchored_position: {x: 24, y: 20}
          size_delta: {x: 560, y: 22}
        - {type: ThemedText, text: "Right-drag to orbit. Wheel to zoom.", font_role: Caption, align: Left}
