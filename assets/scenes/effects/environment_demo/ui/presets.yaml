# environment_demo's preset bar: pick which environment plays in the clearing.
#
# A scene-local UI asset (the scene references it as `prefab: ui/presets`, resolved next to
# scene.yaml). Deliberately NOT in assets/ui/ -- those files are generated by
# tools/gen_ui_templates.py and would be overwritten.
#
# Each ActionBar item's `name` is the channel its click is published on (the scene event bus,
# keyed by object name). EnvPresetSwitcher in scene.yaml listens on those six names; nothing
# here knows what a preset is.
object:
  name: preset_bar
  components:
    - type: RectTransform
      anchor_min: {x: 0, y: 0}
      anchor_max: {x: 1, y: 1}
      pivot: {x: 0.5, y: 0.5}
      anchored_position: {x: 0, y: 0}
      size_delta: {x: 0, y: 0}
    - type: Canvas
      mode: ScaleWithScreenSize
      reference_resolution: {x: 1920, y: 1080}
      match_width_or_height: 0.5
      sort_order: 50
    - {type: Theme, source: ui/themes/default.yaml}
  children:
    # A wide bar across the bottom: the buttons in a row, the active preset's blurb under them.
    - name: Bar
      components:
        - type: RectTransform
          anchor_min: {x: 0.5, y: 0}
          anchor_max: {x: 0.5, y: 0}
          pivot: {x: 0.5, y: 0}
          anchored_position: {x: 0, y: 28}
          size_delta: {x: 1280, y: 150}
        - {type: ThemedPanel, style: panel, shadow: true}
      children:
        - name: Title
          components:
            - type: RectTransform
              anchor_min: {x: 0, y: 1}
              anchor_max: {x: 1, y: 1}
              pivot: {x: 0.5, y: 1}
              anchored_position: {x: 0, y: -10}
              size_delta: {x: -32, y: 24}
            - {type: ThemedText, text: "Environment", font_role: Heading, align: Center}
        - name: Buttons
          components:
            - type: RectTransform
              anchor_min: {x: 0.5, y: 1}
              anchor_max: {x: 0.5, y: 1}
              pivot: {x: 0.5, y: 1}
              anchored_position: {x: 0, y: -40}
              size_delta: {x: 1232, y: 56}
            - type: ActionBar
              align: MiddleCenter
              button_height: 52
              button_width: 192
              spacing: 10
              items:
                - {name: BtnCalm, label: "Calm"}
                - {name: BtnRotor, label: "Rotor Downwash"}
                - {name: BtnSwing, label: "Sword Swing"}
                - {name: BtnVent, label: "Steam Vent"}
                - {name: BtnGale, label: "Gale"}
                - {name: BtnShelter, label: "Gale + Shelter"}
        # EnvPresetSwitcher writes the active preset's one-line blurb here.
        - name: PresetLabel
          components:
            - type: RectTransform
              anchor_min: {x: 0, y: 0}
              anchor_max: {x: 1, y: 0}
              pivot: {x: 0.5, y: 0}
              anchored_position: {x: 0, y: 12}
              size_delta: {x: -32, y: 22}
            - {type: ThemedText, text: "Pick an environment below.", font_role: Caption, align: Center}
    - name: Hint
      components:
        - type: RectTransform
          anchor_min: {x: 0, y: 1}
          anchor_max: {x: 0, y: 1}
          pivot: {x: 0, y: 1}
          anchored_position: {x: 24, y: -20}
          size_delta: {x: 520, y: 24}
        - {type: ThemedText, text: "Right-drag to orbit. Wheel to zoom.", font_role: Caption, align: Left}
