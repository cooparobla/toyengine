# One line of instructions, bottom left.
ui:
  name: hint
  canvas:
    reference_resolution: {x: 1920, y: 1080}
  root:
    name: Root
    components:
      - type: RectTransform
        anchor_min: {x: 0, y: 0}
        anchor_max: {x: 1, y: 1}
    children:
      - name: Hint
        components:
          - type: RectTransform
            anchor_min: {x: 0, y: 0}
            anchor_max: {x: 0, y: 0}
            pivot: {x: 0, y: 0}
            anchored_position: {x: 24, y: 20}
            size_delta: {x: 760, y: 22}
          - {type: ThemedText, text: "Left-click a chair to set it alight. R resets. Right-drag to orbit.", font_role: Caption, align: Left}
