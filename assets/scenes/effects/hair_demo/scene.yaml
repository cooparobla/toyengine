                  rotation: { x: 0.0, y: 0.0, z: 0.0 }
                  scale: { x: 1.0, y: 1.0, z: 1.0 }
                - type: Curve
                  always_show: true
                  closed: false
                  points:
                    - mode: auto
                      p: [0.0, 0.0, 1.0]
                    - mode: auto
                      p: [0.26, 0.0, 1.34]
                    - mode: auto
                      p: [0.62, 0.0, 1.33]
                    - mode: auto
                      p: [0.86, 0.0, 1.04]
