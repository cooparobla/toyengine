              children: []
            - name: guide_left
              active: true
              components:
                - type: Transform
                  position: { x: 0.0, y: 0.0, z: 0.0 }
                  rotation: { x: 0.0, y: 0.0, z: 0.0 }
                  scale: { x: 1.0, y: 1.0, z: 1.0 }
                - type: Curve
                  always_show: true
                  closed: false
                  points:
                    - mode: auto
                      p: [0.0, 0.92, 0.38]
                    - mode: auto
                      p: [0.28, 1.2, 0.52]
                    - mode: auto
                      p: [0.62, 1.3, 0.3]
                    - mode: auto
                      p: [0.8, 1.28, -0.02]
                  resolution: 12
              children: []
            - name: guide_right
              active: true
              components:
                - type: Transform
                  position: { x: 0.0, y: 0.0, z: 0.0 }
                  rotation: { x: 0.0, y: 0.0, z: 0.0 }
                  scale: { x: 1.0, y: 1.0, z: 1.0 }
                - type: Curve
                  always_show: true
                  closed: false
                  points:
                    - mode: auto
                      p: [0.0, -0.92, 0.38]
                    - mode: auto
                      p: [0.28, -1.2, 0.52]
                    - mode: auto
                      p: [0.62, -1.3, 0.3]
                    - mode: auto
                      p: [0.8, -1.28, -0.02]
                  resolution: 12
              children: []
    - name: chunky_hair
      active: true
      components:
        - type: Transform
          position: { x: 0.6, y: 0.0, z: 1.2 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.62, g: 0.74, r: 0.9 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.7
          mesh_path: sphere
        - type: Hair
          clump: 0.0
          curl: 0.6
          curl_radius: 0.07
          density: 1.1
          droop: 0.6
          frizz_degrees: 14.0
          guides: Guides
          length: 0.9
          length_jitter: 0.25
          material:
            albedo: { b: 0.14, g: 0.09, r: 0.08 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.28
          max_strands: 24
          seed: 21
          segments: 10
          shape: tube
          sides: 5
          thickness: 0.04
          thickness_over_length:
            - [0.0, 1.0]
            - [0.75, 0.9]
            - [1.0, 0.35]
          wind_flexibility: 0.14
          wind_frequency: 2.0
      children:
        - name: Guides
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 1.0, y: 1.0, z: 1.0 }
          children:
            - name: guide
              active: true
              components:
                - type: Transform
                  position: { x: 0.0, y: 0.0, z: 0.0 }
                  rotation: { x: 0.0, y: 0.0, z: 0.0 }
                  scale: { x: 1.0, y: 1.0, z: 1.0 }
                - type: Curve
                  always_show: true
                  closed: false
                  points:
                    - in: [0.258978009223938, -0.6380984783172607, 0.7173960208892822]
                      mode: aligned
                      out: [0.258978009223938, -0.6380984783172607, 0.7173960208892822]
                      p: [0.258978009223938, -0.6380984783172607, 0.7173960208892822]
                    - in: [0.38713541626930237, -0.7981117367744446, 0.956783652305603]
                      mode: aligned
                      out: [0.4987330734729767, -1.0266586542129517, 0.5141538381576538]
                      p: [0.4429342448711395, -0.9123852252960205, 0.7354687452316284]
                    - in: [0.45298510789871216, -0.8825365304946899, 0.6753913164138794]
                      mode: aligned
                      out: [0.45893722772598267, -1.0245939493179321, 0.46340903639793396]
                      p: [0.45893722772598267, -1.0245939493179321, 0.46340903639793396]
                  resolution: 12
              children: []
            - name: guide_001
              active: true
              components:
                - type: Transform
                  position: { x: 0.0, y: 0.0, z: 0.0 }
                  rotation: { x: 0.0, y: 0.0, z: 0.0 }
                  scale: { x: 1.0, y: 1.0, z: 1.0 }
                - type: Curve
                  always_show: true
                  closed: false
                  points:
                    - in: [0.09274840354919434, 0.9675314426422119, 0.19860124588012695]
                      mode: aligned
                      out: [0.09274840354919434, 0.9675314426422119, 0.19860124588012695]
                      p: [0.09274840354919434, 0.9675314426422119, 0.19860124588012695]
                    - in: [0.09274840354919434, 1.149986743927002, 0.2789672613143921]
                      mode: aligned
                      out: [0.09274840354919434, 1.2988263368606567, 0.06088383495807648]
                      p: [0.09274840354919434, 1.2281911373138428, 0.16438031196594238]
                    - in: [0.09274840354919434, 1.2672932147979736, -0.17730799317359924]
                      mode: aligned
                      out: [0.09274840354919434, 1.2672932147979736, -0.17730799317359924]
                      p: [0.09274840354919434, 1.2672932147979736, -0.17730799317359924]
                  resolution: 12
              children: []
    - name: fur_box
      active: true
      components:
        - type: Transform
          position: { x: 3.2, y: 0.0, z: 0.9 }
          rotation: { x: 0.0, y: 0.0, z: 18.0 }
          scale: { x: 0.9, y: 0.9, z: 0.9 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.22, g: 0.28, r: 0.35 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.85
          mesh_path: cube
        - type: Hair
          clump: 0.5
          clump_density: 0.03
          cross_section: 2
          density: 2.6e+03
          droop: 0.5
          frizz_degrees: 16.0
          length: 0.13
          length_jitter: 0.4
          material:
            albedo: { b: 0.19, g: 0.33, r: 0.46 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.5
          max_strands: 9000
          root_mask: textures/hair/fur_mask.png
          seed: 3
          segments: 5
          shape: ribbon
          thickness: 0.0035
          thickness_over_length:
            - [0.0, 1.0]
            - [1.0, 0.15]
          wind_flexibility: 0.16
          wind_frequency: 4.5
      children: []
    - name: swinging_tail
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 2.6, z: 1.6 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.55, y: 0.55, z: 0.55 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.3, g: 0.45, r: 0.8 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.6
          mesh_path: sphere
        - { type: SphereCollider, radius: 1.0 }
        - { type: Rigidbody, is_kinematic: true, mass: 1.0, use_gravity: false }
        - type: KinematicMover
          axis: { x: 1.0, y: 0.0, z: 0.0 }
          distance: 1.6
          mode: pingpong
          speed: 1.1
        - type: Hair
          clump: 0.4
          clump_density: 0.04
          cross_section: 2
          density: 7.0e+02
          droop: 2.61
          frizz_degrees: 7.0
          length: 2.5
          length_jitter: 0.2
          material:
            albedo: { b: 0.23466666042804718, g: 0.7333333492279053, r: 0.47402656078338623 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.3
          max_strands: 2500
          seed: 11
          segments: 10
          shape: ribbon
          sim_curl_hold: 0.15
          sim_damping: 0.03
          sim_drag: 0.35
          sim_guides: 48
          sim_stiffness: 0.05
          sim_stiffness_falloff: 2.4
          simulate: true
          thickness: 0.2
          thickness_over_length:
            - [0.0, 1.0]
            - [1.0, 0.3]
          weather_wind: 1.0
          wind_flexibility: 0.0
      children: []
    - name: head_on_neck
      active: true
      components:
        - type: Transform
          position: { x: -2.2, y: -2.6, z: 1.95 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.5, y: 0.5, z: 0.5 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.72, g: 0.64, r: 0.58 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.55
          mesh_path: sphere
        # Yaws +-28 deg, pingpong -- the neck stays put underneath (its collider is coaxial
        # with this rotation, so the capsule the hair drapes over never moves), while the head
        # and its hair swing like a "no" shake. object: "" animates this object itself.
        - type: Animator
          auto_play: shake
          states:
            - { name: shake, clip: animations/head_on_neck/shake.yaml }
        - type: Hair
          clump: 0.3
          clump_density: 0.04
          cross_section: 2
          density: 4.0e+02
          droop: 2.2
          frizz_degrees: 6.0
          length: 1.1
          length_jitter: 0.25
          material:
            albedo: { b: 0.22, g: 0.16, r: 0.11 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.35
          max_strands: 1500
          seed: 5
          segments: 10
          shape: ribbon
          sim_damping: 0.04
          sim_drag: 0.3
          sim_guides: 20
          sim_stiffness: 0.08
          sim_stiffness_falloff: 2.0
          simulate: true
          thickness: 0.07
          thickness_over_length:
            - [0.0, 1.0]
            - [1.0, 0.3]
          wind_flexibility: 0.0
      children: []
    # The collision demo this groom's hair drapes over: a static capsule standing in for a neck,
    # positioned directly below head_on_neck so its long, droopy strands settle against it rather
    # than passing through -- the scenario hair_collision_test.cpp proves numerically.
    - name: neck
      active: true
      components:
        - type: Transform
          position: { x: -2.2, y: -2.6, z: 1.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.85, y: 0.85, z: 0.69 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.62, g: 0.68, r: 0.74 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.6
          mesh_path: barrel
        - { type: CapsuleCollider, radius: 0.3, height: 0.9 }
        - { type: Rigidbody, is_kinematic: true, use_gravity: false }
      children: []
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.5, y: -5.5, z: 3.0 }
          rotation: { x: 68.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          far_clip_plane: 1.0e+03
          fov: 45.0
          main: true
          near_clip_plane: 0.1
          projection: Perspective
        - type: CameraController
          distance: 10.5
          max_distance: 3.0e+01
          max_pitch_deg: 8.0e+01
          min_distance: 1.5
          min_pitch_deg: -1.0e+01
          mode: orbit
          mouse_sensitivity: 0.08
          pitch_deg: 16.0
          target: { x: 0.6, y: 0.9, z: 1.2 }
          zoom_speed: 1.0
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.86, g: 0.95, r: 1.0 }
          direction: { x: -0.55, y: -0.35, z: -0.45 }
          intensity: 1.3
          shadow_intensity: 0.7
      children: []
