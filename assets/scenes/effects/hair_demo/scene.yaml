scene:
  scene_name: hair_demo
  settings:
    render: { ambient_intensity: 0.8 }
    weather:
      condition: breeze
      conditions:
        - name: breeze
          ambient: 1.0
          cloud_cover: 0.0
          duration: [9999, 9999]
          fog_density: 0.0
          sun: 1.0
          weight: 1.0
          wind_gust: 0.5
          wind_heading: 40
          wind_strength: 5.0
      day_length_minutes: 0
      drive_sun: false
      enabled: true
      schedule: fixed
      time_of_day: 15.0
  root_objects:
    - name: ground
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 8.0, y: 8.0, z: 1.0 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.3, g: 0.27, r: 0.26 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.9
          mesh_path: plane
      children: []
    - name: fine_hair
      active: true
      components:
        - type: Transform
          position: { x: -2.2, y: 0.0, z: 1.2 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.24, g: 0.3, r: 0.42 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.75
          mesh_path: sphere
        - type: Hair
          clump: 0.35
          clump_density: 0.02
          cross_section: 2
          density: 9.0e+02
          droop: 0.85
          frizz_degrees: 9.0
          guide_count: 3
          guide_influence: 0.85
          guides: Guides
          length: 0.42
          length_jitter: 0.3
          material:
            albedo: { b: 0.07, g: 0.12, r: 0.21 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.35
          max_strands: 7000
          seed: 7
          segments: 8
          shape: ribbon
          thickness: 0.04
          thickness_over_length:
            - [0.0, 1.0]
            - [1.0, 0.2]
          wind_flexibility: 0.3
          wind_frequency: 3.2
      children:
        - name: Guides
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 1.0, y: 1.0, z: 1.0 }
          children:
            - name: guide_crown
