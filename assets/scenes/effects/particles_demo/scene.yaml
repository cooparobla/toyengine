# particles_demo -- toyengine's particle system (toyengine/particles/) end to end, at dusk.
#
#   * CAMPFIRE (objects/campfire): flames, glow, a scattered coal bed, embers with pops, a lit
#     smoke column drifting downwind, and a flickering shadow-casting light.
#   * TORCH: carried around the fire on a KinematicMover orbit. Its flames and smoke simulate in
#     WORLD space, so they trail behind it; `rate_over_distance` keeps the trail dense when fast.
#   * MOSSY MOUND (Blender-style scatter, "hair" rendered as instances): mushrooms and pebbles are
#     MESH particles placed evenly over the mound's faces and oriented to its normals; fallen
#     leaves are `aligned` sprites lying on the surface; glowing spores rise off its faces.
#   * MAGIC RING (mesh emission): sparkles leave the torus' faces along their normals and swirl
#     about its axis (`orbital`); rune rings are born on its VERTICES, aligned to the surface,
#     in local space so they stay on the spinning ring.
#   * FOUNTAIN (collision + sub emitters): droplets arc up and die on the ground plane, each
#     death spawning a splash ring and a few spray droplets in two other systems.
#   * GPU (`simulation: gpu`, compute shaders): a 100k-spark fountain bouncing on the ground
#     (additive: unsorted) and a drifting dust field (blended: bitonic-sorted back to front).
#
# GPU vs CPU: the same scene with particles.gpu_enabled: false runs every system on the CPU, so
#   HEADLESS=1 PROFILE=1 MAX_FRAMES=600 FIXED_DT=0.016666667 SCENE=particles_demo ./build/toyengine
# (and again with a config whose particles.gpu_enabled is false) compares the CPU `Particles`
# scope with the GPU `ParticlesSim` + `Transparent` scopes in the summary.
#
# Meshes: tools/gen_particle_demo_assets.py.   Run: ./build/toyengine particles_demo
# World: Z up, metres.
scene:
  scene_name: particles_demo
  # Dusk: a dim, warm-horizon sky and a low sun, with exposure held down so the fire is the
  # brightest thing in the frame (auto exposure would otherwise lift the scene back to day).
  settings:
    render:
      sky_zenith:  [0.025, 0.04, 0.11]
      sky_horizon: [0.3, 0.16, 0.11]
      sky_ground:  [0.02, 0.018, 0.016]
      ambient_intensity: 0.8
      auto_exposure_compensation: 0.75
      auto_exposure_max: 1.6
      bloom_threshold: 1.4
      bloom_intensity: 3.0
  root_objects:
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 2.5, y: -7.5, z: 3.2 }
          rotation: { x: 70.0, y: 0.0, z: 18.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 55.0
          near_clip_plane: 0.1
          far_clip_plane: 300.0
        - type: CameraController
          mode: orbit
          target: { x: 0.0, y: 0.6, z: 0.9 }
          distance: 8.5
          yaw_deg: -72.0
          pitch_deg: 17.0
          min_distance: 2.0
          max_distance: 40.0
          min_pitch_deg: -5.0
          max_pitch_deg: 80.0
          mouse_sensitivity: 0.12
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: DirectionalLight
          direction: { x: -0.7, y: 0.45, z: -0.22 }
          color: { r: 1.0, g: 0.55, b: 0.36 }
          intensity: 0.4
          cast_shadows: true
          shadow_intensity: 0.7
      children: []

    - name: ground
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: MeshRenderer
          mesh_path: particle_ground
          material: { albedo: { r: 0.2, g: 0.21, b: 0.11 }, roughness: 0.96, metallic: 0.0 }
      children: []

    # ==========================================================================================
    # CAMPFIRE + two seat logs
    # ==========================================================================================
    - name: campfire
      prefab: objects/campfire
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }

    - name: seat_log_a
      active: true
      components:
        - type: Transform
          position: { x: -0.4, y: 2.3, z: 0.18 }
          rotation: { x: 0.0, y: 0.0, z: 12.0 }
          scale: { x: 2.2, y: 1.9, z: 1.9 }
        - type: MeshRenderer
          mesh_path: camp_log
          material: { albedo: { r: 0.32, g: 0.21, b: 0.13 }, roughness: 0.9, metallic: 0.0 }
      children: []
    - name: seat_log_b
      active: true
      components:
        - type: Transform
          position: { x: 2.2, y: 0.6, z: 0.18 }
          rotation: { x: 0.0, y: 0.0, z: 100.0 }
          scale: { x: 2.0, y: 1.9, z: 1.9 }
        - type: MeshRenderer
          mesh_path: camp_log
          material: { albedo: { r: 0.3, g: 0.2, b: 0.12 }, roughness: 0.9, metallic: 0.0 }
      children: []

    # ==========================================================================================
    # TORCH -- orbits the fire; world-space flames and smoke trail behind it
    # ==========================================================================================
    - name: torch
      active: true
      components:
        - type: Transform
          position: { x: 4.2, y: 0.0, z: 1.7 }
        - type: KinematicMover
          mode: orbit
          orbit_center: { x: 0.0, y: 0.0, z: 0.0 }
          orbit_radius: 4.2
          speed: 24.0
      children:
        - name: torch_stick
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: -0.45 }
              rotation: { x: 0.0, y: 90.0, z: 0.0 }
              scale: { x: 0.9, y: 0.35, z: 0.35 }
            - type: MeshRenderer
              mesh_path: camp_log
              material: { albedo: { r: 0.25, g: 0.16, b: 0.09 }, roughness: 0.9, metallic: 0.0 }
          children: []
        - name: torch_flames
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: ParticleSystem
              shape: sphere
              radius: 0.08
              rate: 30
              rate_over_distance: 14
              max_particles: 120
              start_lifetime: [0.35, 0.6]
              start_speed: [0.3, 0.6]
              start_size: [0.22, 0.38]
              gravity: -0.4
              drag: 1.5
              inherit_velocity: 0.15
              noise_strength: 0.7
              noise_frequency: 1.4
              size_over_life: [{t: 0.0, value: 0.6}, {t: 0.3, value: 1.0}, {t: 1.0, value: 0.2}]
              color_over_life:
                - {t: 0.0, color: {r: 1.0, g: 0.82, b: 0.32, a: 1.0}}
                - {t: 0.5, color: {r: 1.0, g: 0.38, b: 0.06, a: 1.0}}
                - {t: 1.0, color: {r: 0.5, g: 0.05, b: 0.0, a: 0.0}}
              render_mode: vertical
              sprite: flame
              aspect: 0.75
              pivot: 0.25
              additive: 0.6
              emissive: 1.8
              toon_bands: 4
              softness: 0.12
              distortion: 0.8
          children: []
        - name: torch_smoke
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.35 }
            - type: ParticleSystem
              shape: sphere
              radius: 0.05
              rate: 10
              rate_over_distance: 3
              max_particles: 90
              start_lifetime: [2.0, 3.0]
              start_speed: [0.2, 0.4]
              start_size: [0.15, 0.25]
              start_rotation: [0, 360]
              start_color: {r: 0.25, g: 0.24, b: 0.23, a: 1.0}
              force: {x: 0.2, y: 0.1, z: 0.35}
              drag: 0.6
              noise_strength: 0.35
              size_over_life: [{t: 0.0, value: 0.6}, {t: 1.0, value: 3.0}]
              alpha_over_life: [{t: 0.0, value: 0.0}, {t: 0.15, value: 0.45}, {t: 1.0, value: 0.0}]
              render_mode: billboard
              sprite: puff
              lit: 0.9
              toon_bands: 3
              softness: 0.5
          children: []
        - name: torch_light
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.25 }
            - type: PointLight
              color: { r: 1.0, g: 0.55, b: 0.2 }
              intensity: 60.0
              range: 5.0
              cast_shadows: false
              attenuation_constant: 1.6
            - type: LightFlicker
              amount: 0.3
              speed: 9.0
          children: []

    # ==========================================================================================
    # MOSSY MOUND -- Blender-style scatter on mesh faces
    # ==========================================================================================
    - name: mossy_mound
      active: true
      components:
        - type: Transform
          position: { x: -5.2, y: 3.4, z: -0.05 }
          rotation: { x: 0.0, y: 0.0, z: 20.0 }
        - type: MeshRenderer
          mesh_path: mossy_mound
          material: { albedo: { r: 0.18, g: 0.3, b: 0.12 }, roughness: 0.95, metallic: 0.0 }
      children:
        - name: mushrooms
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: ParticleSystem
              mode: scatter
              shape: mesh
              mesh_path: mossy_mound
              emit_from: faces
              distribution: even         # stratified over area: no clumps, no bald patches
              count: 70
              seed: 4
              align_to_normal: true      # stand on the surface, along its normal
              random_spin: true
              start_size: [0.12, 0.32]
              render_mode: mesh
              render_mesh: mushroom
              material: { albedo: { r: 0.82, g: 0.36, b: 0.24 }, roughness: 0.6, metallic: 0.0 }
          children: []
        - name: pebbles
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: ParticleSystem
              mode: scatter
              shape: mesh
              mesh_path: mossy_mound
              distribution: random
              count: 45
              seed: 9
              align_to_normal: true
              start_size: [0.08, 0.2]
              render_mode: mesh
              render_mesh: camp_stone
              material: { albedo: { r: 0.42, g: 0.41, b: 0.39 }, roughness: 0.85, metallic: 0.0 }
          children: []
        - name: fallen_leaves
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: ParticleSystem
              mode: scatter
              shape: mesh
              mesh_path: mossy_mound
              distribution: even
              normal_offset: 0.015
              count: 140
              seed: 21
              align_to_normal: true
              random_spin: true
              start_size: [0.14, 0.24]
              aspect: 0.6
              color_over_life:           # per-leaf variety in a scatter
                - {t: 0.0,  color: {r: 0.85, g: 0.32, b: 0.08, a: 1.0}}
                - {t: 0.5,  color: {r: 0.95, g: 0.62, b: 0.12, a: 1.0}}
                - {t: 1.0,  color: {r: 0.62, g: 0.16, b: 0.06, a: 1.0}}
              render_mode: aligned       # lying in the surface plane
              sprite: leaf
              lit: 1.0
              toon_bands: 3
              softness: 0.05
              soft_distance: 0.0
              sort: none
          children: []
        - name: spores
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: ParticleSystem
              shape: mesh
              mesh_path: mossy_mound
              emit_from: faces
              rate: 7
              prewarm: true
              max_particles: 60
              start_lifetime: [3.0, 5.0]
              start_speed: [0.1, 0.3]    # along each face's normal
              start_size: [0.07, 0.12]
              start_color: {r: 0.62, g: 1.0, b: 0.35, a: 1.0}
              start_color_b: {r: 0.95, g: 1.0, b: 0.45, a: 1.0}
              drag: 0.8
              noise_strength: 0.5
              noise_frequency: 0.6
              alpha_over_life: [{t: 0.0, value: 0.0}, {t: 0.2, value: 1.0}, {t: 0.8, value: 0.8}, {t: 1.0, value: 0.0}]
              render_mode: billboard
              sprite: star
              blend: additive
              emissive: 2.5
              sort: none
          children: []

    # ==========================================================================================
    # MAGIC RING -- mesh emission from faces (sparkles) and vertices (aligned rune rings)
    # ==========================================================================================
    - name: magic_ring
      active: true
      components:
        - type: Transform
          position: { x: 4.6, y: 3.2, z: 1.5 }
          rotation: { x: 75.0, y: 0.0, z: -30.0 }
        - type: MeshRenderer
          mesh_path: magic_torus
          material: { albedo: { r: 0.2, g: 0.17, b: 0.28 }, roughness: 0.45, metallic: 0.3 }
        - type: KinematicMover
          mode: spin
          spin_axis: { x: 0.0, y: 0.0, z: 1.0 }
          spin_speed: 25.0
        # No mesh_path: a `mesh` shape borrows the sibling MeshRenderer's mesh (Blender's emitter
        # IS the object's mesh).
        - type: ParticleSystem
          shape: mesh
          emit_from: faces
          rate: 90
          max_particles: 300
          prewarm: true
          start_lifetime: [1.0, 1.8]
          start_speed: [0.25, 0.6]
          start_size: [0.07, 0.13]
          start_color: {r: 0.45, g: 0.85, b: 1.0, a: 1.0}
          start_color_b: {r: 0.75, g: 0.5, b: 1.0, a: 1.0}
          orbital: 1.4                   # swirl about the ring's axis
          drag: 1.0
          noise_strength: 0.3
          alpha_over_life: [{t: 0.0, value: 1.0}, {t: 0.7, value: 0.8}, {t: 1.0, value: 0.0}]
          size_over_life: [{t: 0.0, value: 1.0}, {t: 1.0, value: 0.3}]
          render_mode: billboard
          sprite: star
          blend: additive
          emissive: 3.0
          sort: none
      children:
        - name: rune_rings
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: ParticleSystem
              shape: mesh
              mesh_path: magic_torus
              emit_from: vertices
              normal_offset: 0.01
              simulation_space: local    # stay on the spinning ring
              align_to_normal: true
              random_spin: false
              rate: 24
              max_particles: 60
              start_lifetime: [1.2, 1.6]
              start_speed: 0.0
              start_size: [0.12, 0.2]
              start_color: {r: 0.7, g: 0.55, b: 1.0, a: 1.0}
              size_over_life: [{t: 0.0, value: 0.2}, {t: 1.0, value: 1.4}]
              alpha_over_life: [{t: 0.0, value: 1.0}, {t: 1.0, value: 0.0}]
              render_mode: aligned
              sprite: ring
              blend: additive
              emissive: 3.0
              toon_bands: 3
              soft_distance: 0.0
              sort: none
          children: []

    # ==========================================================================================
    # FOUNTAIN -- ground collision and sub emitters (a splash ring + spray on every death)
    # ==========================================================================================
    - name: fountain_stone
      active: true
      components:
        - type: Transform
          position: { x: 3.6, y: -3.4, z: 0.0 }
          scale: { x: 0.7, y: 0.7, z: 1.4 }
        - type: MeshRenderer
          mesh_path: camp_stone
          material: { albedo: { r: 0.4, g: 0.4, b: 0.42 }, roughness: 0.6, metallic: 0.0 }
      children: []
    - name: fountain
      active: true
      components:
        - type: Transform
          position: { x: 3.6, y: -3.4, z: 0.62 }
        - type: ParticleSystem
          shape: cone
          radius: 0.05
          angle: 9
          rate: 80
          max_particles: 400
          prewarm: true
          start_lifetime: 3.0
          start_speed: [4.6, 5.4]
          start_size: [0.07, 0.11]
          start_color: {r: 0.4, g: 0.66, b: 0.95, a: 0.8}
          gravity: 1.0
          collide: true
          ground_height: 0.03
          kill_on_collide: true
          on_death:
            - {target: fountain_splash, count: [0.2, 1.3]}
            - {target: fountain_spray, count: [0, 2], inherit_velocity: 0.25}
          render_mode: stretched
          sprite: circle
          stretch_speed: 0.03
          lit: 0.9
          toon_bands: 3
          emissive: 1.0
          softness: 0.15
          sort: distance
      children: []
    - name: fountain_splash
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: ParticleSystem
          rate: 0
          max_particles: 300
          start_lifetime: [0.5, 0.8]
          start_speed: 0.0
          start_size: [0.25, 0.4]
          start_color: {r: 0.75, g: 0.9, b: 1.0, a: 0.8}
          size_over_life: [{t: 0.0, value: 0.2}, {t: 1.0, value: 1.3}]
          alpha_over_life: [{t: 0.0, value: 1.0}, {t: 1.0, value: 0.0}]
          render_mode: horizontal
          sprite: ring
          lit: 0.6
          toon_bands: 3
          emissive: 1.2
          soft_distance: 0.0
          sort: none
      children: []
    - name: fountain_spray
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: ParticleSystem
          rate: 0
          max_particles: 400
          start_lifetime: [0.3, 0.6]
          start_speed: [0.6, 1.4]
          start_size: [0.03, 0.06]
          start_color: {r: 0.7, g: 0.88, b: 1.0, a: 0.9}
          gravity: 1.0
          render_mode: billboard
          sprite: circle
          lit: 0.6
          emissive: 1.3
          sort: none
      children: []

    # ==========================================================================================
    # GPU particles (simulation: gpu): a 100k-spark fountain and a dust field
    # ==========================================================================================
    - name: gpu_spark_fountain
      active: true
      components:
        - type: Transform
          position: { x: -2.2, y: 4.8, z: 0.05 }
        - type: ParticleSystem
          simulation: gpu
          max_particles: 100000
          shape: cone
          radius: 0.08
          angle: 14
          rate: 32000
          start_lifetime: [2.4, 3.1]
          start_speed: [5.0, 6.8]
          start_size: [0.018, 0.03]
          start_color: {r: 1.0, g: 0.5, b: 0.15, a: 0.25}
          start_color_b: {r: 1.0, g: 0.75, b: 0.35, a: 0.25}
          color_over_life: [{t: 0.0, color: {r: 1.0, g: 1.0, b: 1.0, a: 1.0}}, {t: 1.0, color: {r: 0.8, g: 0.25, b: 0.05, a: 1.0}}]
          alpha_over_life: [{t: 0.0, value: 1.0}, {t: 0.8, value: 0.8}, {t: 1.0, value: 0.0}]
          gravity: 1.0
          drag: 0.15
          noise_strength: 0.8
          noise_frequency: 0.6
          collide: true
          ground_height: 0.02
          bounce: 0.35
          collision_friction: 0.3
          render_mode: stretched
          sprite: spark
          stretch_speed: 0.02
          emissive: 0.7
          additive: 1.0
          softness: 0.3
          sort: none
      children: []
    - name: gpu_dust_field
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 1.0, z: 1.2 }
        - type: ParticleSystem
          simulation: gpu
          max_particles: 16000
          shape: box
          box: [12.0, 10.0, 2.2]
          rate: 2000
          start_lifetime: [5.0, 7.0]
          start_speed: 0.05
          start_size: [0.02, 0.04]
          start_color: {r: 0.95, g: 0.85, b: 0.7, a: 0.2}
          alpha_over_life: [{t: 0.0, value: 0.0}, {t: 0.2, value: 1.0}, {t: 0.8, value: 1.0}, {t: 1.0, value: 0.0}]
          noise_strength: 0.25
          noise_frequency: 0.35
          render_mode: billboard
          sprite: soft
          lit: 0.8
          emissive: 1.0
          sort: distance
      children: []
