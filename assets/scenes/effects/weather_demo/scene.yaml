# weather_demo -- the scene-global weather and time of day (toyengine/weather/).
#
# Run: ./build/toyengine weather_demo        (or SCENE=weather_demo)
#
# A small hamlet on a meadow, lit only by the weather: the clock runs a whole day in 4 minutes,
# and the random schedule moves through the stock conditions (clear, cloudy, overcast, fog, rain,
# storm) every minute or two, blending sky, fog, sun and effects as it goes. Its `weather` block
# lists no `conditions`, so the engine's defaults apply (open the editor's World tab to see and
# edit them; Preview there forces any condition, including snow / blizzard / sandstorm).
#
#   centre      the houses and the well; rain streaks, splashes, ground mist and snow fall here
#   lamps       four street lamps: WeatherReactor phases [dusk, night, dawn] fade their lights in
#               and switch their glowing glass on
#   campfire    the campfire prefab under a WeatherReactor (invert, rain / storm / snow /
#               blizzard): it goes out while it rains and relights after
#   trees       blockout trees for the wind and fog to read against
#   ground      the only surface with a WeatherSurface: rain splashes and snow settles on it alone
#               (roofs, the well and the awning take drops silently), out to 45 m from the camera
#   awning      a market awning beside the path: rain stops on it, the ground beneath stays dry
#               (roofs, trees and the awning carry colliders -- what the precipitation height map
#               probes while the scene runs; in the editor it uses their mesh bounds)
#   snow field  east of the meadow (x = 80): snow cover, a shelter's bare patch, a sled ploughing a
#               trench that fills back in, a dropped ball pressing in. Preview snow to see it.
#
# Needs render transparency_enabled (particles) and volumetrics_enabled (ground mist), both on in
# assets/config.yaml. Worth sweeping: time_of_day (0..24) and condition; debug_view=volumetrics.
scene:
  scene_name: weather_demo
  settings:
    weather:
      enabled: true
      time_of_day: 16.5
      day_length_minutes: 4
      latitude: 40
      north_offset: 20
      drive_sun: true
      sun_intensity: 1.3
      snow_patch_style: hard     # snow settles in round, crisp-edged (toon) patches
      snow_accumulate_time: 120  # seconds of snowfall to full cover
      snow_max_depth: 0.3
      snow_auto_deformers: true  # rigidbodies press into the snow without a SnowDeformer
      snow_trench_recover_time: 3.0
      condition: rain
      schedule: random
      ground_height: 0.0
  root_objects:
    - name: ground
      active: true
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 60, y: 60, z: 1 }
        - type: MeshRenderer
          mesh_path: plane
          material: { albedo: { r: 0.24, g: 0.34, b: 0.17 }, roughness: 0.95, metallic: 0.0 }
        - type: BoxCollider
          size: { x: 2.0, y: 2.0, z: 0.2 }
          center: { x: 0.0, y: 0.0, z: -0.1 }
        - type: WeatherSurface
