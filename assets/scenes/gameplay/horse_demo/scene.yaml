          position: { x: 8, y: 19, z: 0.6 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 0.08, y: 22, z: 0.12 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.45, g: 0.32, b: 0.2 }, roughness: 0.75 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    # A dirt track inside the paddock (just a look; flush with the ground).
    - name: paddock_track
      components:
        - type: Transform
          position: { x: 0, y: 19, z: 0.005 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 14, y: 20, z: 0.01 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.48, g: 0.38, b: 0.26 }, roughness: 0.9 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    # Step row: 0.2 m risers (under the horse's step_height 0.4); hooves plant on each.
    - name: step_1
      components:
        - type: Transform
          position: { x: -12, y: 6.8, z: 0.1 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 5, y: 1.6, z: 0.2 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.62, g: 0.6, b: 0.56 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: step_2
      components:
        - type: Transform
          position: { x: -12, y: 8.4, z: 0.2 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 5, y: 1.6, z: 0.4 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.62, g: 0.6, b: 0.56 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: step_3
      components:
        - type: Transform
          position: { x: -12, y: 10, z: 0.3 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 5, y: 1.6, z: 0.6 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.62, g: 0.6, b: 0.56 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: step_top
      components:
        - type: Transform
          position: { x: -12, y: 12.8, z: 0.3 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 5, y: 4, z: 0.6 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.62, g: 0.6, b: 0.56 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    # Ramp: 12 degrees up to a 1.2 m plateau.
    - name: ramp_up
      components:
        - type: Transform
          position: { x: 12, y: 6.84357, z: 0.502185 }
          rotation: { x: 12, y: 0, z: 0 }
          scale: { x: 4, y: 5.77168, z: 0.2 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.62, g: 0.6, b: 0.56 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: plateau
      components:
        - type: Transform
          position: { x: 12, y: 12.6456, z: 0.6 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 4, y: 6, z: 1.2 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.62, g: 0.6, b: 0.56 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: ramp_down
      components:
        - type: Transform
          position: { x: 12, y: 18.4475, z: 0.502185 }
          rotation: { x: -12, y: 0, z: 0 }
          scale: { x: 4, y: 5.77168, z: 0.2 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.62, g: 0.6, b: 0.56 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    # Hills: a rolling 30 x 30 m heightfield on a static MeshCollider.
    - name: hills
      components:
        - type: Transform
          position: { x: 0, y: 34, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: MeshRenderer
          mesh_path: horse_hills
          material: { albedo: { r: 0.36, g: 0.5, b: 0.24 }, roughness: 0.95 }
        - type: MeshCollider
          mesh_path: horse_hills_collider
          convex: false
      children: []

    # Third-person camera: orbits the player (the horse while ridden -- the Rider re-points
    # `tracker` and uses the Mount's camera offset / distance) and collides.
    - name: camera
      components:
        - type: Transform
          position: { x: -2, y: -7, z: 3.8 }
          rotation: { x: 65, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 60.0
          near_clip_plane: 0.1
          far_clip_plane: 500.0
        - type: CameraController
          mode: orbit
          tracker: player
          target_offset: { x: 0, y: 0, z: 1.4 }
          follow_smoothing: 12.0
          movement_smoothing: 0.2
          mouse_sensitivity: 0.12
          distance: 7.5
          yaw_deg: -15.0
          pitch_deg: 20.0
          min_pitch_deg: -10.0
          max_pitch_deg: 80.0
          min_distance: 1.5
          max_distance: 20.0
          collide: true
          collision_radius: 0.25
      children: []

    - name: sun
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 20 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: DirectionalLight
          direction: { x: -0.45, y: 0.55, z: -0.7 }
          color: { r: 1.0, g: 0.96, b: 0.9 }
          intensity: 1.0
          cast_shadows: true
      children: []
