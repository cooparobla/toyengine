# loading_demo (heavy) -- the level the hub's doors load: 1156 towers, built a batch of root
# objects per frame while the hub keeps running, plus a ring of animated mannequins.
# GENERATED by tools/gen_loading_demo_scene.py; edit that, not this file.
#
# Its door (green, west of the start) goes back to the hub with a fade.
scene:
