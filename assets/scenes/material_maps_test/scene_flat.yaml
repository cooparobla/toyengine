format: blender
# Minimal scene for test_headless_render_material_maps_change_output() (test.cpp): a single lit
# cube, textureless. Identical to scene_mapped.yaml but for the material's texture_* keys -- see
# that file's own comment. Not meant to be visually interesting, just to differ measurably from
# scene_mapped.yaml once albedo/normal/metallic_roughness maps are applied there.
scene:
  scene_name: MaterialMapsTestFlat
  root_objects:
    - name: cube.000
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: cube.000
          material:
            albedo: { r: 0.8, g: 0.35, b: 0.25 }
            metallic: 0.0
            roughness: 0.6
            ao: 1.0
      children: []

    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -4.0, z: 2.2 }
          rotation: { x: 68.3269, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 50.0
          near_clip_plane: 0.1
          far_clip_plane: 1000.0
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          direction: { x: -0.35, y: -0.45, z: -0.82 }
          color: { r: 1.0, g: 0.97, b: 0.9 }
          intensity: 1.0
          cast_shadows: false
      children: []
