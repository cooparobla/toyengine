scene:
  scene_name: slice_demo
  # Slicing and typed damage (toyengine/destruct/slice.h, libs/physxcoopa/physxcoopa/damage/):
  # a row of three Sliceable props to cut with a click, and two Damageable props that dent/chip/
  # cleave/fracture depending on the blow's type and the material's own resistance.
  #
  # Run: ./build/toyengine slice_demo        (or SCENE=slice_demo)
  #   left click  -- DamageCursor's slice_button: cuts whatever is under the cursor along a
  #                  random-angle plane through the hit point (DestructionSystem::slice_object())
  #   right click -- DamageCursor's hit_button: deals an Impact blow at the hit point
  #
  # --- Slice row (left to right): cube, sphere, torus -------------------------------------
  # Each is Sliceable with collider: hull (physxcoopa's ConvexCollider, built from its own
  # vertices) and its own interior_material, so a cut shows a different material on the new
  # face than on the original surface. max_slices: 2 lets a half be cut once more.
  #
  # --- Damage row: a metal sphere (dents), a glass cube (shatters on the first real hit) -----
  # Both are Damageable; DESTRUCT_DEBUG=1 prints a line per fracture/cleave this system carries
  # out. Dent/Chip/Hole cost HP and mark the object's DamageField but do not edit the mesh yet
  # (toyengine/scene/damageable.h's own doc explains why).
  settings:
    render: { shadow_distance: 6.0e+01, shadow_softness: 0.3 }
  root_objects:
    - name: ground
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.4e+01, y: 8.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: plane
          material:
            albedo: { b: 0.36, g: 0.34, r: 0.32 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.85
        - type: BoxCollider
          center: { x: 0.0, y: 0.0, z: -0.5 }
          material: concrete
          size: { x: 2.0, y: 2.0, z: 1.0 }
      children: []

    # --- Slice row ---------------------------------------------------------------------------
    - name: slice_cube
      active: true
      components:
        - type: Transform
          position: { x: -6.0, y: 0.0, z: 0.5 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: cube
          material:
            albedo: { b: 0.26, g: 0.45, r: 0.66 }
            metallic: 0.0
            roughness: 0.75
        - type: BoxCollider
          material: wood
          size: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Rigidbody
          mass: 12.0
        - type: Sliceable
          collider: hull
          density: 700.0
          interior_material: materials/natural/wood
          max_slices: 2
      children: []

    - name: slice_sphere
      active: true
      components:
        - type: Transform
          position: { x: -3.0, y: 0.0, z: 0.6 }
          scale: { x: 1.2, y: 1.2, z: 1.2 }
        - type: MeshRenderer
          mesh_path: sphere
          material:
            albedo: { b: 0.52, g: 0.56, r: 0.58 }
            metallic: 0.0
            roughness: 0.6
        - type: SphereCollider
          material: concrete
          radius: 1.0
        - type: Rigidbody
          mass: 2.0e+01
        - type: Sliceable
          collider: hull
          density: 2200.0
          interior_material: materials/natural/stone
          max_slices: 2
      children: []

    - name: slice_torus
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.8 }
          scale: { x: 1.3, y: 1.3, z: 1.3 }
        - type: MeshRenderer
          mesh_path: props/magic_torus
          material:
            albedo: { b: 0.65, g: 0.5, r: 0.3 }
            metallic: 0.5
            roughness: 0.4
        - type: BoxCollider
          size: { x: 1.6, y: 1.6, z: 0.6 }
          material: metal
        - type: Rigidbody
          mass: 15.0
        - type: Sliceable
          collider: hull
          density: 900.0
          interior_material: materials/metal/steel
          max_slices: 2
      children: []

    # --- Damage row ----------------------------------------------------------------------------
    - name: damage_sphere
      active: true
      components:
        - type: Transform
          position: { x: 3.0, y: 0.0, z: 0.6 }
          scale: { x: 1.2, y: 1.2, z: 1.2 }
        - type: MeshRenderer
          mesh_path: sphere
          material:
            albedo: { b: 0.7, g: 0.72, r: 0.75 }
            metallic: 0.8
            roughness: 0.3
        - type: SphereCollider
          material: metal
          radius: 1.0
        - type: Rigidbody
          mass: 3.0e+01
        - type: Damageable
          damage_resolution: 16
          material: metal
        # Also cuttable by left click: Destructible carries the same slice keys Sliceable does
        # (DestructionSystem::slice_object() accepts either). impact_impulse: 0 keeps a plain
        # collision from auto-shattering it -- only a hit_button blow or a slice is meant to
        # affect this object, not an incidental bump.
        - type: Destructible
          chunk_density: 7800.0
          chunk_lifetime: 0.0
          impact_impulse: 0.0
          interior_material: materials/metal/steel
          max_slices: 2
          pieces: 10
      children: []

    - name: damage_cube
      active: true
      components:
        - type: Transform
          position: { x: 6.0, y: 0.0, z: 0.5 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: cube
          material:
            albedo: { b: 0.85, g: 0.9, r: 0.9 }
            alpha: 0.35
            alpha_mode: Blend
            metallic: 0.0
            roughness: 0.05
        - type: BoxCollider
          material: concrete
          size: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Rigidbody
          mass: 8.0
        - type: Damageable
          damage_resolution: 16
          material: glass
        # See damage_sphere's Destructible comment: this is what makes it left-click
        # sliceable too, and is what fracture_on_death actually shatters through.
        - type: Destructible
          chunk_density: 2500.0
          chunk_lifetime: 0.0
          impact_impulse: 0.0
          interior_material: materials/natural/ice
          max_slices: 2
          pieces: 10
      children: []

    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -1.5e+01, z: 7.0 }
          rotation: { x: 68.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          far_clip_plane: 3.0e+02
          fov: 5.5e+01
          main: true
          near_clip_plane: 0.1
          projection: Perspective
        - type: CameraController
          capture_cursor: false
          collide: false
          distance: 1.7e+01
          look_button: middle
          max_distance: 5.0e+01
          max_pitch_deg: 8.0e+01
          min_distance: 5.0
          min_pitch_deg: 2.0
          mode: orbit
          mouse_sensitivity: 0.12
          movement_smoothing: 0.25
          pitch_deg: 24.0
          target: { x: 0.0, y: 0.0, z: 1.0 }
          yaw_deg: 0.0
          zoom_speed: 2.0
        - type: DamageCursor
          amount: 400.0
          damage_type: Impact
          hit_button: right
          max_distance: 1000.0
          seed: 7
          slice_button: left
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 2.0e+01 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.92, g: 0.97, r: 1.0 }
          direction: { x: -0.4, y: 0.65, z: -0.65 }
          intensity: 1.4
          shadow_intensity: 0.8
      children: []

    - name: sky
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: EnvironmentLight
          ground_color: { b: 0.2, g: 0.21, r: 0.22 }
          sky_color: { b: 0.9, g: 0.78, r: 0.68 }
          sky_intensity: 1.1
      children: []
