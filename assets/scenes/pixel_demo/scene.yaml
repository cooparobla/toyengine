format: blender
scene:
  scene_name: PixelDemo
  root_objects:
    - name: plane.000
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: -0.5 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 4.0, y: 4.0, z: 4.0 }
        - type: MeshRenderer
          mesh_path: plane.000
          material:
            albedo: { r: 0.35, g: 0.4, b: 0.3 }
            metallic: 0.0
            roughness: 0.8
            ao: 1.0
      children: []

    - name: cube.000
      active: true
      components:
        - type: Transform
          position: { x: -0.5, y: -0.5, z: -0.5 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: cube.000
          material:
            albedo: { r: 0.8, g: 0.35, b: 0.25 }
            metallic: 0.0
            roughness: 0.6
            ao: 1.0
      children: []

    # Transparency test: a static BLEND glass sphere, resting on the plane beside
    # cube.000. alpha < 1 means it does NOT cast a shadow (see PixelRenderPipeline's
    # record_directional_shadow_/record_point_shadow_: a BLEND material only casts a
    # shadow at alpha == 1.0, since this engine's single-hard-compare shadow pass has
    # no way to draw a partial shadow for a partially transparent occluder).
    - name: glass_sphere.000
      active: true
      components:
        - type: Transform
          position: { x: 1.0, y: -0.5, z: -0.05 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.45, y: 0.45, z: 0.45 }
        - type: MeshRenderer
          mesh_path: sphere.000
          material:
            albedo: { r: 0.6, g: 0.8, b: 0.9 }
            metallic: 0.0
            roughness: 0.05
            ao: 1.0
            alpha: 1.0
            alpha_mode: BLEND
      children: []

    # Opaque control sphere, for comparing against glass_sphere.000's shading -- offset far
    # enough in x that it's clear of glass_sphere.000's own directional-shadow cylinder given
    # the sun direction above (perp_offset ~1.4 vs the two spheres' combined radius 0.9, so
    # neither casts onto the other; at the previous x=2.0 spacing perp_offset was ~0.94, just
    # 4% past the combined radius -- well within shadow_normal_bias's 0.05, so glass_sphere.000
    # really was being shadowed by this sphere, not showing an ambient/shader-pass artifact).
    - name: opaque_sphere.000
      active: true
      components:
        - type: Transform
          position: { x: 2.5, y: -0.5, z: -0.05 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.45, y: 0.45, z: 0.45 }
        - type: MeshRenderer
          mesh_path: sphere.000
          material:
            albedo: { r: 0.6, g: 0.8, b: 0.9 }
            # metallic: 0.9, not the original 0.0 -- a dielectric's F0 is a flat 0.04, so any
            # reflection (SSR or otherwise) is a sub-5% tint, effectively invisible against a
            # directly-lit diffuse response of similar magnitude. Full metallic makes F0 =
            # albedo, the mirror-sphere-reflects-its-neighbour effect SSR is actually built to
            # show (see emissive_sphere.000's placement comment below).
            metallic: 0.5
            roughness: 0.05
            ao: 1.0
      children: []

    # Emissive test: a small glowing orb resting beside opaque_sphere.000, at the same height --
    # NOT above it. SSR can only reflect a surface whose CAMERA-FACING side is visible in the
    # G-buffer; an object directly above a sphere, viewed from this scene's overhead camera,
    # would need to reflect off the sphere's top and hit the orb's UNDERSIDE, a backface that
    # was never rendered and that SSR's screen-space ray march therefore cannot find (nor would
    # the hit survive its depth/thickness test, sized for near-camera-depth surfaces). Placed
    # beside the sphere instead, the orb's own camera-facing side is exactly what the reflection
    # ray needs, which is the ordinary "mirror ball reflects its neighbour" case SSR is built
    # for. Albedo is near-black deliberately -- direct and indirect lighting then contribute
    # almost nothing, so what's on screen is the emissive term alone. Note the engine has no
    # emissive-as-a-light-source concept: this orb does NOT illuminate the sphere directly, it
    # only bleeds onto it via the screen-space SSR/SSGI terms (and, separately, via the bloom
    # composite in pixel_stylize.frag, which is a screen-space glow, not a lighting effect
    # either) -- and, being OPAQUE, it still casts a normal directional shadow (the shadow pass
    # never reads material).
    - name: emissive_sphere.000
      active: true
      components:
        - type: Transform
          position: { x: 3.35, y: -0.5, z: -0.2 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.3, y: 0.3, z: 0.3 }
        - type: MeshRenderer
          mesh_path: sphere.000
          material:
            albedo: { r: 0.05, g: 0.03, b: 0.02 }
            metallic: 0.0
            roughness: 0.9
            ao: 1.0
            emissive: { r: 1.0, g: 0.45, b: 0.12 }
            emissive_strength: 1.6
      children: []

    # Local fog volume test: a soft-edged pocket of mist between the two spheres, for
    # exercising gfxcoopa's FogPass (global fog + local FogVolume) in toyengine too -- see
    # blendy's assets/scenes/cube/scene.yaml FogPocket for the sibling test in that engine.
    - name: FogPocket
      active: true
      components:
        - type: Transform
          position: { x: 1.7, y: -0.5, z: 0.2 }
          rotation: { x: 0.0, y: 0.0, z: 0.3 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: FogVolume
          shape: box
          extent: { x: 10.0, y: 10.0, z: 0.8 }
          color: { r: 0.75, g: 0.8, b: 0.85 }
          density: 0.5
          falloff: 0.25
      children: []

    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -10.0, z: 6.0 }
          rotation: { x: 68.3269, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          projection: Perspective
          fov: 50.0
          near_clip_plane: 0.1
          far_clip_plane: 1000.0
        - type: CameraController
          mode: orbit
          target: { x: 0.0, y: 0.0, z: 0.5 }
          auto_rotate_deg_per_sec: 15.0
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          direction: { x: -0.35, y: -0.45, z: -0.82 }
          color: { r: 1.0, g: 0.97, b: 0.9 }
          intensity: 1.0
          ambient: { r: 0.08, g: 0.08, b: 0.1 }
          cast_shadows: true
      children: []

    - name: point
      active: true
      components:
        - type: Transform
          position: { x: 1.5, y: 3.0, z: 1.3 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: PointLight
          color: { r: 0.5, g: 0.7, b: 1.0 }
          intensity: 100.0
          range: 100.0  # scaled to this scene's ~8-unit floor -- range now directly controls the light's visible glow width (see pixel_lighting.frag); much larger than the scene itself (this was briefly 100) hides the effect entirely
          cast_shadows: true
          attenuation_constant: 4.0  # falloff sharpness -- 4.0 keeps this engine's crisp, cel-shaded cutoff
      children: []
