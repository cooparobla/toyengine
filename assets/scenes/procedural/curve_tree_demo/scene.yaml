scene:
  scene_name: curve_tree_demo
  settings:
    render: { aa_mode: taa, ambient_intensity: 0.85, shadow_pcss_enabled: true }
    weather:
      condition: breeze
      conditions:
        - name: breeze
          ambient: 1.0
          cloud_cover: 0.0
          duration: [9999, 9999]
          fog_density: 0.0
          sun: 1.0
          weight: 1.0
          wind_gust: 0.4
          wind_heading: 35
          wind_strength: 5.0
      day_length_minutes: 0
      drive_sun: false
      enabled: true
      schedule: fixed
      time_of_day: 15.0
  root_objects:
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -14.0, z: 7.0 }
          rotation: { x: 68.0, y: 0.0, z: 0.0 }
        - { type: Camera, fov: 6.0e+01, main: true, projection: Perspective }
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.9, g: 0.96, r: 1.0 }
          direction: { x: -0.45, y: 0.6, z: -0.65 }
          intensity: 2.2
      children: []
    - name: ground
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 3.0e+01, y: 3.0e+01, z: 1.0 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.21, g: 0.29, r: 0.24 }
            roughness: 0.95
          mesh_path: plane
        - type: BoxCollider
          size: { x: 3.0e+01, y: 3.0e+01, z: 0.2 }
      children: []
    - name: Tree_A
      active: true
      components:
        - type: Transform
          position: { x: -5.0, y: 0.0, z: 0.0 }
        - type: ProceduralGraph
          bake: on_change
          graph: graphs/curve_tree
          inputs:
            branch_count: 14
            branch_length: 1.0
            branch_spread: 0.55
            leaf_size: 0.28
            lean_high: 3.0e+01
            lean_low: 7.0e+01
            leaves_per_twig: 8
            length_high: 0.45
            length_low: 1.5
            path: { curve: PathA }
            tip_taper: 0.18
            trunk_radius: 0.26
            trunk_segments: 16
            twig_length: 0.26
            twigs_per_branch: 7
          seed: 3
      children:
        - name: PathA
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: Curve
              always_show: true
              closed: false
              points:
                - mode: auto
                  p: [0.0, 0.0, 0.0]
                - mode: auto
                  p: [0.1, 0.0, 2.0]
                - mode: auto
                  p: [0.0, 0.1, 4.2]
              resolution: 10
    - name: Tree_B
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: ProceduralGraph
          bake: on_change
          graph: graphs/curve_tree
          inputs:
            branch_count: 18
            branch_length: 1.2
            branch_spread: 0.7
            leaf_size: 0.28
            lean_high: 26.0
            lean_low: 76.0
            leaves_per_twig: 8
            length_high: 0.4
            length_low: 1.6
            path: { curve: PathB }
            tip_taper: 0.15
            trunk_radius: 0.3
            trunk_segments: 20
            twig_length: 0.3
            twigs_per_branch: 8
          seed: 11
      children:
        - name: PathB
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: Curve
              always_show: true
              closed: false
              points:
                - mode: auto
                  p: [0.0, 0.0, 0.0]
                - mode: auto
                  p: [-0.35, 0.15, 1.8]
                - mode: auto
                  p: [0.25, -0.1, 3.4]
                - mode: auto
                  p: [0.6, 0.2, 5.0]
              resolution: 12
        - name: GustB
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 2.5 }
            - type: EnvInfluence
              blend: add
              falloff: 0.35
              height: 6.0
              mode: directional
              radius: 2.8
              shape: disc
              strength: 1.0
              turbulence: 0.85
              wind: { x: 11.0, y: 8.0, z: -1.5 }
    - name: Tree_C
      active: true
      components:
        - type: Transform
          position: { x: 5.5, y: 0.0, z: 0.0 }
        - type: ProceduralGraph
          bake: on_change
          graph: graphs/curve_tree
          inputs:
            branch_count: 20
            branch_length: 1.4
            branch_spread: 0.6
            leaf_size: 0.28
            lean_high: 22.0
            lean_low: 8.0e+01
            leaves_per_twig: 8
            length_high: 0.4
            length_low: 1.7
            path: { curve: PathC }
            tip_taper: 0.2
            trunk_radius: 0.38
            trunk_segments: 18
            twig_length: 0.34
            twigs_per_branch: 9
          seed: 29
      children:
        - name: PathC
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: Curve
              always_show: true
              closed: false
              points:
                - mode: auto
                  p: [0.0, 0.0, 0.0]
                - mode: auto
                  p: [-0.35, 0.15, 1.8]
                - mode: auto
                  p: [0.25, -0.1, 3.4]
                - mode: auto
                  p: [0.6, 0.2, 5.0]
              resolution: 12
