# curve_tree_demo -- an authored Curve driving a procedural graph.
#
# The claim: a tree is a PATH plus some rules, and the path is exactly the part a node graph is
# bad at describing and a pen is good at. Each trunk here is a `Curve` component drawn in the
# viewport (Pen Mode); `graphs/curve_tree` dresses it with tapering limb segments, branches off
# its upper half and foliage on its top third.
#
#   TREE_A  a straight, upright trunk -- the control
#   TREE_B  a leaning, S-bent trunk: the same graph, a different drawn path
#   TREE_C  the same path as B with far fewer segments and heavier foliage, so the INPUTS are
#           visibly doing work rather than the curve alone
#
# To edit one: select its Path child, pick Pen Mode from the viewport's mode menu, then click to
# add points, click the line to insert, drag points and handles, X deletes, C closes. The graph
# re-bakes on every change (`bake: on_change`).
#
# Meshes: tools/gen_curve_tree_assets.py.  Run: ./build/toyengine curve_tree_demo
# World: Z up, metres.
scene:
  scene_name: curve_tree_demo
  settings:
    render:
      ambient_intensity: 0.85
    # A steady breeze, because the foliage shader returns early in dead air: no wind, no sway.
    # The bark and the leaf cards both ride it, with very different flexibilities.
    weather:
      enabled: true
      time_of_day: 15.0
      day_length_minutes: 0
      drive_sun: false          # the scene's own sun keeps aiming the shadows
      condition: breeze
      schedule: fixed
      conditions:
        # One condition, so nothing schedules away from it. Clear and dry: the demo is about the
        # geometry, and a cloud deck or fog would only sit between the camera and it.
        - name: breeze
          weight: 1.0
          duration: [9999, 9999]
          cloud_cover: 0.0
          fog_density: 0.0
          sun: 1.0
          ambient: 1.0
          wind_strength: 5.0
          wind_heading: 35
          wind_gust: 0.4
  root_objects:
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -14.0, z: 7.0 }
          rotation: { x: 68.0, y: 0.0, z: 0.0 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 60.0
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: DirectionalLight
          direction: { x: -0.45, y: 0.6, z: -0.65 }
          color: { r: 1.0, g: 0.96, b: 0.9 }
          intensity: 2.2
          cast_shadows: true
      children: []

    - name: ground
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 30.0, y: 30.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: plane
          material: { albedo: { r: 0.24, g: 0.29, b: 0.21 }, roughness: 0.95 }
        - type: BoxCollider
          size: { x: 30.0, y: 30.0, z: 0.2 }
      children: []

    # --- A: a straight trunk. The control: same graph, simplest possible path. ---------------
    - name: Tree_A
      active: true
      components:
        - type: Transform
          position: { x: -5.0, y: 0.0, z: 0.0 }
        - type: ProceduralGraph
          graph: graphs/curve_tree
          seed: 3
          bake: on_change
          inputs:
            path: { curve: PathA }
            trunk_segments: 16
            trunk_radius: 0.26
            tip_taper: 0.18
            branch_count: 14
            branch_length: 1.0
            branch_spread: 0.55
            lean_low: 70.0
            lean_high: 30.0
            length_low: 1.5
            length_high: 0.45
            twigs_per_branch: 7
            twig_length: 0.26
            leaves_per_twig: 8
            leaf_size: 0.28
      children:
        - name: PathA
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: Curve
              closed: false
              resolution: 10
              always_show: true
              points:
                - { p: [0.0, 0.0, 0.0], mode: auto }
                - { p: [0.1, 0.0, 2.0], mode: auto }
                - { p: [0.0, 0.1, 4.2], mode: auto }

    # --- B: the same graph, a leaning S-bent path --------------------------------------------
    - name: Tree_B
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: ProceduralGraph
          graph: graphs/curve_tree
          seed: 11
          bake: on_change
          inputs:
            path: { curve: PathB }
            trunk_segments: 20
            trunk_radius: 0.3
            tip_taper: 0.15
            branch_count: 18
            branch_length: 1.2
            branch_spread: 0.7
            lean_low: 76.0
            lean_high: 26.0
            length_low: 1.6
            length_high: 0.4
            twigs_per_branch: 8
            twig_length: 0.3
            leaves_per_twig: 8
            leaf_size: 0.28
      children:
        - name: PathB
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: Curve
              closed: false
              resolution: 12
              always_show: true
              points:
                - { p: [0.0, 0.0, 0.0], mode: auto }
                - { p: [-0.35, 0.15, 1.8], mode: auto }
                - { p: [0.25, -0.1, 3.4], mode: auto }
                - { p: [0.6, 0.2, 5.0], mode: auto }

        # A gust sitting on B's canopy and nowhere else, so the three trees read side by side:
        # A and C in the scene's 5 m/s breeze, B in a near-gale. This is what toyengine/env is
        # for -- the foliage shader never learns a local source exists, it just asks the field
        # (gfx_world_wind_at), and the same answer drives B's SHADOW, so the shadow sways too.
        #
        # A COLUMN, not a sphere, and this is load-bearing rather than taste. The foliage shader
        # samples the wind once per object, at `model[3]` -- the object's ORIGIN. Each leaf card
        # is its own instance, so each samples up in the canopy where it sits; but trunk,
        # branches and twigs are a single mesh whose origin is the tree's ROOT at z = 0. A
        # sphere hung over the canopy therefore blows the leaves at full strength and leaves the
        # wood becalmed at its rim, which looks exactly like the sway being broken.
        #
        # A cylinder about +Z reaches the ground, so the root samples full strength, and it stays
        # narrow: radius 2.8 m clears A's outermost branch tips at x = -3.5 and C's at x = 4.0
        # completely, which a sphere wide enough to reach the root could not.
        - name: GustB
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 2.5 }
            - type: EnvInfluence
              shape: disc
              radius: 2.8
              height: 6.0
              falloff: 0.35
              mode: directional
              wind: { x: 11.0, y: 8.0, z: -1.5 }   # ~13.7 m/s, ADDED to the scene's breeze
              turbulence: 0.85                     # the extra flutter a gust front carries
              blend: add
              strength: 1.0

    # --- C: B's path again, but coarse and heavy: the INPUTS doing the work ------------------
    - name: Tree_C
      active: true
      components:
        - type: Transform
          position: { x: 5.5, y: 0.0, z: 0.0 }
        - type: ProceduralGraph
          graph: graphs/curve_tree
          seed: 29
          bake: on_change
          inputs:
            path: { curve: PathC }
            trunk_segments: 18
            trunk_radius: 0.38
            tip_taper: 0.2
            branch_count: 20
            branch_length: 1.4
            branch_spread: 0.6
            lean_low: 80.0
            lean_high: 22.0
            length_low: 1.7
            length_high: 0.4
            twigs_per_branch: 9
            twig_length: 0.34
            leaves_per_twig: 8
            leaf_size: 0.28
      children:
        - name: PathC
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: Curve
              closed: false
              resolution: 12
              always_show: true
              points:
                - { p: [0.0, 0.0, 0.0], mode: auto }
                - { p: [-0.35, 0.15, 1.8], mode: auto }
                - { p: [0.25, -0.1, 3.4], mode: auto }
                - { p: [0.6, 0.2, 5.0], mode: auto }
