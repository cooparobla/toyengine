# fog_demo -- global fog, local volumes and volumetric lighting, one station per use.
#
# Run:   ./build/toyengine fog_demo        (or SCENE=fog_demo)
#        Orbit the camera (drag, scroll) -- look TOWARD the sun (it sits beyond the far side
#        of the scene) to see forward scattering at its strongest.
#
# Two systems, two switches in assets/config.yaml (both startup-fixed, so restart after
# changing them):
#   volumetrics_enabled  local Volume components, marched with sun shadows and point/spot
#                        light scattering (on by default). Everything below is one of these.
#   fog_enabled          the GLOBAL analytic distance/height fog layer (on by default). With it
#                        on it layers over the volumes; this scene's settings block tunes
#                        it for this scene.
# Useful views (render.debug_view, runtime): off | volumetrics (accumulated density alone).
#
# Authoring note: a volume's `color` is a FLAT glow added wherever it has density, lit or
# not; `sun_amount` weights the sun AND point/spot in-scatter (shadowed). A volume meant to
# show light (the stage, the lantern) wants a dark `color` and a high `sun_amount`; a volume
# meant to read as mist on its own (the courtyard, the statue) wants the opposite.
# Knobs worth sweeping: volumetrics_mode (froxel = Unreal-style grid, raymarch = per-pixel),
# volumetrics_quality, volumetrics_shadows_enabled, volumetrics_light_scatter,
# volumetrics_sun_anisotropy, volumetrics_froxel_history.
#
# Stations (Z up, metres; the camera starts looking +Y across the middle of the scene):
#   ground_mist   (whole scene) uniform `fog` volume with an exponential height falloff:
#                 knee-deep mist everywhere -- the medium every other station's light shows in.
#   PERGOLA       (x -12)  slatted roof between the sun and the mist: sun shafts / god rays
#                 (needs volumetrics_shadows_enabled).
#   STAGE         (x -4)   roofed, dark-walled stage filled with uniform `fog` that sits in the
#                 sun's shadow, lit by two coloured spotlights: light cones made visible by
#                 point/spot in-scatter (volumetrics_light_scatter). Uniform rather than `haze`:
#                 haze's noise leaves thin patches at this scale, which can hide a whole cone.
#   LANTERN       (x +4)   warm point light inside a SPHERE `fog` pocket, and a ball orbiting
#                 through it: halo, soft spherical bounds, and temporal stability around a
#                 moving occluder (froxel history ghosting shows here first).
#   WIND FIELD    (x +12)  `wind` volume -- thin advected ribbons streaming past a fence, in
#                 front of a dark wall so the bright streaks read.
#   COURTYARD     (x +9, y -6)  walled pit filled with a hard-topped `fog` box: a pool of fog
#                 with a crisp surface (low `falloff`).
#   STATUE        (x -10, y -6) column wrapped in a soft SPHERE `fog` pocket (high `falloff`).
#   HAZE BANK     (y +18)  large drifting `haze` behind towers at increasing depth: aerial
#                 perspective and slow billowing.
scene:
  scene_name: fog_demo
  settings:
    render:
      volumetrics_max_distance: 70.0   # the scene is ~50 m deep; march all of it
      fog_mode: 1                      # global height fog (only when fog_enabled)
      fog_density: 0.015
      fog_color: [0.62, 0.66, 0.74]
      fog_height_base: 0.0
      fog_height_falloff: 6.0
      fog_sun_amount: 0.5
      fog_sun_anisotropy: 0.75
  root_objects:
    - name: ground
      active: true
      components:
        - type: Transform
          position: { x: 0, y: 4, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 26, y: 26, z: 1 }
        - type: MeshRenderer
          mesh_path: plane
          material: { albedo: { r: 0.36, g: 0.37, b: 0.35 }, metallic: 0.0, roughness: 0.85, ao: 1.0 }
      children: []

    - name: ground_mist
      active: true
      components:
