          position: { x: 0, y: 4, z: 2.0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Volume
          kind: fog
          shape: box
          extent: { x: 26.0, y: 26.0, z: 2.0 }
          density: 0.015
          falloff: 0.05
          height_base: 0.0
          height_falloff: 0.7
          occlusion: 0.5
          sun_amount: 0.7
          color: { r: 0.78, g: 0.82, b: 0.88 }
      children: []

