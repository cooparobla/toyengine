scene:
  scene_name: moebius_demo
  settings:
    render:
      aa_mode: "off"
      ambient_intensity: 0.4
      auto_exposure_enabled: false
      bloom_enabled: false
      depth_threshold: 0.03
      dither_enabled: false
      exposure: 0.62
      fog_enabled: false
      grading_lut: assets/luts/moebius.png
      hatch_angle_deg: 35.0
      hatch_enabled: true
      hatch_layers: 2
      hatch_scale: 5.0
      hatch_softness: 0.0
      hatch_space: surface
      hatch_strength: 0.85
      hatch_threshold: 0.45
      # The terrain shades as plain PBR, so its whole lit mid-tone (~0.29 luma) sits under
      # the 0.45 cutoff above and the entire landscape hatches. Un-banded surfaces get
      # this lower cutoff instead: lit sand comes out clean, and ink survives only in the
      # genuinely dark places -- which on a desert floor means the shadows cast onto it.
      # The props are toon-banded and keep hatch_threshold.
      hatch_pbr_threshold: 0.22
      normal_threshold: 0.6
      outline_color: [0.05, 0.05, 0.08, 1.0]
      outline_crease_fade: 0.15
      # The lake bed and anything standing in it are seen THROUGH the water. A hard
      # contour there reads as sitting on top of the surface rather than under it, so
      # only the waterline itself stays drawn.
      outline_through_water: 1.0
      outline_enabled: true
      outline_mode: all
      outline_thickness: 1.0
      palette: assets/palettes/moebius.png
      palette_enabled: false
      paper_strength: 0.6
      sky_ground: [0.52, 0.46, 0.52]
      sky_horizon: [0.82, 0.78, 0.80]
      sky_intensity: 0.45
      sky_model: gradient
      sky_zenith: [0.42, 0.48, 0.76]
      soft_lighting: true
      ssao_enabled: true
      toon_shadow_tint: [0.8, 0.78, 0.86]
      toon_spec_edge: 0.02
      toon_spec_threshold: 0.5
  root_objects:
    - name: terrain
      active: true
      components:
        - type: Transform
          # z = -PLAYA * height from tools/gen_moebius_dunes.py: it drops the flat pan onto
          # world z = 0, so every prop below still stands exactly on the ground and the lake
          # bed sits genuinely beneath it. Move one and the other must move with it.
          position: { x: -1.28e+02, y: -1.28e+02, z: -6.0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Terrain
          mode: heightmap
          chunk_size: 32
          collision: true
          # The lake. A one-shot flood of every basin under this absolute level, which is what
          # makes it the TERRAIN's water: it fits the bed exactly and gets a real shoreline
          # wherever the ground crosses the level. The planar WaterBody this replaced was a flat
          # sheet that knew nothing about the bed, so the terrain swallowed it at any distance
          # where the basin stopped being tessellated.
          # LOCAL height-space metres (0..height), not world Z -- the pan sits at
          # local 6.0 (PLAYA * height), so this is a surface 1.5 m below it.
          fill_water: { level: 4.5, kind: lake }
          water:
            clarity: 3.0
            wave_amplitude: 0.05
            wave_direction: 2.5e+01
            wave_length: 4.0
            wave_steepness: 0.25
          shore_clearance: 0.08
          water_skirt_tiles: 4
          height: 2.4e+01
          layer_texture_size: 512
          layers:
            - { name: sand, albedo: textures/terrain/layers/sand_albedo.png, normal: textures/terrain/layers/sand_normal.png, roughness: 0.95, tiling: 7, tint: { r: 1.0, g: 0.99, b: 0.96 } }
            - { name: dirt, albedo: textures/terrain/layers/dirt_albedo.png, normal: textures/terrain/layers/dirt_normal.png, roughness: 0.9, tiling: 5, tint: { r: 0.95, g: 0.9, b: 0.86 } }
            - { name: rock, albedo: textures/terrain/layers/rock_albedo.png, normal: textures/terrain/layers/rock_normal.png, roughness: 0.8, tiling: 9, triplanar: true, tint: { r: 0.86, g: 0.76, b: 0.78 } }
            - { name: cliff, albedo: textures/terrain/layers/cliff_albedo.png, normal: textures/terrain/layers/cliff_normal.png, roughness: 0.75, tiling: 16, triplanar: true, triplanar_sharpness: 6, tint: { r: 0.74, g: 0.68, b: 0.82 } }
          import:
            height: terrain/height.png
            layer0: terrain/splat0.png
          resolution: 513
          shadow_distance: 2.2e+02
          size: { x: 2.56e+02, y: 2.56e+02 }
          splat_resolution: 512
          tessellation: { edge_pixels: 8, max_distance: 3.2e+02 }
          view_distance: 3.2e+02
        - { type: WeatherSurface }
      children:
        - name: scrub_scatter
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
            - type: ParticleSystem
              align_to_normal: true
              cast_shadows: false
              material:
                albedo: { r: 0.38, g: 0.56, b: 0.36 }
                alpha_cutoff: 0.4
                alpha_mode: CUTOUT
                cull_backfaces: false
                texture_albedo: textures/foliage/grass_blade.png
                texture_alpha_mask: textures/foliage/grass_blade_mask.png
                roughness: 0.9
                shader: foliage
                shader_params: [0.3, 2.2, 0.5, 0]
                toon_bands: 3
                toon_softness: 0.15
                toon_specular: off
              max_draw_distance: 9.0e+01
              mode: scatter
              random_spin: true
              render_mesh: nature/grass_tuft
              render_mode: mesh
              seed: 31
              shape: terrain
              start_size: [1.3, 2.2]
              terrain: { density: 0.5, fade_start: 0.5, layer: dirt, min_weight: 0.35, sink: 0.05, slope_max: 26 }
