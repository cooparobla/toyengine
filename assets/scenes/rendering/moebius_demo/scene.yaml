    # Three rocks standing in the lake, straddling the waterline at world z = -1.5 (the
    # terrain's local 4.5 plus its Transform.z of -6). They are what `outline_through_water`
    # is for: each is drawn with a contour above the surface and none below it, so the stone
    # reads as entering the water instead of as a shape pasted over it.
    - name: lake_rock_near
      active: true
      components:
        - type: Transform
          position: { x: -1.5e+01, y: 5.6e+01, z: -2.6 }
          rotation: { x: 0, y: 0, z: 2.0e+01 }
          scale: { x: 2.2, y: 2.0, z: 2.6 }
