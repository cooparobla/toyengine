# shadow_offscreen_demo -- off-screen shadow casters still shadow the visible floor.
#
# Run: ./build/toyengine shadow_offscreen_demo       (or SCENE=shadow_offscreen_demo)
#
# Three 10 m casters sit far outside the camera's LEFT frustum edge (x = -17.32), under a sun at
# a 30 degree elevation travelling along +X, so each caster's shadow sweeps the floor from
# directly beneath it (off screen) out to roughly x = 0 -- squarely in view. The three are spaced
# along Y so their shadow bands do not overlap, and each exercises a different code path that
# used to drop an off-screen caster from the cascade/cull entirely (see
# tests/engine/gpu/shadow_offscreen_test.cpp for the automated version of this check):
#   caster_mesh      (y = -5)  a plain MeshRenderer -- the cascade-reach fix (pipeline_shadows.cpp)
#   caster_painted    (y = -9) the same box painted via InstancePainter -- the instanced-batch
#                     cull fix (Engine::sync_particle_render_state_(), engine_render_sync.cpp)
#   caster_particle   (y = -1) a mesh-mode ParticleSystem -- the same cull fix's other producer.
#                     Mesh-mode particles only scale uniformly (no per-axis equivalent of a
#                     MeshRenderer's non-uniform scale), so this caster is a 10 m CUBE rather
#                     than a thin tall box -- expect a wider shadow band here than the other two.
#
# Press Play and fly (WASD, mouse to look) along -X past each caster's position to watch its
# shadow band hold steady on the floor as the caster itself leaves the view -- it must neither
# pop away nor flicker. Stop and hold still for a second or two at each position; this scene is
# the manual hand-eye counterpart to the automated test above.
scene:
  scene_name: shadow_offscreen_demo
  root_objects:
    - name: floor
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: -0.1 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 300.0, y: 300.0, z: 0.2 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.75, g: 0.75, b: 0.75 }, metallic: 0.0, roughness: 0.8, ao: 1.0 }
      children: []

    - name: caster_mesh
      active: true
      components:
        - type: Transform
          position: { x: -17.32, y: -5.0, z: 5.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.5, y: 1.5, z: 10.0 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.75, g: 0.25, b: 0.2 }, metallic: 0.0, roughness: 0.6, ao: 1.0 }
          cast_shadows: true
      children: []

    - name: caster_painted
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: InstancePainter
          cast_shadows: true
          chunk_size: 32.0
          collision_radius: 0.0
          data: instances/caster_b.instances
          prototypes:
            - mesh: cube
              material: { albedo: { r: 0.25, g: 0.65, b: 0.3 }, metallic: 0.0, roughness: 0.6, ao: 1.0 }
      children: []

    - name: caster_particle
      active: true
      components:
        - type: Transform
          position: { x: -17.32, y: -1.0, z: 5.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: ParticleSystem
          mode: scatter
          shape: point
          count: 1
          start_size: 10.0
          render_mode: mesh
          render_mesh: cube
          material: { albedo: { r: 0.3, g: 0.35, b: 0.8 }, metallic: 0.0, roughness: 0.6, ao: 1.0 }
          cast_shadows: true
      children: []

    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -15.0, z: 2.0 }
          rotation: { x: 90.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 50.0
          near_clip_plane: 0.1
          far_clip_plane: 200.0
        - type: CameraController
          mode: fly
          move_speed: 6.0
          mouse_sensitivity: 0.15
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 10.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          direction: { x: 0.866025, y: 0.0, z: -0.5 }
          color: { r: 1.0, g: 0.96, b: 0.9 }
          intensity: 5.0
          cast_shadows: true
        - type: EnvironmentLight
          sky_color: { r: 0.45, g: 0.58, b: 0.86 }
          ground_color: { r: 0.2, g: 0.18, b: 0.16 }
          sky_intensity: 1.0
      children: []
