# ssr_demo -- a bench for screen-space reflections (and the SSGI bounce that shares its trace).
#
# Run:   ./build/toyengine ssr_demo        (or SCENE=ssr_demo)
# Views: set render.debug_view in assets/config.yaml (runtime, also switchable in the editor):
#          off             the finished frame
#          ssr             the resolved reflection colour on its own
#          ssr_confidence  where reflection rays found geometry (white) vs fell back to the sky
#          ssgi            the traced diffuse bounce
#          velocity        the motion vectors the reflections are reprojected with
#        Knobs worth sweeping: ssr_jitter (0 = mirror ray, 1 = full GGX lobe), ssr_quality
#        (Ultra = 2 rays/pixel), ssr_cone_prefilter, ssr_temporal_enabled, ssr_half_res,
#        ssr_roughness_cutoff, ssgi_quality (Low/Medium halve the bounce's resolution).
#
# Layout (Z up, metres; the camera orbits the middle -- drag to orbit, scroll to zoom):
#   Four 6 m floor strips, left to right, with IDENTICAL props on each, so the same reflection
#   can be compared across surface roughness:
#     x = -9  MIRROR    metal, roughness 0.02 -- pixel-sharp reflections; virtual-point reprojection
#     x = -3  POLISHED  black dielectric, roughness 0.08 -- Fresnel: strong only at grazing angles
#     x = +3  GLOSSY    metal, roughness 0.3 -- GGX-sampled lobe, stretched highlights
#     x = +9  ROUGH     metal, roughness 0.6 -- wide lobe, roughness-aware denoise at full strength
#   Props on every strip:
#     pillar      tall coloured block (each strip a different colour, so strips are easy to tell
#                 apart in the reflection views)
#     pole        a 10 cm post -- thin geometry: rays pass behind it, the classic SSR failure
#     glass       a BLEND refractive sphere -- reflected through the previous frame's colour
#     orb         small emissive sphere -- a bright point that shows lobe shape and blur
#     runner      a ball sliding back and forth along Y -- a moving object in the reflections
#                 (no trail, no lag behind it)
#   Shared set pieces:
#     backdrop    black/white striped wall at y = +7.5 -- reflection sharpness and distortion
#     mirror_wall a vertical chrome panel at x = -12.4 facing the strips -- vertical and
#                 grazing reflections, and mirror-in-mirror between it and the mirror floor
#     spinner     a spinning chrome cube between the middle strips -- a MOVING REFLECTOR
#     orbiter     a chrome sphere circling the centre -- moving reflector AND moving reflected
#   Screen edges: orbit so a reflected object leaves the frame to see the edge fade.
