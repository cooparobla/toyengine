scene:
  scene_name: xray_demo
  settings:
    physics:
      gravity: { x: 0, y: 0, z: -9.81 }
    render:
      ambient_intensity: 0.45
      outline_enabled: false
      xray_color: [0.25, 0.85, 1.0, 0.6]
      xray_depth_fade: 0.0
      xray_enabled: true
      xray_mode: silhouette
      xray_thickness: 2.0
  root_objects:
    - name: ground
      components:
        - type: Transform
          position: { x: 0, y: 0, z: -0.25 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 60, y: 60, z: 0.5 }
        - type: MeshRenderer
          material:
            base: materials/prototype_grid
            albedo: { b: 0.6, g: 0.57, r: 0.55 }
          mesh_path: cube
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []
    - name: player
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 0.9 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 0.7, y: 0.7, z: 1.8 }
        - type: MeshRenderer
          material:
            base: materials/prototype_grid
            albedo: { b: 0.24, g: 0.32, r: 0.85 }
          mesh_path: cube
        - type: CharacterController
          height: 1.8
          jump_height: 1.0
          move_speed: 4.0
          radius: 0.35
          slope_limit: 45.0
          sprint_multiplier: 1.8
          step_height: 0.35
        - { type: XraySubject }
      children:
        - name: player_head
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0.62 }
              rotation: { x: 0, y: 0, z: 0 }
              scale: { x: 0.63, y: 0.63, z: 0.34 }
            - type: MeshRenderer
              material:
                base: materials/prototype_grid
                albedo: { b: 0.62, g: 0.78, r: 0.92 }
              mesh_path: sphere
          children: []
        - name: player_pack
          components:
            - type: Transform
              position: { x: 0, y: 0.5, z: 0.15 }
              rotation: { x: 0, y: 0, z: 0 }
              scale: { x: 0.8, y: 0.5, z: 0.5 }
            - type: MeshRenderer
              material:
                base: materials/prototype_grid
                albedo: { b: 0.35, g: 0.45, r: 0.3 }
              mesh_path: cube
          children: []
    - name: pavilion_roof
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 3.35 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 9.0, y: 9.0, z: 0.3 }
        - type: MeshRenderer
