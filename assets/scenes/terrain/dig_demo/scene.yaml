scene:
  scene_name: dig_demo
  # A small coast with a river running down it, to dig holes in: runtime terrain editing and the
  # water that follows it (toyengine/world/tile_edit.h, tile_water.h). The sea, the lakes and
  # the river all behave the same way -- water fills what you open beside it, at its own level.
  #
  #   left-drag          digs the tile the outline is on; the sea, a lake or a river beside it
  #                      runs in over the next frames
  #   ctrl + left        raises instead -- ground pushed up through the surface sheds its water
  #                      (ctrl, not shift: shift already moves the marker down)
  #   right-drag         turns the camera
  #   WASD / E / Q       move the marker the camera follows (it is the thing you fly, not the camera)
  #   wheel              zooms
  #
  # Deliberately small (160 tiles a side, everything streamed in at once) and shallow
  # (height_scale 10, so a couple of digs reach the water line). The cursor stays visible, since
  # aiming at a tile is the whole point; terrain_demo and planet_demo carry the same digger on
  # their own worlds.
  settings:
    render:
      shadow_distance: 1.2e+02
      shadow_fit: focus
      shadow_focus_radius: 18.0
      shadow_softness: 0.35
  root_objects:
    - name: terrain
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: TileTerrain
          # 16-tile chunks: a dug tile re-meshes a smaller patch, so the change lands sooner.
          chunk_size: 16
          collision: true
          collision_radius: 6
          generator:
            grid_size: 40
            seed: 20261017
            shape: { shape: continents }
          height_scale: 1.0e+01
          height_step: 1.0
          kind_tile_sets:
            rock: objects/terrain/tileset_rock
            stone: objects/terrain/tileset_rock
          material:
            albedo: { b: 1.0, g: 1.0, r: 1.0 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.9
            texture_albedo: textures/terrain_atlas.png
            texture_metallic_roughness: textures/terrain_atlas_mr.png
          max_wall_steps: 8
          river_inset: 0.2
          soil_depth_steps: 1
          tile_set: objects/terrain/tileset_soft
          tile_size: 1.0
          # The whole island group is resident: 160 tiles is 10 chunks a side, and a flood that
          # runs off the loaded region would stop at its edge.
          view_radius: 8
          water_inset: 0.5
          world_tiles: 160
      children: []
    # What the camera follows and what WASD moves -- nothing is drawn for it (see FreeMover).
    - name: focus_marker
      active: true
      components:
        - type: Transform
          position: { x: 6.2e+01, y: 8.4e+01, z: 4.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - { type: FreeMover, move_speed: 14.0, smoothing: 12.0 }
      children: []
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 6.2e+01, y: 5.7e+01, z: 2.2e+01 }
          rotation: { x: 55.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          far_clip_plane: 1.0e+03
          fov: 5.5e+01
          main: true
          near_clip_plane: 0.3
          projection: Perspective
        # The cursor stays visible and the RIGHT button turns the camera, so the left and middle
        # buttons are free to point at tiles.
        - type: CameraController
          capture_cursor: false
          collide: false
          distance: 3.2e+01
          follow_smoothing: 8.0
          look_button: right
          max_distance: 1.6e+02
          max_pitch_deg: 85.0
          min_distance: 1.0e+01
          min_pitch_deg: 5.0
          mode: orbit
          mouse_sensitivity: 0.12
          movement_smoothing: 0.25
          pitch_deg: 32.0
          tracker: focus_marker
          yaw_deg: 0.0
          zoom_speed: 4.0
        # Two steps a dig, over a 3x3 patch: deep enough that one drag on a beach reaches the
        # water line, small enough to watch the sea pick its way in tile by tile. The LEFT
        # button, because right-drag turns the camera and a wheel-click is the one button a
        # desktop is liable to swallow before the game ever sees it.
        - type: TerrainDigger
          dig_button: left
          radius: 1
          raise_key: ctrl
          repeat_seconds: 0.1
          steps: 2
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 4.0e+01 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.9, g: 0.97, r: 1.0 }
          direction: { x: -0.45, y: 0.55, z: -0.7 }
          intensity: 1.3
          shadow_intensity: 0.7
      children: []
    - name: sky
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: EnvironmentLight
          ground_color: { b: 0.18, g: 0.23, r: 0.25 }
          sky_color: { b: 0.95, g: 0.75, r: 0.55 }
          sky_intensity: 1.1
      children: []
