scene:
  scene_name: heightmap_terrain_demo
  settings:
    weather:
      condition: clear
      day_length_minutes: 20
      drive_sun: true
      enabled: true
      ground_height: 0.0
      latitude: 45
      schedule: fixed
      snow_accumulate_time: 60
      snow_auto_deformers: true
      snow_max_depth: 0.4
      sun_intensity: 1.2
      time_of_day: 9.5
  root_objects:
    - name: terrain
      components:
        - type: Transform
          position: { x: -512, y: -512, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: HeightmapTerrain
          chunk_size: 64
          collision: true
          deep_snow: true
          height: 160
          heightmap: terrain/height.png
          layer_texture_size: 512
          layers:
            - name: grass
              albedo: textures/terrain/layers/grass_albedo.png
              normal: textures/terrain/layers/grass_normal.png
              roughness: 0.9
              tiling: 4
            - name: dirt
              albedo: textures/terrain/layers/dirt_albedo.png
              normal: textures/terrain/layers/dirt_normal.png
              roughness: 0.85
              tiling: 5
            - name: rock
              albedo: textures/terrain/layers/rock_albedo.png
              normal: textures/terrain/layers/rock_normal.png
              roughness: 0.75
              tiling: 9
              triplanar: true
            - name: cliff
              albedo: textures/terrain/layers/cliff_albedo.png
              normal: textures/terrain/layers/cliff_normal.png
              roughness: 0.7
              tiling: 18
              triplanar: true
              triplanar_sharpness: 6
            - name: sand
              albedo: textures/terrain/layers/sand_albedo.png
              normal: textures/terrain/layers/sand_normal.png
              roughness: 0.9
              tiling: 6
            - name: snow
              albedo: textures/terrain/layers/snow_albedo.png
              normal: textures/terrain/layers/snow_normal.png
              roughness: 0.6
              tiling: 8
            - name: forest_floor
              albedo: textures/terrain/layers/forest_floor_albedo.png
              normal: textures/terrain/layers/forest_floor_normal.png
              roughness: 0.95
              tiling: 5
          puddles: true
          resolution: 1025
          size: { x: 1024, y: 1024 }
          splat0: terrain/splat0.png
          splat1: terrain/splat1.png
          splat_resolution: 1024
          tessellation: { edge_pixels: 8 }
          view_distance: 0
          shadow_distance: 600
        - { type: WeatherSurface }
      children:
        - name: grass
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            - type: ParticleSystem
              align_to_normal: true
              material:
                albedo: { b: 0.75, g: 1.0, r: 0.85 }
                alpha_cutoff: 0.4
                alpha_mode: CUTOUT
                roughness: 0.8
                texture_albedo: textures/terrain/layers/grass_blades.png
                texture_alpha_mask: textures/terrain/layers/grass_blades.png
                shader: foliage                       # bends in the weather's wind
                shader_params: [0.35, 2.5, 0.6, 0]    # flexibility, frequency, height (m), Z up
              max_draw_distance: 80
              cast_shadows: false
              mode: scatter
              random_spin: true
              render_mesh: nature/grass_tuft
              render_mode: mesh
              seed: 11
              shape: terrain
              start_size: [0.6, 1.1]
              terrain: { density: 2.0, fade_start: 0.5, layer: grass, min_weight: 0.35, sink: 0.05, slope_max: 30 }
        - name: pine_trunks
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            - type: ParticleSystem
              material:
                albedo: { b: 0.17, g: 0.24, r: 0.33 }
                roughness: 0.9
              mode: scatter
              random_spin: true
              render_mesh: nature/pine_trunk
              render_mode: mesh
              seed: 77
              shape: terrain
              start_size: [0.8, 1.3]
              terrain: { density: 0.012, layer: forest_floor, min_weight: 0.3, sink: 0.3, slope_max: 24 }
        - name: pine_canopies
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            - type: ParticleSystem
              material:
                albedo: { b: 0.14, g: 0.3, r: 0.16 }
                roughness: 0.85
                shader: foliage                       # canopies sway gently; trunks stay rigid
                shader_params: [0.04, 0.9, 8.4, 0]
              mode: scatter
              random_spin: true
              render_mesh: nature/pine_canopy
              render_mode: mesh
              seed: 77
              shape: terrain
              start_size: [0.8, 1.3]
              terrain: { density: 0.012, layer: forest_floor, min_weight: 0.3, sink: 0.3, slope_max: 24 }
        - name: bushes
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            - type: ParticleSystem
              align_to_normal: true
              material:
                albedo: { b: 0.16, g: 0.38, r: 0.22 }
                roughness: 0.85
                shader: foliage
                shader_params: [0.1, 1.4, 1.0, 0]
              mode: scatter
              random_spin: true
              render_mesh: nature/bush
              render_mode: mesh
              seed: 31
              shape: terrain
              start_size: [0.6, 1.4]
              terrain: { density: 0.03, layer: forest_floor, min_weight: 0.1, sink: 0.1, slope_max: 30 }
        - name: boulders
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            - type: ParticleSystem
              align_to_normal: true
              material:
                albedo: { b: 0.43, g: 0.46, r: 0.48 }
                roughness: 0.8
              mode: scatter
              random_spin: true
              render_mesh: nature/boulder
              render_mode: mesh
              seed: 5
              shape: terrain
              start_size: [0.8, 2.6]
              terrain: { density: 0.006, layer: rock, min_weight: 0.3, sink: 0.25 }
    - name: lake
      components:
        - type: Transform
          position: { x: -182, y: -262, z: 16.0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - { type: MeshRenderer, affects_reflection_probes: false, material: materials/water }
        - type: WaterBody
          clarity: 4.0
          mode: planar
          resolution: 4
          size: { x: 2.5e+02, y: 2.5e+02 }
          wave_amplitude: 0.08
          wave_direction: 4.0e+01
          wave_length: 5.0
          wave_steepness: 0.3
      children: []
    - name: player
      prefab: objects/mannequin_ragdoll
      components:
        - type: Transform
          position: { x: 60, y: 10, z: 45 }
          rotation: { x: 0, y: 0, z: 200 }
          scale: { x: 1, y: 1, z: 1 }
        - type: CharacterController
          height: 1.8
          jump_height: 1.2
          move_speed: 3.0
          radius: 0.3
          slope_limit: 45.0
          sprint_multiplier: 3.0
          step_height: 0.35
          use_root_motion: true
        - { type: Animator, apply_root_motion: true }
        - { type: CharacterAnimDriver, crossfade: 0.2, run_speed: 4.0, walk_speed: 0.2 }
        - { type: FootIK, ray_down: 0.4, ray_up: 0.45 }
        - { type: SnowDeformer, radius: 0.35 }
    - name: camera
      components:
        - type: Transform
          position: { x: 60, y: 2, z: 52 }
          rotation: { x: 70, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Camera
          far_clip_plane: 2.0e+03
          fov: 6.0e+01
          main: true
          near_clip_plane: 0.1
          projection: Perspective
        - type: CameraController
          collide: true
          collision_radius: 0.25
          distance: 1.0e+01
          follow_smoothing: 12.0
          max_distance: 6.0e+01
          max_pitch_deg: 8.0e+01
          min_distance: 1.5
          min_pitch_deg: -1.0e+01
          mode: orbit
          mouse_sensitivity: 0.12
          movement_smoothing: 0.2
          pitch_deg: 18.0
          target_offset: { x: 0, y: 0, z: 1.4 }
          tracker: player
          yaw_deg: 2.0e+02
      children: []
    - name: sun
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 200 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.9, g: 0.96, r: 1.0 }
          direction: { x: -0.45, y: 0.55, z: -0.6 }
          intensity: 1.0
      children: []
