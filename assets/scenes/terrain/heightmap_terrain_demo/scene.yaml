# heightmap_terrain_demo -- the sculptable heightmap terrain (HeightmapTerrain, toyengine/world/
# heightmap_terrain.h): a 1 km valley drawn from a 16-bit heightmap, painted with seven layers,
# collided as a heightfield, dressed with streamed foliage, and lit by the weather.
#
# Run: ./build/toyengine heightmap_terrain_demo        (or SCENE=heightmap_terrain_demo)
# Controls: WASD move, Space jump, LeftShift sprint, mouse orbits, scroll zooms.
#
#   terrain       1024 x 1024 m, 160 m tall, 64 m chunks, 1025 x 1025 heights
#                 (terrain/height.png; terrain/splat0.png + splat1.png paint it). Every chunk is one
#                 instance of the same flat patch, displaced on the GPU and tessellated near the
#                 camera; the collider reads the same grid. Regenerate the files with
#                 tools/gen_heightmap_terrain_demo.py, or sculpt / paint in the editor's Terrain mode.
#     layers      grass, dirt, rock (triplanar), cliff (triplanar), sand, snow, forest floor.
#     grass       tufts on the grass layer, streamed within 70 m of the camera
#     pines       trunks + canopies on the forest floor (two systems, same seed: they line up)
#     bushes      on grass and forest edges; boulders on the rock layer
#   lake          a planar WaterBody filling the south-west basin (and its shore is sand)
#   player        the mannequin with a CharacterController, walking on the heightfield
#
# Weather: clear by default. In the editor's World tab, Preview `snow` to see deep snow pile up
# on flat ground (trenches follow the player) and `rain` to see the ground darken, gloss up and
# puddle in the hollows. Needs render transparency_enabled (rain), on in assets/config.yaml.
scene:
  scene_name: heightmap_terrain_demo
  settings:
    weather:
      enabled: true
      time_of_day: 9.5
      day_length_minutes: 20
      latitude: 45
      drive_sun: true
      sun_intensity: 1.2
      condition: clear
      schedule: fixed
      snow_accumulate_time: 60
      snow_max_depth: 0.4
      snow_auto_deformers: true
      ground_height: 0.0
  root_objects:
    # The terrain's grid corner sits at its object's position: (-512, -512) centres it.
    - name: terrain
      components:
        - type: Transform
          position: { x: -512, y: -512, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: HeightmapTerrain
          size: { x: 1024, y: 1024 }
          height: 160
          chunk_size: 64
          resolution: 1025
          splat_resolution: 1024
          heightmap: terrain/height.png
          splat0: terrain/splat0.png
          splat1: terrain/splat1.png
          layer_texture_size: 512
          layers:
            - { name: grass, albedo: textures/terrain/layers/grass_albedo.png, normal: textures/terrain/layers/grass_normal.png, tiling: 4, roughness: 0.9 }
            - { name: dirt, albedo: textures/terrain/layers/dirt_albedo.png, normal: textures/terrain/layers/dirt_normal.png, tiling: 5, roughness: 0.85 }
            - { name: rock, albedo: textures/terrain/layers/rock_albedo.png, normal: textures/terrain/layers/rock_normal.png, tiling: 9, roughness: 0.75, triplanar: true }
            - { name: cliff, albedo: textures/terrain/layers/cliff_albedo.png, normal: textures/terrain/layers/cliff_normal.png, tiling: 18, roughness: 0.7, triplanar: true, triplanar_sharpness: 6 }
            - { name: sand, albedo: textures/terrain/layers/sand_albedo.png, normal: textures/terrain/layers/sand_normal.png, tiling: 6, roughness: 0.9 }
            - { name: snow, albedo: textures/terrain/layers/snow_albedo.png, normal: textures/terrain/layers/snow_normal.png, tiling: 8, roughness: 0.6 }
            - { name: forest_floor, albedo: textures/terrain/layers/forest_floor_albedo.png, normal: textures/terrain/layers/forest_floor_normal.png, tiling: 5, roughness: 0.95 }
          tessellation: { edge_pixels: 8, max_factor: 32, max_distance: 350 }
          deep_snow: true
          puddles: true
          collision: true
        # Rain splashes and settled flakes land on the terrain.
        - type: WeatherSurface
      children:
        - name: grass
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            - type: ParticleSystem
              mode: scatter
              shape: terrain
              terrain: { layer: grass, density: 1.2, min_weight: 0.35, slope_max: 30, sink: 0.05 }
              seed: 11
              align_to_normal: true
              random_spin: true
              start_size: [0.6, 1.1]
              max_draw_distance: 70
              render_mode: mesh
              render_mesh: nature/grass_tuft
              material:
                albedo: { r: 0.85, g: 1.0, b: 0.75 }
                roughness: 0.8
                alpha_mode: CUTOUT
                alpha_cutoff: 0.4
                texture_albedo: textures/terrain/layers/grass_blades.png
                texture_alpha_mask: textures/terrain/layers/grass_blades.png
                # Stock shader, back faces culled: each card is two one-sided faces (one per side),
                # both lit with an up normal like the ground they grow from.
        - name: pine_trunks
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            - type: ParticleSystem
              mode: scatter
              shape: terrain
              terrain: { layer: forest_floor, density: 0.012, min_weight: 0.3, slope_max: 24, sink: 0.3 }
              seed: 77
              random_spin: true
              start_size: [0.8, 1.3]
              max_draw_distance: 600
              render_mode: mesh
              render_mesh: nature/pine_trunk
              material: { albedo: { r: 0.33, g: 0.24, b: 0.17 }, roughness: 0.9 }
        - name: pine_canopies
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            # The trunks' placement exactly (same seed and terrain block): each canopy on its trunk.
            - type: ParticleSystem
              mode: scatter
              shape: terrain
              terrain: { layer: forest_floor, density: 0.012, min_weight: 0.3, slope_max: 24, sink: 0.3 }
              seed: 77
              random_spin: true
              start_size: [0.8, 1.3]
              max_draw_distance: 600
              render_mode: mesh
              render_mesh: nature/pine_canopy
              material: { albedo: { r: 0.16, g: 0.3, b: 0.14 }, roughness: 0.85 }
        - name: bushes
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            - type: ParticleSystem
              mode: scatter
              shape: terrain
              terrain: { layer: forest_floor, density: 0.03, min_weight: 0.1, slope_max: 30, sink: 0.1 }
              seed: 31
              align_to_normal: true
              random_spin: true
              start_size: [0.6, 1.4]
              max_draw_distance: 220
              render_mode: mesh
              render_mesh: nature/bush
              material: { albedo: { r: 0.22, g: 0.38, b: 0.16 }, roughness: 0.85 }
        - name: boulders
          components:
            - type: Transform
              position: { x: 0, y: 0, z: 0 }
            - type: ParticleSystem
              mode: scatter
              shape: terrain
              terrain: { layer: rock, density: 0.006, min_weight: 0.3, sink: 0.25 }
              seed: 5
              align_to_normal: true
              random_spin: true
              start_size: [0.8, 2.6]
              max_draw_distance: 350
              render_mode: mesh
              render_mesh: nature/boulder
              material: { albedo: { r: 0.48, g: 0.46, b: 0.43 }, roughness: 0.8 }

    # The lake in the south-west basin (terrain local (330, 250)); the basin floor is ~7 m below.
    - name: lake
      components:
        - type: Transform
          position: { x: -182, y: -262, z: 16.0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: MeshRenderer
          affects_reflection_probes: false
          material: materials/water
        - type: WaterBody
          mode: planar
          size: { x: 250.0, y: 250.0 }
          resolution: 4
          wave_amplitude: 0.08
          wave_length: 5.0
          wave_direction: 40.0
          wave_steepness: 0.3
          clarity: 4.0
      children: []

    # The player, dropped onto the valley floor (the controller settles it on the heightfield).
    - name: player
      prefab: objects/mannequin_ragdoll
      components:
        - type: Transform
          position: { x: 60, y: 10, z: 45 }
          rotation: { x: 0, y: 0, z: 200 }
          scale: { x: 1, y: 1, z: 1 }
        - type: CharacterController
          radius: 0.3
          height: 1.8
          step_height: 0.35
          slope_limit: 45.0
          move_speed: 3.0
          sprint_multiplier: 3.0
          jump_height: 1.2
          use_root_motion: true
        - type: Animator
          apply_root_motion: true
        - type: CharacterAnimDriver
          walk_speed: 0.2
          run_speed: 4.0
          crossfade: 0.2
        - type: FootIK
          ray_up: 0.45
          ray_down: 0.4
        # Presses trenches into deep snow.
        - type: SnowDeformer
          radius: 0.35

    - name: camera
      components:
        - type: Transform
          position: { x: 60, y: 2, z: 52 }
          rotation: { x: 70, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 60.0
          near_clip_plane: 0.1
          far_clip_plane: 2000.0
        - type: CameraController
          mode: orbit
          tracker: player
          target_offset: { x: 0, y: 0, z: 1.4 }
          follow_smoothing: 12.0
          movement_smoothing: 0.2
          mouse_sensitivity: 0.12
          distance: 10.0
          yaw_deg: 200.0
          pitch_deg: 18.0
          min_pitch_deg: -10.0
          max_pitch_deg: 80.0
          min_distance: 1.5
          max_distance: 60.0
          collide: true
          collision_radius: 0.25
      children: []

    - name: sun
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 200 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: DirectionalLight
          direction: { x: -0.45, y: 0.55, z: -0.6 }
          color: { r: 1.0, g: 0.96, b: 0.9 }
          intensity: 1.0
          cast_shadows: true
      children: []
