scene:
  scene_name: planet_demo
  settings:
    render:
      shadow_distance: 3.0e+02
      shadow_softness: 0.35
      # On a planet the global fog is plain distance fog (world Z is no height there): light, so
      # the far side of a 60 m world still reads.
      fog_density: 0.0015
  root_objects:
    - name: planet
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: TileTerrain
          planet: true
          face_tiles: 96
          gravity: 9.81
          chunk_size: 16
          height_scale: 12.0
          height_step: 1.0
          tile_size: 1.0
          soil_depth_steps: 1
          max_wall_steps: 8
          tile_set: objects/terrain/tileset_soft
          kind_tile_sets:
            rock: objects/terrain/tileset_rock
            stone: objects/terrain/tileset_rock
          generator: { grid_size: 40 }
      children: []
    # The player: dropped above the planet's +Z pole, pulled down onto it by the planet's gravity
    # and walking round it in its own frame (CharacterController's field path).
    - name: player
      prefab: objects/mannequin
      components:
        - type: Transform
          position: { x: 0.0, y: 13.0, z: 77.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: CharacterController
          radius: 0.3
          height: 1.8
          step_height: 1.1
          slope_limit: 50.0
          move_speed: 3.0
          sprint_multiplier: 2.0
          jump_height: 1.2
          use_root_motion: true
        - type: Animator
          apply_root_motion: true
        - type: CharacterAnimDriver
          walk_speed: 0.2
          run_speed: 4.0
          crossfade: 0.2
        - type: FootIK
          ray_up: 0.45
          ray_down: 0.4
    - name: drop_ball_red
      active: true
      components:
        - type: Transform
          position: { x: 75.0, y: 0.0, z: 10.0 }
          scale: { x: 1.5, y: 1.5, z: 1.5 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.15, g: 0.2, r: 0.85 }
            metallic: 0.0
            roughness: 0.5
          mesh_path: sphere_low
        - { type: SphereCollider, material: rubber, radius: 1.0 }
        - { type: Rigidbody, mass: 1.0e+01 }
      children: []
    - name: drop_ball_blue
      active: true
      components:
        - type: Transform
          position: { x: 10.0, y: -75.0, z: 0.0 }
          scale: { x: 1.5, y: 1.5, z: 1.5 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.85, g: 0.35, r: 0.15 }
            metallic: 0.0
            roughness: 0.5
          mesh_path: sphere_low
        - { type: SphereCollider, material: rubber, radius: 1.0 }
        - { type: Rigidbody, mass: 1.0e+01 }
      children: []
    - name: drop_crate
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 10.0, z: 75.0 }
          rotation: { x: 1.0e+01, y: 2.0e+01, z: 3.0e+01 }
          scale: { x: 2.0, y: 2.0, z: 2.0 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.24, g: 0.42, r: 0.62 }
            metallic: 0.0
            roughness: 0.8
          mesh_path: cube
        - type: BoxCollider
          material: wood
          size: { x: 1.0, y: 1.0, z: 1.0 }
        - { type: Rigidbody, mass: 4.0e+01 }
      children: []
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 5.0, z: 82.0 }
          rotation: { x: 65.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          far_clip_plane: 2.0e+03
          fov: 5.0e+01
          main: true
          near_clip_plane: 0.3
          projection: Perspective
        - type: CameraController
          capture_cursor: true
          collide: true
          distance: 9.0
          follow_smoothing: 10.0
          max_distance: 4.0e+02
          max_pitch_deg: 85.0
          min_distance: 2.0
          min_pitch_deg: -20.0
          mode: orbit
          mouse_sensitivity: 0.12
          movement_smoothing: 0.25
          pitch_deg: 25.0
          tracker: player
          target_offset: { x: 0.0, y: 0.0, z: 1.3 }
          yaw_deg: 0.0
          zoom_speed: 2.0
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 4.0e+01 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.9, g: 0.97, r: 1.0 }
          direction: { x: -0.5, y: 0.45, z: -0.74 }
          intensity: 1.35
          shadow_intensity: 0.75
      children: []
    - name: sky
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: EnvironmentLight
          ground_color: { b: 0.17, g: 0.22, r: 0.24 }
          sky_color: { b: 0.94, g: 0.7, r: 0.52 }
          sky_intensity: 1.15
      children: []
