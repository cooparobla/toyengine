scene:
  scene_name: planet_demo
  settings:
    render:
      ambient_intensity: 0.25
      auto_exposure_enabled: false
      cloud_density: 1.0
      cloud_quality: high
      cloud_type: volumetric
      cloud_wind_speed: 4.0
      clouds: true
      fog_density: 0.0
      shadow_distance: 2.8e+03
      shadow_softness: 0.35
      sky_ground: [0.008, 0.01, 0.015]
      sky_horizon: [0.008, 0.01, 0.015]
      sky_model: space
      sky_zenith: [0.008, 0.01, 0.015]
      tilt_shift_enabled: true
      volumetrics_max_distance: 4.0e+03
  root_objects:
    - name: planet
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Terrain
          chunk_size: 64
          collision: false
          face_tiles: 1024
          gravity: 0.0
          height_step: 1.0
          max_wall_steps: 8
          mode: tiles
          planet: true
          planet_coarse_builds: true
          soil_depth_steps: 1
          tile_set: objects/terrain/tileset_voxel
          tile_size: 1.0
          lods:
            - { field: 2, native_border: 1, screen_size: 0.3 }
            - { field: 8, native_border: 1, screen_size: 0.14, smooth: true }
            - { field: 32, screen_size: 0.07, smooth: true }
        - type: MapGenerator
          generator:
            grid_size: 40
            sea_level: 0.45
            seed: 315546511
            shape: { shape: archipelago }
          height_scale: 256.0
          river_inset: 0.2
          sphere: true
          water_inset: 0.5
      children:
        - name: atmosphere
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 1.0, y: 1.0, z: 1.0 }
            - type: Volume
              color: { b: 1.0, g: 0.55, r: 0.35 }
              falloff: 0.75
              kind: fog
              occlusion: 0.55
              shape: shell
              sun_amount: 0.9
            - type: PlanetAtmosphere
              cloud_altitude_peak_scale: 1.15
              day_sky_altitude_scale: 1.5
              moon_intensity: 0.045
              night_sky_color: { b: 0.14, g: 0.07, r: 0.045 }
              limb_optical_depth: 2.0
              scale_height_fraction: 0.25
              thickness_scale: 1.95
          children: []
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -798.88, z: 259.58 }
          rotation: { x: 72.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          fov: 5.0e+01
          main: true
          projection: Perspective
        - type: CameraController
          capture_cursor: false
          collide: false
          key_orbit_speed_deg_per_sec: 6.0e+01
          look_button: right
          max_pitch_deg: 85.0
          min_pitch_deg: -85.0
          mode: orbit
          mouse_sensitivity: 0.15
          movement_smoothing: 0.25
          pitch_at_max_distance_deg: 7.0e+01
          pitch_at_min_distance_deg: 8.0
          pitch_deg: 18.0
          tangent_at_max_distance: 0.0
          tangent_at_min_distance: 0.5
          target: { x: 0.0, y: 0.0, z: 0.0 }
          yaw_deg: 0.0
        - type: PlanetCameraFit
          max_distance_scale: 1.65
          near_clip_ratio: 2.0e-04
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 4.0e+01 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.9, g: 0.97, r: 1.0 }
          direction: { x: 0.35, y: 0.78, z: -0.52 }
          intensity: 1.35
          shadow_intensity: 0.75
      children: []
