scene:
  scene_name: planet_demo
  settings:
    render:
      ambient_intensity: 0.25
      auto_exposure_enabled: false
      cloud_density: 1.0
      cloud_quality: high
      cloud_type: volumetric
      cloud_wind_speed: 4.0
      clouds: true
      fog_density: 0.0
      shadow_distance: 7.0e+02
      shadow_softness: 0.35
      sky_ground: [0.008, 0.01, 0.015]
      sky_horizon: [0.008, 0.01, 0.015]
      sky_model: space
      sky_zenith: [0.008, 0.01, 0.015]
      tilt_shift_enabled: true
      volumetrics_max_distance: 1.0e+03
  root_objects:
    - name: planet
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Terrain
          chunk_size: 32
          collision: false
          face_tiles: 192
          gravity: 0.0
          height_step: 1.0
          kind_tile_sets: { rock: objects/terrain/tileset_rock, stone: objects/terrain/tileset_rock }
          max_wall_steps: 8
          mode: tiles
          planet: true
          soil_depth_steps: 1
          tile_set: objects/terrain/tileset_soft
          tile_size: 1.0
          # screen_size is the fraction of screen HEIGHT below which a tier is drawn, so a bigger
          # number engages that tier CLOSER to the camera. A 32-tile chunk's bounds radius is ~25,
          # and screen_height_fraction is radius * proj[1][1] / depth, so at this scene's 50 degree
          # fov a tier at `s` takes over past a depth of ~53.6 / s. The previous 0.2 / 0.12 / 0.085
          # put those at 268 / 447 / 630 units -- but the orbit rig only reaches 700 from the
          # planet's CENTRE and the surface is at r~147, so nothing on screen was ever far enough
          # to reach them: a capture at orbit 300 came back pixel-identical to TOY_TERRAIN_NO_LODS.
          # These put the handovers at ~119 / 244 / 536, which the rig actually spans. Standing on
          # the surface the horizon is only ~60-110 away, so the near world still draws at LOD 0.
          # `smooth:` averages a level's normals across the faces meeting at each position, so its
          # flat quads shade as a rounded slope rather than a staircase (geometry is untouched).
          # Left off on the first level, which is seen closest and where the blocks really are the
          # terrain's shape; on from the second, where a step is a few pixels and reads as noise.
          lods:
            - { field: 1, native_border: 1, screen_size: 0.45 }
            - { field: 4, native_border: 1, screen_size: 0.22, smooth: true }
            - { field: 16, screen_size: 0.1, smooth: true }
        - type: MapGenerator
          generator:
            grid_size: 40
            image_size: 2400
            sea_level: 0.45
            seed: 315546511
            shape: { shape: archipelago }
          height_scale: 56.0
          river_inset: 0.2
          sphere: true
          water_inset: 0.5
          world_tiles: 160
      children:
        - name: atmosphere
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 1.0, y: 1.0, z: 1.0 }
            - type: Volume
              color: { b: 1.0, g: 0.55, r: 0.35 }
              density: 0.0012
              falloff: 0.75
              kind: fog
              occlusion: 0.55
              shape: shell
              sun_amount: 0.9
            - type: PlanetAtmosphere
              day_sky_altitude_scale: 1.5
              moon_intensity: 0.045
              night_sky_color: { b: 0.14, g: 0.07, r: 0.045 }
              scale_height_fraction: 0.22
              thickness_scale: 2.8
          children: []
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -399.44, z: 129.79 }
          rotation: { x: 72.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          far_clip_plane: 2.5e+03
          fov: 5.0e+01
          main: true
          near_clip_plane: 1.0
          projection: Perspective
        - type: CameraController
          capture_cursor: false
          collide: false
          distance: 7.0e+02
          key_orbit_speed_deg_per_sec: 6.0e+01
          look_button: right
          max_distance: 7.0e+02
          max_pitch_deg: 85.0
          min_distance: 165.0
          min_pitch_deg: -85.0
          mode: orbit
          mouse_sensitivity: 0.15
          movement_smoothing: 0.25
          pitch_at_max_distance_deg: 7.0e+01
          pitch_at_min_distance_deg: 8.0
          pitch_deg: 18.0
          tangent_at_max_distance: 0.0
          tangent_at_min_distance: 0.5
          target: { x: 0.0, y: 0.0, z: 0.0 }
          yaw_deg: 0.0
          zoom_speed: 2.0e+01
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 4.0e+01 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.9, g: 0.97, r: 1.0 }
          direction: { x: 0.35, y: 0.78, z: -0.52 }
          intensity: 1.35
          shadow_intensity: 0.75
      children: []
