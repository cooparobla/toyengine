              base_altitude_scale: 1.02
              day_sky_altitude_scale: 0.0
              min_thickness: 5.0
              scale_height_fraction: 0.6
              thickness_scale: 0.09
          children: []
        - name: atmosphere
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 1.0, y: 1.0, z: 1.0 }
            - type: Volume
              color: { b: 1.0, g: 0.55, r: 0.35 }
              density: 0.0035
              falloff: 0.75
              kind: fog
              occlusion: 0.55
              shape: shell
              sun_amount: 0.9
            - type: PlanetAtmosphere
              day_sky_altitude_scale: 1.5
              scale_height_fraction: 0.22
              thickness_scale: 2.8
          children: []
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -399.44, z: 129.79 }
          rotation: { x: 72.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          far_clip_plane: 2.5e+03
          fov: 5.0e+01
          main: true
          near_clip_plane: 1.0
          projection: Perspective
        - type: CameraController
          capture_cursor: false
          collide: false
          distance: 7.0e+02
          key_orbit_speed_deg_per_sec: 6.0e+01
          look_button: right
          max_distance: 7.0e+02
          max_pitch_deg: 85.0
          min_distance: 165.0
          min_pitch_deg: -85.0
          mode: orbit
          mouse_sensitivity: 0.15
          movement_smoothing: 0.25
          pitch_at_max_distance_deg: 7.0e+01
          pitch_at_min_distance_deg: 8.0
          pitch_deg: 18.0
          tangent_at_max_distance: 0.0
          tangent_at_min_distance: 0.5
          target: { x: 0.0, y: 0.0, z: 0.0 }
          yaw_deg: 0.0
          zoom_speed: 2.0e+01
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 4.0e+01 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.9, g: 0.97, r: 1.0 }
          direction: { x: 0.35, y: 0.78, z: -0.52 }
          intensity: 1.35
          shadow_intensity: 0.75
      children: []
