scene:
  scene_name: planet_demo
  settings:
    render:
      ambient_intensity: 0.25
      auto_exposure_enabled: false
      fog_density: 0.0
      shadow_distance: 7.0e+02
      shadow_softness: 0.35
      sky_ground: [0.008, 0.01, 0.015]
      sky_horizon: [0.008, 0.01, 0.015]
      sky_model: space
      sky_zenith: [0.008, 0.01, 0.015]
      tilt_shift_enabled: true
      volumetrics_max_distance: 1.0e+03
  root_objects:
    - name: planet
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Terrain
          chunk_size: 32
          collision: false
          face_tiles: 192
          gravity: 0.0
          height_step: 1.0
          kind_tile_sets: { rock: objects/terrain/tileset_rock, stone: objects/terrain/tileset_rock }
          max_wall_steps: 8
          mode: tiles
          planet: true
          soil_depth_steps: 1
          tile_set: objects/terrain/tileset_soft
          tile_size: 1.0
          lods:
            - { field: 1, native_border: 1, screen_size: 0.2 }
            - { field: 4, native_border: 1, screen_size: 0.12 }
            - { field: 16, screen_size: 0.085 }
        - type: MapGenerator
          generator:
            grid_size: 40
            image_size: 2400
            sea_level: 0.45
            seed: 315546511
            shape: { shape: archipelago }
          height_scale: 56.0
          river_inset: 0.2
          sphere: true
          water_inset: 0.5
          world_tiles: 160
      children:
        - name: clouds
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 0.0 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 1.0, y: 1.0, z: 1.0 }
            - type: Volume
              color: { b: 1.0, g: 1.0, r: 1.0 }
              coverage: 0.68
              density: 0.16
              direction: { x: 1.0, y: 0.25, z: 0.0 }
              falloff: 0.0
              flow_scale: 0.015
              flow_warp: 9.0
              gate_scale: 0.0
              kind: haze
              noise_scale: 0.14
              occlusion: 0.9
              octaves: 4
              shape: shell
              speed: 1.2
              streak: 1.6
              sun_amount: 0.45
