scene:
  scene_name: terrain_demo
  settings:
    render:
      shadow_distance: 1.0e+02
      shadow_fit: focus
      shadow_focus_radius: 16.0
      shadow_pcf_max_texels: 32.0
      shadow_receiver_plane_bias: true
      shadow_softness: 0.35
  root_objects:
    - name: terrain
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: TileTerrain
          chunk_size: 32
          collision: true
          height_scale: 16.0
          height_step: 1.0
          kind_tile_sets:
            ash: objects/terrain/tileset_soft
            rock: objects/terrain/tileset_rock
            salt: objects/terrain/tileset_soft
            sand: objects/terrain/tileset_soft
            snow: objects/terrain/tileset_soft
            stone: objects/terrain/tileset_rock
          material:
            albedo: { b: 1.0, g: 1.0, r: 1.0 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.9
            texture_albedo: textures/terrain_atlas.png
            texture_metallic_roughness: textures/terrain_atlas_mr.png
          max_chunk_jobs_per_frame: 4
          max_wall_steps: 8
          river_inset: 0.2
          soil_depth_steps: 1
          tile_set: objects/terrain/tileset_soft
          tile_size: 1.0
          tiles_per_grid_unit: 4
          view_radius: 10
          water_inset: 0.5
          world_tiles: 320
      children: []
    - name: focus_marker
      active: true
      components:
        - type: Transform
          position: { x: 106.0, y: 178.0, z: 8.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - { type: FreeMover, move_speed: 18.0, smoothing: 12.0 }
      children: []
    - name: drop_crate
      active: true
      components:
        - type: Transform
          position: { x: 104.0, y: 179.0, z: 16.0 }
          rotation: { x: 1.0e+01, y: 2.0e+01, z: 3.0e+01 }
          scale: { x: 1.2, y: 1.2, z: 1.2 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.24, g: 0.42, r: 0.62 }
            metallic: 0.0
            roughness: 0.8
          mesh_path: cube
        - type: BoxCollider
          material: wood
          size: { x: 1.0, y: 1.0, z: 1.0 }
        - { type: Rigidbody, mass: 4.0e+01 }
      children: []
    - name: drop_ball_red
      active: true
      components:
        - type: Transform
          position: { x: 108.0, y: 177.0, z: 18.0 }
          scale: { x: 0.6, y: 0.6, z: 0.6 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.15, g: 0.2, r: 0.85 }
            metallic: 0.0
            roughness: 0.5
          mesh_path: sphere_low
        - { type: SphereCollider, material: rubber, radius: 1.0 }
        - { type: Rigidbody, mass: 1.0e+01 }
      children: []
    - name: drop_ball_blue
      active: true
      components:
        - type: Transform
          position: { x: 106.5, y: 182.0, z: 2.0e+01 }
          scale: { x: 0.5, y: 0.5, z: 0.5 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.85, g: 0.35, r: 0.2 }
            metallic: 0.0
            roughness: 0.5
          mesh_path: sphere_low
        - { type: SphereCollider, material: rubber, radius: 1.0 }
        - { type: Rigidbody, mass: 8.0 }
      children: []
    - name: drop_float_crate
      active: true
      components:
        - type: Transform
          position: { x: 95.0, y: 178.0, z: 6.0 }
          rotation: { x: 0.0, y: 0.0, z: 2.0e+01 }
          scale: { x: 1.2, y: 1.2, z: 1.2 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.24, g: 0.42, r: 0.62 }
            metallic: 0.0
            roughness: 0.8
          mesh_path: cube
        - type: BoxCollider
          material: wood
          size: { x: 1.0, y: 1.0, z: 1.0 }
        - { type: Rigidbody, mass: 4.0e+01 }
        - { type: Buoyancy }
      children: []
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 106.0, y: 148.0, z: 38.0 }
          rotation: { x: 48.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          aperture: 11.0
          far_clip_plane: 1.0e+03
          focus_object: focus_marker
          fov: 6.0e+01
          lens: 5.0e+01
          main: true
          near_clip_plane: 0.3
          projection: Perspective
        - type: CameraController
          capture_cursor: true
          collide: false
          distance: 42.0
          follow_smoothing: 8.0
          max_distance: 1.2e+02
          max_pitch_deg: 85.0
          min_distance: 6.0
          min_pitch_deg: 2.0
          mode: orbit
          mouse_sensitivity: 0.12
          movement_smoothing: 0.25
          pitch_deg: 42.0
          tracker: focus_marker
          yaw_deg: 0.0
          zoom_speed: 2.0
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 4.0e+01 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.9, g: 0.97, r: 1.0 }
          direction: { x: -0.5, y: -0.45, z: -0.74 }
          intensity: 1.35
          shadow_intensity: 0.75
      children: []
    - name: sky
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: EnvironmentLight
          ground_color: { b: 0.17, g: 0.22, r: 0.24 }
          sky_color: { b: 0.94, g: 0.7, r: 0.52 }
          sky_intensity: 1.15
      children: []
