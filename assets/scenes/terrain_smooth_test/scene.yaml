# Styled, smooth tile terrain -- the Animal Crossing read -- from the same streamed tile system
# as terrain_test.
#
# Run it with `cplay terrain_smooth_test`. Same world machinery and the same steering rig as
# terrain_test (WASD moves `focus_marker`, Tab/Shift lift and drop it, the camera orbits and
# focuses on it); what differs is how a column is SHAPED. terrain_test stamps one flat quad per
# exposed side -- a voxel grid, and the A/B reference for this scene. Here the `styles:` key
# switches every chunk to the styled mesher (toyengine/world/tile_topology.h): each tile is
# assembled from authored pieces chosen by its neighbourhood -- rounded lips only on exposed
# edges, quarter-rounds at outer corners, fillets at inner ones -- and each column is shaped by
# its surface kind's style, lip to base: grass and dirt round, sand and snow softer still, stone
# and rock chunky and chamfered. Soil and stone bands down a cliff are texture, not shape.
#
# The pieces are shared assets (assets/meshes/tile_<style>_<piece>.yaml, written by
# tools/gen_tile_styles.py), resolved like terrain_test's side meshes: a meshes/ beside this file
# with a same-named piece overrides the shared one.
#
# See toyengine/world/README.md for the piece vocabulary and the authoring contract.
format: blender
scene:
  scene_name: terrain_smooth_test
  # Shadow tuning for a world viewed from 40-100 m away. The config.yaml defaults slice the
  # camera frustum from the lens outward, which suits a diorama seen from ~12 m; from an orbit
  # 40+ m out it spends the finest cascades on empty air and leaves the player's area in the
  # coarsest one. "focus" instead nests the cascades around the point the camera looks at (its
  # focus_object), and the receiver-plane bias keeps small casters' shadows at full size under
  # a wide penumbra.
  #
  # Softness and AO are in WORLD units, and this camera sits ~4x farther out than pixel_demo's,
  # so the same metres read ~4x smaller on screen. The penumbra is widened to 0.35 m to read
  # soft from here -- not 4x (0.6+ m): that is wider than a 1 m terrace's own shadow, which
  # then never reaches full darkness and washes out. The finest cascade widens to 16 m so that
  # blur fits under the PCF ceiling (~1.7 cm texels -> ~21 texels). (ssao_quality: ultra would
  # widen AO's on-screen reach too, but costs ~1.6 ms here for no visible gain.)
  settings:
    render:
      shadow_fit: focus
      shadow_focus_radius: 16.0         # the finest cascade: 16 m around the focus point
      shadow_distance: 100.0            # the coarsest: 100 m around it
      shadow_softness: 0.35             # world-unit penumbra: soft at 42 m, still under a step's shadow
      shadow_pcf_max_texels: 32.0       # let the finest cascade actually reach that width
      shadow_receiver_plane_bias: true  # wide penumbra without the matching normal offset
  root_objects:
    - name: terrain
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Terrain
          # --- The world: one round island rather than a canvas-filling rectangle ---
          # Not an archipelago: mapcoopa rank-normalises moisture across ocean and land alike,
          # so a map that is mostly sea leaves all its land at the dry end -- desert. A circle
          # inscribed in the canvas keeps a little over half of it land, and green.
          seed: 251
          grid_size: 64            # 64 * 4 = 256 tiles square
          shape: circle
          irregularity: 0.42
          coast_detail: 0.18
          sea_level: 0.28
          terrain_roughness: 0.0   # ACNH plateaus are smooth; roughness would speckle them
          river_count: 20

          # --- Terracing: a few tall steps, not forty short ones ---
          tiles_per_grid_unit: 4
          tile_size: 1.0
          height_step: 1.0         # cubic cells: the pieces' authored proportions, unstretched
          height_scale: 10.0       # ~7 terraces from the beach to the highest plateau
          chunk_size: 32
          view_radius: 2           # 5 x 5 live chunks: styled edges cost more than flat quads
          max_wall_steps: 8
          soil_depth_steps: 1      # one band of soil under the turf, stone below
          max_chunk_jobs_per_frame: 4

          # --- Styled tiles ---
          # Each style names a tile-set object: its children are the pieces (see assets/objects/
          # tileset_*.yaml -- open one in the editor to see them all; duplicate it for a new look).
          styles:
            round: objects/tileset_round
            soft: objects/tileset_soft
            rock: objects/tileset_rock
            flat: objects/tileset_flat
          # The style each surface kind is shaped with -- the column's top kind shapes the whole
          # column, cliff included.
          kind_styles:
            default: round
            grass: round
            dirt: round
            moss: round
            clay: round
            sand: soft
            snow: soft
            ash: soft
            salt: soft
            stone: rock
            rock: rock
            water: flat
            ice: flat

          material:
            albedo: { r: 1.0, g: 1.0, b: 1.0 }
            metallic: 0.0
            roughness: 0.9
            ao: 1.0
            texture_albedo: textures/terrain_atlas_smooth.png
            texture_metallic_roughness: textures/terrain_atlas_smooth_mr.png
      children: []

    - name: focus_marker
      active: true
      components:
        - type: Transform
          position: { x: 128.0, y: 128.0, z: 10.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: FreeMover
          move_speed: 18.0
          smoothing: 12.0
      children: []

    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 128.0, y: 98.0, z: 38.0 }
          rotation: { x: 48.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 60.0
          near_clip_plane: 0.3
          far_clip_plane: 1000.0
          focus_object: focus_marker
          lens: 50.0
          aperture: 11.0           # deep focus: the terrain detail should read sharp, not as bokeh
        - type: CameraController
          mode: orbit
          tracker: focus_marker
          distance: 42.0
          yaw_deg: 0.0
          pitch_deg: 42.0           # ACNH's high three-quarter view
          follow_smoothing: 8.0
          movement_smoothing: 0.25
          mouse_sensitivity: 0.12
          zoom_speed: 2.0
          min_distance: 6.0
          max_distance: 120.0
          min_pitch_deg: 2.0
          max_pitch_deg: 85.0
          capture_cursor: true
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 40.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        # High-key and lower than overhead, so terrace steps cast shadows long enough to read.
        - type: DirectionalLight
          direction: { x: -0.50, y: -0.45, z: -0.74 }   # ~48 deg up: a 1 m step casts ~0.9 m
          color: { r: 1.0, g: 0.97, b: 0.90 }
          intensity: 1.35
          cast_shadows: true
          shadow_intensity: 0.75                         # lighter than 0.85: soft, not inky
      children: []

    - name: sky
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: EnvironmentLight
          sky_color: { r: 0.52, g: 0.70, b: 0.94 }
          ground_color: { r: 0.24, g: 0.22, b: 0.17 }
          sky_intensity: 1.15
      children: []
