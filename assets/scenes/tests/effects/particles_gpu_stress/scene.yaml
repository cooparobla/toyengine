# particles_gpu_stress -- PROFILE comparison of `simulation: gpu` against the CPU path:
# three 60k-spark fountains (additive, unsorted) and a 40k blended dust field (bitonic-sorted),
# ~220k live particles. The same scene with particles.gpu_enabled: false runs every system on
# the CPU, so:
#
#   HEADLESS=1 PROFILE=1 MAX_FRAMES=600 FIXED_DT=0.016666667 SCENE=particles_gpu_stress ./build/toyengine
#   (and again with a config whose particles.gpu_enabled is false)
#
# and compare the CPU `Particles` / GPU `ParticlesSim` + `Transparent` scopes in the summary.
format: blender
scene:
  scene_name: particles_gpu_stress
  settings:
    render:
      sky_zenith:  [0.03, 0.05, 0.12]
      sky_horizon: [0.25, 0.16, 0.12]
      ambient_intensity: 0.8
      auto_exposure_compensation: 0.75
      auto_exposure_max: 1.6
  root_objects:
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -16.0, z: 5.0 }
          rotation: { x: 78.0, y: 0.0, z: 0.0 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 55.0
          near_clip_plane: 0.1
          far_clip_plane: 300.0
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
        - type: DirectionalLight
          direction: { x: -0.6, y: 0.4, z: -0.4 }
          color: { r: 1.0, g: 0.7, b: 0.5 }
          intensity: 0.5
          cast_shadows: true
      children: []
    - name: ground
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 40.0, y: 40.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: plane
          material: { albedo: { r: 0.18, g: 0.18, b: 0.17 }, roughness: 0.95, metallic: 0.0 }
      children: []
    - name: sparks_0
      active: true
      components:
        - type: Transform
          position: { x: -5.0, y: 0.0, z: 0.05 }
        - type: ParticleSystem
          simulation: gpu
          max_particles: 60000
          shape: cone
          radius: 0.08
          angle: 14
          rate: 20000
          start_lifetime: [2.4, 3.0]
          start_speed: [5.0, 6.8]
          start_size: [0.018, 0.03]
          start_color: {r: 1.0, g: 0.5, b: 0.15, a: 0.25}
          start_color_b: {r: 1.0, g: 0.75, b: 0.35, a: 0.25}
          color_over_life: [{t: 0.0, color: {r: 1.0, g: 1.0, b: 1.0, a: 1.0}}, {t: 1.0, color: {r: 0.8, g: 0.25, b: 0.05, a: 1.0}}]
          alpha_over_life: [{t: 0.0, value: 1.0}, {t: 0.8, value: 0.8}, {t: 1.0, value: 0.0}]
          gravity: 1.0
          drag: 0.15
          noise_strength: 0.8
          noise_frequency: 0.6
          collide: true
          ground_height: 0.02
          bounce: 0.35
          collision_friction: 0.3
          render_mode: stretched
          sprite: spark
          stretch_speed: 0.02
          emissive: 0.7
          additive: 1.0
          softness: 0.3
          sort: none
      children: []
    - name: sparks_1
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.05 }
        - type: ParticleSystem
          simulation: gpu
          max_particles: 60000
          shape: cone
          radius: 0.08
          angle: 14
          rate: 20000
          start_lifetime: [2.4, 3.0]
          start_speed: [5.0, 6.8]
          start_size: [0.018, 0.03]
          start_color: {r: 1.0, g: 0.5, b: 0.15, a: 0.25}
          start_color_b: {r: 1.0, g: 0.75, b: 0.35, a: 0.25}
          color_over_life: [{t: 0.0, color: {r: 1.0, g: 1.0, b: 1.0, a: 1.0}}, {t: 1.0, color: {r: 0.8, g: 0.25, b: 0.05, a: 1.0}}]
          alpha_over_life: [{t: 0.0, value: 1.0}, {t: 0.8, value: 0.8}, {t: 1.0, value: 0.0}]
          gravity: 1.0
          drag: 0.15
          noise_strength: 0.8
          noise_frequency: 0.6
          collide: true
          ground_height: 0.02
          bounce: 0.35
          collision_friction: 0.3
          render_mode: stretched
          sprite: spark
          stretch_speed: 0.02
          emissive: 0.7
          additive: 1.0
          softness: 0.3
          sort: none
      children: []
    - name: sparks_2
      active: true
      components:
        - type: Transform
          position: { x: 5.0, y: 0.0, z: 0.05 }
        - type: ParticleSystem
          simulation: gpu
          max_particles: 60000
          shape: cone
          radius: 0.08
          angle: 14
          rate: 20000
          start_lifetime: [2.4, 3.0]
          start_speed: [5.0, 6.8]
          start_size: [0.018, 0.03]
          start_color: {r: 1.0, g: 0.5, b: 0.15, a: 0.25}
          start_color_b: {r: 1.0, g: 0.75, b: 0.35, a: 0.25}
          color_over_life: [{t: 0.0, color: {r: 1.0, g: 1.0, b: 1.0, a: 1.0}}, {t: 1.0, color: {r: 0.8, g: 0.25, b: 0.05, a: 1.0}}]
          alpha_over_life: [{t: 0.0, value: 1.0}, {t: 0.8, value: 0.8}, {t: 1.0, value: 0.0}]
          gravity: 1.0
          drag: 0.15
          noise_strength: 0.8
          noise_frequency: 0.6
          collide: true
          ground_height: 0.02
          bounce: 0.35
          collision_friction: 0.3
          render_mode: stretched
          sprite: spark
          stretch_speed: 0.02
          emissive: 0.7
          additive: 1.0
          softness: 0.3
          sort: none
      children: []
    - name: dust
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 2.0, z: 1.5 }
        - type: ParticleSystem
          simulation: gpu
          max_particles: 40000
          shape: box
          box: [20.0, 14.0, 3.0]
          rate: 6000
          start_lifetime: [5.0, 7.0]
          start_speed: 0.05
          start_size: [0.02, 0.04]
          start_color: {r: 0.95, g: 0.85, b: 0.7, a: 0.2}
          alpha_over_life: [{t: 0.0, value: 0.0}, {t: 0.2, value: 1.0}, {t: 0.8, value: 1.0}, {t: 1.0, value: 0.0}]
          noise_strength: 0.25
          noise_frequency: 0.35
          render_mode: billboard
          sprite: soft
          lit: 0.8
          sort: distance
      children: []
