format: blender
scene:
  scene_name: snow_test
  settings:
    weather:
      condition: snow
      day_length_minutes: 0
      enabled: true
      ground_height: 0.0
      schedule: fixed
      snow_accumulate_time: 120
      snow_auto_deformers: true
      snow_max_depth: 0.3
      snow_patch_style: hard
      snow_trench_recover_time: 3.0
      time_of_day: 11.0
  root_objects:
    - name: snowfield
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 14.0, y: 14.0, z: 1.0 }
        - type: MeshRenderer
          material:
            albedo: { b: 0.16, g: 0.24, r: 0.32 }
            ao: 1.0
            metallic: 0.0
            roughness: 0.95
            shader: snow
          mesh_path: snow_ground
          tess_edge_pixels: 5
          tess_max_distance: 40
          tess_max_factor: 32
          tessellation: true
        - type: BoxCollider
          center: { x: 0.0, y: 0.0, z: -0.1 }
          size: { x: 2.0, y: 2.0, z: 0.2 }
        - { type: WeatherSurface, splashes: true }
      children: []
    - name: shelter
      active: true
      components:
        - type: Transform
          position: { x: 4.0, y: 3.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
      children:
        - name: roof
          active: true
          components:
            - type: Transform
              position: { x: 0.0, y: 0.0, z: 2.4 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 2.0, y: 1.6, z: 0.1 }
            - { type: MeshRenderer, material: materials/wood, mesh_path: cube }
            - type: BoxCollider
              size: { x: 1.0, y: 1.0, z: 1.0 }
          children: []
        - name: post_a
          active: true
          components:
            - type: Transform
              position: { x: -0.9, y: -0.7, z: 1.2 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 0.12, y: 0.12, z: 2.4 }
            - { type: MeshRenderer, material: materials/wood, mesh_path: cube }
          children: []
        - name: post_b
          active: true
          components:
            - type: Transform
              position: { x: 0.9, y: -0.7, z: 1.2 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 0.12, y: 0.12, z: 2.4 }
            - { type: MeshRenderer, material: materials/wood, mesh_path: cube }
          children: []
        - name: post_c
          active: true
          components:
            - type: Transform
              position: { x: -0.9, y: 0.7, z: 1.2 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 0.12, y: 0.12, z: 2.4 }
            - { type: MeshRenderer, material: materials/wood, mesh_path: cube }
          children: []
        - name: post_d
          active: true
          components:
            - type: Transform
              position: { x: 0.9, y: 0.7, z: 1.2 }
              rotation: { x: 0.0, y: 0.0, z: 0.0 }
              scale: { x: 0.12, y: 0.12, z: 2.4 }
            - { type: MeshRenderer, material: materials/wood, mesh_path: cube }
          children: []
    - name: crate
      active: true
      components:
        - type: Transform
          position: { x: -4.0, y: 3.5, z: 0.5 }
          rotation: { x: 0.0, y: 0.0, z: 2.0e+01 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - { type: MeshRenderer, material: materials/wood_crate, mesh_path: cube }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []
    - name: crate_bare
      active: true
      components:
        - type: Transform
          position: { x: -2.2, y: 4.0, z: 0.5 }
          rotation: { x: 0.0, y: 0.0, z: -15.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          material: { base: materials/wood_crate, snow: false }
          mesh_path: cube
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []
    - name: sled
      active: true
      components:
        - type: Transform
          position: { x: 0.5, y: -2.0, z: 0.25 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.5, y: 0.9, z: 0.5 }
        - { type: MeshRenderer, material: materials/copper, mesh_path: cube }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
        - { type: Rigidbody, is_kinematic: true, mass: 3.0e+01, use_gravity: false }
        - type: KinematicMover
          mode: orbit
          orbit_center: { x: -2.0, y: -2.0, z: 0.25 }
          orbit_radius: 2.5
          speed: 4.0e+01
        - { type: SnowDeformer, depth: -1, falloff: 0.4, radius: 0.35 }
      children: []
    - name: ball
      active: true
      components:
        - type: Transform
          position: { x: 2.5, y: -2.5, z: 2.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.5, y: 0.5, z: 0.5 }
        - { type: MeshRenderer, material: materials/plastic, mesh_path: sphere }
        - { type: SphereCollider, radius: 1.0 }
        - { type: Rigidbody, mass: 5.0 }
      children: []
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -11.0, z: 5.5 }
          rotation: { x: 66.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          far_clip_plane: 3.0e+02
          fov: 55.0
          main: true
          near_clip_plane: 0.1
          projection: Perspective
        - type: CameraController
          max_distance: 4.0e+01
          min_distance: 2.0
          mode: orbit
          target: { x: 0.0, y: 0.5, z: 0.0 }
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 2.0e+01 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          cast_shadows: true
          color: { b: 0.9, g: 0.96, r: 1.0 }
          direction: { x: -0.4, y: 0.35, z: -0.85 }
          intensity: 1.0
      children: []
