# character_test -- the CharacterController bench: a mannequin player with a third-person
# camera, and one station per character-motor feature.
# GENERATED by tools/gen_character_test_scene.py; edit that, not this file.
#
# Run: ./build/toyengine character_test        (or SCENE=character_test)
# Controls: WASD move (camera-relative), Space jump, LeftShift sprint, mouse orbits the camera,
# scroll zooms. The camera pulls in when a wall blocks the view of the player.
#
# Map (the player starts at the origin facing +Y; stations ahead of it):
#   x = -10  stairs         8 steps of 0.25 m (under step_height 0.35: walked up), to a deck
#   x =  -6  tall step      one 0.5 m block (over step_height: blocked; jump onto it)
#   x =  -2  walkable ramp  25 degrees, to a deck
#   x =   2  steep ramp     55 degrees (over slope_limit 45: a wall; you slide off it)
#   x =   6  moving deck    0.3 m kinematic platform, ping-ponging along Y: step on, ride
#   x =  10  crates         dynamic boxes the player pushes
#   x = -14  low ceiling    a roof at 2.3 m: jumping under it bumps the head
#   y =  16  terrain        a bumpy MeshCollider heightfield patch (walk over it)
#   y = -10  camera wall    a wall behind the start camera: walk back toward it and the camera pulls in
#   x =  -3  foot IK        an idle mannequin with one foot on a 0.2 m block: FootIK plants both feet
#   y =  -4  coins          five spinning coins to pick up (SaveDemo)
#
# Save / load (toyengine/save/): F5 quick-saves, F9 quick-loads. The save holds the player's pose
# (its SaveId + CharacterController, an ISaveable), the collected coins and the weather clock
# (SaveDemo's on_save / on_load hooks). The clock runs a 6-minute day so a load visibly rewinds it.
#
# The player moves by ROOT MOTION: the walk / run clips' pelvis travel (Animator apply_root_motion
# -> CharacterController use_root_motion), so its speed is the clip's (walk ~1.6 m/s, sprint to run
# ~5.3 m/s); input steers. FootIK keeps its feet on stairs and slopes while grounded, and the walk /
# run clips fire `footstep` events (scene EventBus "anim_event").
format: blender
scene:
  scene_name: character_test
  settings:
    # The weather clock the save demo stores (clear sky; a 6-minute day).
    weather:
      enabled: true
      time_of_day: 10.0
      day_length_minutes: 6
      drive_sun: true
      condition: clear
      schedule: fixed
  root_objects:
    # Ground: a 60 x 60 m slab, its top at z = 0.
    - name: ground
      components:
        - type: Transform
          position: { x: 0, y: 0, z: -0.25 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 60, y: 60, z: 0.5 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.55, g: 0.57, b: 0.6 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    # The player: the mannequin prefab plus a CharacterController (it adds its own kinematic
    # Rigidbody + CapsuleCollider) and the demo CharacterAnimDriver (idle/walk/run/jump). It
    # moves by root motion (the Animator override + use_root_motion) and plants its feet (FootIK).
    - name: player
      prefab: objects/mannequin
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: CharacterController
          radius: 0.3
          height: 1.8
          step_height: 0.35
          slope_limit: 45.0
          move_speed: 3.0
          sprint_multiplier: 2.0
          jump_height: 1.2
          use_root_motion: true
        - type: Animator
          apply_root_motion: true
        - type: CharacterAnimDriver
          walk_speed: 0.2
          run_speed: 4.0
          crossfade: 0.2
        - type: FootIK
          ray_up: 0.45
          ray_down: 0.4
        # Saves the CharacterController's pose (an ISaveable) under objects/player.
        - type: SaveId
          id: player

    # Save demo (F5 save / F9 load): SaveDemo picks up the coin_* objects and keeps the
    # collected set and the weather clock in the save's global section.
    - name: save_demo
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: SaveDemo
          coin_prefix: coin_
          pickup_radius: 1.0
      children: []

    - name: coin_1
      components:
        - type: Transform
          position: { x: -6, y: -4, z: 0.9 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 0.5, y: 0.12, z: 0.5 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 1.0, g: 0.78, b: 0.2 }, metallic: 1.0, roughness: 0.3 }
        - type: KinematicMover
          mode: spin
          spin_axis: { x: 0, y: 0, z: 1 }
          spin_speed: 120.0
      children: []

    - name: coin_2
