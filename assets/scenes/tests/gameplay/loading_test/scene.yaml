# loading_test (hub) -- async scene loading and SceneLink transitions.
# GENERATED by tools/gen_loading_test_scene.py; edit that, not this file.
#
# Run: ./build/toyengine loading_test
# Walk (WASD) through the NORTH door (blue, y = 8): heavy.yaml loads in the background behind the
# loading screen (ui/loading_screen: a progress bar and a status line). Through the EAST door
# (orange, x = 8) it loads behind a plain fade. Either way this scene keeps running until the
# heavy one is built and its assets are in; heavy.yaml's door brings you back here.
format: blender
scene:
  scene_name: loading_test
  root_objects:
    - name: ground
      components:
        - type: Transform
          position: { x: 0, y: 0, z: -0.25 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 40, y: 40, z: 0.5 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.55, g: 0.57, b: 0.6 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
    # The player: the mannequin prefab with a CharacterController (WASD, Space, LeftShift).
    - name: player
      prefab: objects/mannequin
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: CharacterController
          radius: 0.3
          height: 1.8
          move_speed: 4.0
