        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.55, g: 0.6, b: 0.7 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    # Tumblers: limp from the first frame, shoved down the stairs.
    - name: tumbler_1
      prefab: objects/mannequin_ragdoll
      components:
        - type: Transform
          position: { x: -1.8, y: -4.6, z: 2.4 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Ragdoll
          mode: ragdoll
          start_impulse: { x: -30, y: 280, z: 140 }

    - name: tumbler_2
      prefab: objects/mannequin_ragdoll
      components:
        - type: Transform
          position: { x: 0, y: -4.6, z: 2.4 }
          rotation: { x: 0, y: 0, z: 180 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Ragdoll
          mode: ragdoll
          start_impulse: { x: 0, y: 320, z: 140 }

    - name: tumbler_3
      prefab: objects/mannequin_ragdoll
      components:
        - type: Transform
          position: { x: 1.8, y: -4.6, z: 2.4 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Ragdoll
          mode: ragdoll
          start_impulse: { x: 30, y: 360, z: 140 }

    # The ram: a kinematic block ping-ponging along X across the landing at the stairs' foot.
    - name: ram
      components:
        - type: Transform
          position: { x: 0, y: 2, z: 0.45 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 0.8, y: 3, z: 0.9 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.85, g: 0.3, b: 0.15 }, roughness: 0.5 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Rigidbody
          is_kinematic: true
          use_gravity: false
        - type: KinematicMover
          mode: pingpong
          axis: { x: 1, y: 0, z: 0 }
          distance: 7.0
          speed: 0.1
      children: []

    # The player: R toggles its Ragdoll (linked to the CharacterController).
    - name: player
      prefab: objects/mannequin_ragdoll
      components:
        - type: Transform
          position: { x: 7, y: 1, z: 0 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: CharacterController
          radius: 0.3
          height: 1.8
          move_speed: 3.0
        - type: CharacterAnimDriver
          crossfade: 0.2
        - type: Ragdoll
          input_toggle: true
          toggle_impulse: { x: 0, y: -60, z: 20 }
          blend_time: 0.6

    - name: camera
      components:
        - type: Transform
          position: { x: 7, y: 11, z: 6.5 }
          rotation: { x: 66, y: 0, z: 150 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 55.0
          near_clip_plane: 0.1
          far_clip_plane: 300.0
        - type: CameraController
          mode: orbit
          target: { x: 0, y: 1, z: 0.8 }
          min_distance: 3.0
          max_distance: 40.0
      children: []

    - name: sun
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 20 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: DirectionalLight
          direction: { x: -0.45, y: 0.3, z: -0.84 }
          color: { r: 1.0, g: 0.96, b: 0.9 }
          intensity: 1.0
          cast_shadows: true
      children: []
