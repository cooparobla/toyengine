        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: step_3
      components:
        - type: Transform
          position: { x: 0, y: -2.625, z: 0.75 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 6, y: 0.55, z: 1.5 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.55, g: 0.6, b: 0.7 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: step_4
      components:
        - type: Transform
          position: { x: 0, y: -2.075, z: 0.6 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 6, y: 0.55, z: 1.2 }
        - type: MeshRenderer
          mesh_path: cube
          material: { base: materials/prototype_grid, albedo: { r: 0.55, g: 0.6, b: 0.7 } }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: step_5
      components:
        - type: Transform
          position: { x: 0, y: -1.525, z: 0.45 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 6, y: 0.55, z: 0.9 }
        - type: MeshRenderer
