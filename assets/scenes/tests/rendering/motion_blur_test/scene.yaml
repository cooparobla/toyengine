# motion_blur_test -- velocity-buffer motion blur (render `motion_blur`, on in this scene's settings).
#
# Run: ./build/toyengine assets/scenes/tests/rendering/motion_blur_test/scene.yaml
#
#   mover     a bright orange block sliding back and forth along X (pingpong, ~19 m/s at the
#             centre): blurs along X only; its top and bottom edges stay sharp
#   spinner   a white/blue paddle spinning about Z at 360 deg/s: blurs along arcs, its hub sharp
#   statue    a static grey column in front of the mover's path: stays sharp while the block
#             slides behind it (foreground/background depth weighting)
#   fence     a row of dark and light posts behind everything: the camera's slow orbit
#             (auto_rotate) smears them sideways, as it does the grid floor and the sky
#
# Worth sweeping: motion_blur on/off, motion_blur_intensity (shutter, 0.5 = 180 degrees),
# and debug_view=velocity to see what drives it.
# The test suite drives the same objects by hand (render_motion_blur_* in test.cpp).
format: blender
scene:
  scene_name: motion_blur_test
  settings:
    render:
      motion_blur: true
      motion_blur_intensity: 0.5
  root_objects:
    - name: floor
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 30.0, y: 30.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: plane
          material: materials/prototype_grid
      children: []

    # --- Background: alternating dark/light posts, the camera pan's high-contrast subject ---
    - name: fence
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 9.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
      children:
        - { name: post_0, active: true, components: [ { type: Transform, position: { x: -9.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.9, g: 0.9, b: 0.85 }, roughness: 0.8 } } ], children: [] }
        - { name: post_1, active: true, components: [ { type: Transform, position: { x: -7.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.08, g: 0.08, b: 0.1 }, roughness: 0.8 } } ], children: [] }
        - { name: post_2, active: true, components: [ { type: Transform, position: { x: -5.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.9, g: 0.9, b: 0.85 }, roughness: 0.8 } } ], children: [] }
        - { name: post_3, active: true, components: [ { type: Transform, position: { x: -3.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.08, g: 0.08, b: 0.1 }, roughness: 0.8 } } ], children: [] }
        - { name: post_4, active: true, components: [ { type: Transform, position: { x: -1.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.9, g: 0.9, b: 0.85 }, roughness: 0.8 } } ], children: [] }
        - { name: post_5, active: true, components: [ { type: Transform, position: { x: 1.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.08, g: 0.08, b: 0.1 }, roughness: 0.8 } } ], children: [] }
        - { name: post_6, active: true, components: [ { type: Transform, position: { x: 3.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.9, g: 0.9, b: 0.85 }, roughness: 0.8 } } ], children: [] }
        - { name: post_7, active: true, components: [ { type: Transform, position: { x: 5.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.08, g: 0.08, b: 0.1 }, roughness: 0.8 } } ], children: [] }
        - { name: post_8, active: true, components: [ { type: Transform, position: { x: 7.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.9, g: 0.9, b: 0.85 }, roughness: 0.8 } } ], children: [] }
        - { name: post_9, active: true, components: [ { type: Transform, position: { x: 9.0, y: 0.0, z: 1.5 }, scale: { x: 0.5, y: 0.5, z: 3.0 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.08, g: 0.08, b: 0.1 }, roughness: 0.8 } } ], children: [] }

    # --- The fast-moving block ---
    - name: mover
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 3.0, z: 1.2 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.2, y: 1.2, z: 1.2 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 1.0, g: 0.45, b: 0.1 }, roughness: 0.5, emissive: { r: 0.6, g: 0.25, b: 0.05 } }
        - type: KinematicMover
          mode: pingpong
          axis: { x: 1.0, y: 0.0, z: 0.0 }
          distance: 6.0
          speed: 1.0
      children: []

    # --- A static column in front of the mover's path ---
    - name: statue
      active: true
      components:
        - type: Transform
          position: { x: 1.5, y: 0.5, z: 1.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.4, y: 0.4, z: 2.0 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.45, g: 0.45, b: 0.48 }, roughness: 0.6 }
      children: []

    # --- The spinning paddle ---
    - name: spinner
      active: true
      components:
        - type: Transform
          position: { x: -4.0, y: 1.0, z: 0.6 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: KinematicMover
          mode: spin
          spin_axis: { x: 0.0, y: 0.0, z: 1.0 }
          spin_speed: 360.0
      children:
        - { name: blade_a, active: true, components: [ { type: Transform, position: { x: 0.0, y: 0.0, z: 0.0 }, scale: { x: 3.0, y: 0.3, z: 0.3 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.95, g: 0.95, b: 0.95 }, roughness: 0.5 } } ], children: [] }
        - { name: blade_b, active: true, components: [ { type: Transform, position: { x: 0.0, y: 0.0, z: 0.0 }, scale: { x: 0.3, y: 3.0, z: 0.3 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.15, g: 0.35, b: 0.9 }, roughness: 0.5 } } ], children: [] }

    # --- Camera: a slow orbit around the set ---
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -9.0, z: 3.0 }
          rotation: { x: 75.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 60.0
          near_clip_plane: 0.1
          far_clip_plane: 300.0
        - type: CameraController
          mode: orbit
          target: { x: 0.0, y: 2.0, z: 1.0 }
          distance: 11.0
          yaw_deg: 0.0
          pitch_deg: 15.0
          movement_smoothing: 0.0
          auto_rotate_deg_per_sec: 12.0
          capture_cursor: false
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 20.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          direction: { x: -0.4, y: 0.5, z: -0.77 }
          color: { r: 1.0, g: 0.97, b: 0.9 }
          intensity: 1.2
          cast_shadows: true
      children: []
