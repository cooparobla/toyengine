# topdown_sky_test -- topdown mode (render topdown_mode: true): the toon cloud layer for
# zoomed-out topdown games, and its shadows drifting over the ground.
#
# Run: ./build/toyengine topdown_sky_test        (or SCENE=topdown_sky_test)
#
# A village of blocks around a pond, seen from a topdown orbit camera (scroll to zoom, right-drag
# to orbit). The cloud layer floats at 60 m: zoom out past ~75 m and the puffy, cel-shaded clouds
# fade in (fully shown from ~120 m); zoom in and they fade away, leaving only their shadows. The
# weather runs a 4-minute day and cycles clear -> cloudy -> storm, which drives the coverage, the
# drift (wind) and the light (sunset-orange clouds, moonlit ones at night).
#
# Worth sweeping in the editor's Topdown Mode group: cloud height / size / thickness, the fade
# heights, shadow strength, light bands (0 = smooth) and outline; and the weather's condition.
format: blender
scene:
  scene_name: topdown_sky_test
  settings:
    render:
      sky_model: physical
      clouds: false
      cloud_coverage: 0.45
      cloud_wind_speed: 6.0
      topdown_mode: true
      topdown_cloud_height: 60
      topdown_cloud_size: 30
      topdown_cloud_thickness: 8
      topdown_fade_start: 15
      topdown_fade_end: 60
      topdown_shadow_strength: 0.45
      topdown_light_bands: 3
      topdown_outline: 0.5
    weather:
      enabled: true
      time_of_day: 10.5
      day_length_minutes: 4
      latitude: 40
      north_offset: 0
      drive_sun: true
      sun_intensity: 1.3
      moon_intensity: 0.12
      condition: clear
      schedule: cycle
      ground_height: 0.0
      conditions:
        - name: clear
          duration: [0.6, 0.6]
          transition: 12
          cloud_cover: 0.2
          sun: 1.0
          ambient: 1.0
          fog_density: 0.002
          fog_color: { r: 0.72, g: 0.8, b: 0.9 }
          fog_sky_blend: 0.8
          fog_sun_amount: 0.5
          wind_strength: 2.0
          wind_heading: 20
          temperature: 20
        - name: cloudy
          duration: [0.5, 0.5]
          transition: 12
          cloud_cover: 0.55
          sun: 0.75
          ambient: 0.95
          fog_density: 0.004
          fog_color: { r: 0.68, g: 0.73, b: 0.8 }
          fog_sky_blend: 0.7
          fog_sun_amount: 0.35
          wind_strength: 4.0
          wind_heading: 30
          temperature: 16
        - name: storm
          duration: [0.4, 0.4]
          transition: 12
          cloud_cover: 1.0
          sun: 0.2
          ambient: 0.6
          sky_tint: { r: 0.8, g: 0.83, b: 0.9 }
          fog_density: 0.016
          fog_color: { r: 0.4, g: 0.43, b: 0.48 }
          fog_sky_blend: 0.5
          fog_sun_amount: 0.0
          wind_strength: 10.0
          wind_heading: 40
          temperature: 11
          precipitation: 1.0
          wetness: 1.0
          lightning: 4.0
          effects:
            - { prefab: objects/weather_rain, intensity: 1.6, follow: camera, offset: { x: 0, y: 0, z: 4 }, wind_influence: 0.8 }
