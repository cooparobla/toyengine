    # --- Camera: a topdown orbit rig over the village (scroll to zoom; right-drag to orbit).
    #     Zoomed out past ~75 m above the ground (15 m above the cloud layer) the toon clouds
    #     fade in, fully shown from ~120 m. The cloud shadows drift over the ground at any zoom.
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -95.0, z: 135.0 }
          rotation: { x: 35.0, y: 0.0, z: 0.0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 50.0
          near_clip_plane: 0.5
          far_clip_plane: 2000.0
        - type: CameraController
          mode: orbit
          target: { x: 0.0, y: 0.0, z: 0.0 }
          min_distance: 15.0
          max_distance: 400.0
      children: []
    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0, y: 0, z: 30 }
          rotation: { x: 0, y: 0, z: 0 }
          scale: { x: 1, y: 1, z: 1 }
        - type: DirectionalLight
          direction: { x: -0.4, y: 0.35, z: -0.85 }
          color: { r: 1.0, g: 1.0, b: 1.0 }
          intensity: 1.3
          cast_shadows: true
      children: []
