format: blender
scene:
  scene_name: topdown_sky_test
  settings:
    render:
      cloud_coverage: 0.45
      cloud_wind_speed: 6.0
      clouds: false
      sky_model: physical
      topdown_cloud_size: 30
      topdown_cloud_thickness: 8
      topdown_fade_end: 60
      topdown_fade_start: 15
      topdown_light_bands: 3
      topdown_mode: true
      topdown_outline: 0.5
      topdown_shadow_strength: 0.45
    weather:
      condition: clear
      conditions:
        - name: clear
          ambient: 1.0
          cloud_cover: 0.2
          duration: [0.6, 0.6]
          fog_color: { b: 0.9, g: 0.8, r: 0.72 }
          fog_density: 0.002
          fog_sky_blend: 0.8
          fog_sun_amount: 0.5
          sun: 1.0
          temperature: 20
          transition: 12
          wind_heading: 20
          wind_strength: 2.0
        - name: cloudy
          ambient: 0.95
          cloud_cover: 0.55
          duration: [0.5, 0.5]
          fog_color: { b: 0.8, g: 0.73, r: 0.68 }
          fog_density: 0.004
          fog_sky_blend: 0.7
          fog_sun_amount: 0.35
          sun: 0.75
          temperature: 16
          transition: 12
          wind_heading: 30
          wind_strength: 4.0
        - name: storm
          ambient: 0.6
          cloud_cover: 1.0
          duration: [0.4, 0.4]
          effects:
            - prefab: objects/weather_rain
              follow: camera
              intensity: 1.6
              offset: { x: 0, y: 0, z: 4 }
              wind_influence: 0.8
          fog_color: { b: 0.48, g: 0.43, r: 0.4 }
          fog_density: 0.016
          fog_sky_blend: 0.5
          fog_sun_amount: 0.0
          lightning: 4.0
          precipitation: 1.0
          sky_tint: { b: 0.9, g: 0.83, r: 0.8 }
          sun: 0.2
          temperature: 11
          transition: 12
          wetness: 1.0
          wind_heading: 40
          wind_strength: 1.0e+01
      day_length_minutes: 4
      drive_sun: true
      enabled: true
      ground_height: 0.0
      latitude: 40
      moon_intensity: 0.12
      north_offset: 0
      schedule: cycle
      sun_intensity: 1.3
      time_of_day: 10.5
  root_objects:
