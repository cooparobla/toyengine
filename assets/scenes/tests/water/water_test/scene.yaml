# water_test -- exercises toyengine's water system end to end (toyengine/water/).
#
#   * PLANAR water: a lake with Gerstner waves, a shallow sand beach to the west (long shore-foam
#     gradient), a steep bank to the north (tight foam band), and a small island.
#   * FLOWING water: a river running down the hill to the east. Its current is NOT authored --
#     WaterSystem derives it from the river mesh's slope, so it runs gently through the upper
#     reach, fast and white through the rapids, and slows again over the ford at its mouth.
#   * STATIC interaction: rock pillars and pier posts pierce the lake (depth-based contact foam,
#     no special setup); a boulder in the lower river deflects the current and leaves a wake.
#   * RIPPLES: anything crossing the surface leaves rings -- splashes from the dropped crates, a
#     wake behind the kinematic boat circling the lake, small rings from bobbing floaters.
#   * BUOYANCY: crates of different densities, a barrel, a ball and a raft with hand-placed
#     pontoons are dropped into the lake; two small crates start in the upper river and get
#     carried down into the lake; a stone is denser than water and sinks.
#
# Meshes: tools/gen_water_test_meshes.py (terrain, collider copy, river strip, props).
# Run:    ./build/toyengine water_test        (headless: HEADLESS=1 MAX_FRAMES=600 ...)
#
# World: Z up, metres. The lake surface is at z = 0.
format: blender
scene:
  scene_name: water_test
  root_objects:
    # ============================================================================
    # TERRAIN -- render mesh + a static, non-convex MeshCollider (a separate file: AssetManager
    # caches one asset type per resolved path, see physics_test's mesh_floor).
    # ============================================================================
    - name: lake_basin
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: lake_basin
          material:
            albedo: { r: 0.4, g: 0.44, b: 0.27 }
            metallic: 0.0
            roughness: 0.92
            ao: 1.0
        - type: MeshCollider
          mesh_path: lake_basin_collider
          convex: false
      children: []

    # ============================================================================
    # LAKE -- planar WaterBody on a procedural grid. The grid runs on under the banks on
    # purpose: WaterSystem probes the depth under every vertex (0 where buried), the waves calm
    # over shallows, and the depth buffer hides whatever is underground.
    # ============================================================================
    - name: lake_water
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          affects_reflection_probes: false
          material:
            albedo: { r: 0.03, g: 0.16, b: 0.22 }   # the deep-water colour
            metallic: 0.0
            roughness: 0.05
            ao: 1.0
            alpha: 0.4                                # shallow-water opacity; rises with depth
            alpha_mode: BLEND
            refraction: true
            ior: 1.33
            refraction_tint: { r: 0.45, g: 0.78, b: 0.82 }
        - type: WaterBody
          mode: planar
          size: { x: 46.0, y: 46.0 }
          resolution: 96
          wave_amplitude: 0.12      # metres, base wave crest
          wave_length: 6.0          # metres; three shorter waves are derived from it
          wave_direction: 30.0      # degrees CCW from +X
          wave_steepness: 0.55
          clarity: 2.5              # ~63% opaque at 2.5 m of water
          shore_foam_depth: 0.5
          edge_fade_depth: 0.12
          ripple_strength: 0.3
          ripple_scale: 1.1
      children: []

    # ============================================================================
    # RIVER -- flowing WaterBody on the generated strip (u runs downstream). The sibling
    # MeshRenderer names no mesh: WaterSystem publishes the baked one to it.
    # ============================================================================
    - name: river_water
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          affects_reflection_probes: false
          material:
            albedo: { r: 0.05, g: 0.2, b: 0.22 }
            metallic: 0.0
            roughness: 0.08
            ao: 1.0
            alpha: 0.35
            alpha_mode: BLEND
            refraction: true
            ior: 1.33
            refraction_tint: { r: 0.55, g: 0.82, b: 0.8 }
        - type: WaterBody
          mode: flowing
          mesh_path: river_water
          wave_amplitude: 0.015
          wave_length: 1.4
          wave_direction: 200.0
          wave_steepness: 0.3
          flow_speed: 1.0
          flow_min_speed: 0.7       # m/s on the level reaches
          flow_slope_gain: 4.0      # + gain * sqrt(sin slope): ~3.4 m/s through the rapids
          obstacle_radius: 1.6
          wake_length: 4.5
          clarity: 1.6
          shore_foam_depth: 0.35
          edge_fade_depth: 0.1
          ripple_strength: 0.45
          ripple_scale: 1.4
      children: []

    # ============================================================================
    # STATIC OBSTACLES
    # ============================================================================
    - name: rock_pillar_a
      active: true
      components:
        - type: Transform
          position: { x: -4.0, y: 6.0, z: -1.2 }
          rotation: { x: 0.0, y: 0.0, z: 20.0 }
          scale: { x: 1.4, y: 1.1, z: 5.0 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.36, g: 0.35, b: 0.33 }, metallic: 0.0, roughness: 0.9, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: rock_pillar_b
      active: true
      components:
        - type: Transform
          position: { x: 8.0, y: 3.0, z: -1.4 }
          rotation: { x: 4.0, y: -6.0, z: -35.0 }
          scale: { x: 0.9, y: 0.9, z: 4.6 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.4, g: 0.38, b: 0.35 }, metallic: 0.0, roughness: 0.9, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    - name: rock_pillar_c
      active: true
      components:
        - type: Transform
          position: { x: 2.0, y: -12.0, z: -1.3 }
          rotation: { x: 0.0, y: 0.0, z: 60.0 }
          scale: { x: 2.2, y: 1.2, z: 4.2 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.34, g: 0.33, b: 0.31 }, metallic: 0.0, roughness: 0.9, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []

    # Pier on the west beach: a deck on posts that stand in progressively deeper water.
    - name: pier_deck
      active: true
      components:
        - type: Transform
          position: { x: -14.0, y: -4.0, z: 0.75 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 10.0, y: 1.8, z: 0.16 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.45, g: 0.32, b: 0.2 }, metallic: 0.0, roughness: 0.8, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
      children: []
    - { name: pier_post_0, active: true, components: [ { type: Transform, position: { x: -16.5, y: -4.75, z: -0.4 }, scale: { x: 0.2, y: 0.2, z: 2.4 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.32, g: 0.22, b: 0.14 }, roughness: 0.85 } }, { type: BoxCollider, size: { x: 1.0, y: 1.0, z: 1.0 } } ], children: [] }
    - { name: pier_post_1, active: true, components: [ { type: Transform, position: { x: -16.5, y: -3.25, z: -0.4 }, scale: { x: 0.2, y: 0.2, z: 2.4 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.32, g: 0.22, b: 0.14 }, roughness: 0.85 } }, { type: BoxCollider, size: { x: 1.0, y: 1.0, z: 1.0 } } ], children: [] }
    - { name: pier_post_2, active: true, components: [ { type: Transform, position: { x: -13.0, y: -4.75, z: -0.6 }, scale: { x: 0.2, y: 0.2, z: 2.8 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.32, g: 0.22, b: 0.14 }, roughness: 0.85 } }, { type: BoxCollider, size: { x: 1.0, y: 1.0, z: 1.0 } } ], children: [] }
    - { name: pier_post_3, active: true, components: [ { type: Transform, position: { x: -13.0, y: -3.25, z: -0.6 }, scale: { x: 0.2, y: 0.2, z: 2.8 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.32, g: 0.22, b: 0.14 }, roughness: 0.85 } }, { type: BoxCollider, size: { x: 1.0, y: 1.0, z: 1.0 } } ], children: [] }
    - { name: pier_post_4, active: true, components: [ { type: Transform, position: { x: -9.5, y: -4.75, z: -0.9 }, scale: { x: 0.2, y: 0.2, z: 3.4 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.32, g: 0.22, b: 0.14 }, roughness: 0.85 } }, { type: BoxCollider, size: { x: 1.0, y: 1.0, z: 1.0 } } ], children: [] }
    - { name: pier_post_5, active: true, components: [ { type: Transform, position: { x: -9.5, y: -3.25, z: -0.9 }, scale: { x: 0.2, y: 0.2, z: 3.4 } }, { type: MeshRenderer, mesh_path: cube, material: { albedo: { r: 0.32, g: 0.22, b: 0.14 }, roughness: 0.85 } }, { type: BoxCollider, size: { x: 1.0, y: 1.0, z: 1.0 } } ], children: [] }

    # A boulder in the lower river: the current splits around it, and white water trails behind.
    - name: river_boulder
      active: true
      components:
        - type: Transform
          position: { x: 22.9, y: 6.1, z: 0.45 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.75, y: 0.75, z: 0.6 }
        - type: MeshRenderer
          mesh_path: sphere_low
          material: { albedo: { r: 0.38, g: 0.37, b: 0.35 }, metallic: 0.0, roughness: 0.9, ao: 1.0 }
        - type: SphereCollider
          radius: 1.0
      children: []

    # ============================================================================
    # BUOYANT BODIES -- Rigidbody + collider + Buoyancy. Floating height follows mass/volume:
    # fresh water is 1000 kg/m^3, so a 1 m^3 crate of 300 kg rides 30% submerged.
    # ============================================================================
    - name: crate_light
      active: true
      components:
        - type: Transform
          position: { x: -3.0, y: -3.0, z: 2.5 }
          rotation: { x: 10.0, y: 25.0, z: 15.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.7, g: 0.5, b: 0.26 }, metallic: 0.0, roughness: 0.75, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
          material: wood
        - type: Rigidbody
          mass: 300.0
        - type: Buoyancy
          linear_drag: 1.2
          angular_drag: 0.8
      children: []

    - name: crate_neutral
      active: true
      components:
        - type: Transform
          position: { x: 1.0, y: -5.0, z: 1.5 }
          scale: { x: 0.8, y: 0.8, z: 0.8 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.42, g: 0.5, b: 0.3 }, metallic: 0.0, roughness: 0.75, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
          material: wood
        - type: Rigidbody
          mass: 480.0              # 0.512 m^3 -> 94% submerged: barely awash
        - type: Buoyancy
          linear_drag: 1.5
      children: []

    - name: stone
      active: true
      components:
        - type: Transform
          position: { x: -1.0, y: 2.0, z: 2.0 }
          rotation: { x: 0.0, y: 0.0, z: 30.0 }
          scale: { x: 0.6, y: 0.6, z: 0.6 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.25, g: 0.25, b: 0.27 }, metallic: 0.0, roughness: 0.9, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
          material: concrete
        - type: Rigidbody
          mass: 520.0              # 2400 kg/m^3: sinks, slowed by water drag
        - type: Buoyancy
          linear_drag: 2.0
      children: []

    - name: barrel
      active: true
      components:
        - type: Transform
          position: { x: 3.0, y: 4.0, z: 1.6 }
          rotation: { x: 0.0, y: 90.0, z: 20.0 }   # lying on its side
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: barrel
          material: { albedo: { r: 0.5, g: 0.28, b: 0.15 }, metallic: 0.0, roughness: 0.7, ao: 1.0 }
        - type: CapsuleCollider
          radius: 0.35
          height: 1.3
          direction: 2
          material: wood
        - type: Rigidbody
          mass: 150.0              # ~0.41 m^3 -> 37% submerged
        - type: Buoyancy
          linear_drag: 1.0
      children: []

    - name: ball
      active: true
      components:
        - type: Transform
          position: { x: -6.0, y: 0.0, z: 3.0 }
          scale: { x: 0.5, y: 0.5, z: 0.5 }
        - type: MeshRenderer
          mesh_path: sphere_low
          material: { albedo: { r: 0.85, g: 0.2, b: 0.15 }, metallic: 0.0, roughness: 0.5, ao: 1.0 }
        - type: SphereCollider
          radius: 1.0
          material: rubber
        - type: Rigidbody
          mass: 60.0               # 0.52 m^3 -> rides high
        - type: Buoyancy
          linear_drag: 0.8
      children: []

    - name: raft
      active: true
      components:
        - type: Transform
          position: { x: -11.5, y: -8.0, z: 0.8 }
          rotation: { x: 0.0, y: 0.0, z: -15.0 }
          scale: { x: 2.4, y: 1.6, z: 0.25 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.55, g: 0.4, b: 0.22 }, metallic: 0.0, roughness: 0.8, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
          material: wood
        - type: Rigidbody
          mass: 350.0
        - type: Buoyancy
          # Four hand-placed pontoons at the corners (unscaled local frame of the unit cube).
          pontoons:
            - { x: -0.4, y: -0.4, z: 0.0, radius: 0.055 }
            - { x: 0.4, y: -0.4, z: 0.0, radius: 0.055 }
            - { x: 0.4, y: 0.4, z: 0.0, radius: 0.055 }
            - { x: -0.4, y: 0.4, z: 0.0, radius: 0.055 }
          linear_drag: 1.5
          angular_drag: 1.5
      children: []

    - name: crate_drop
      active: true
      components:
        - type: Transform
          position: { x: 4.0, y: -1.0, z: 7.0 }
          rotation: { x: 35.0, y: 10.0, z: 0.0 }
          scale: { x: 0.9, y: 0.9, z: 0.9 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.66, g: 0.46, b: 0.24 }, metallic: 0.0, roughness: 0.75, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
          material: wood
        - type: Rigidbody
          mass: 260.0
        - type: Buoyancy
          linear_drag: 1.2
      children: []

    # A kinematic "boat" circling the lake: no Buoyancy, just a kinematic Rigidbody moving through
    # the surface -- WaterSystem leaves a trail of wake rings behind anything crossing the water,
    # and it shoulders the floating crates aside as it passes.
    - name: boat
      active: true
      components:
        - type: Transform
          position: { x: 3.0, y: -1.0, z: 0.05 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.4, y: 1.4, z: 0.5 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.75, g: 0.2, b: 0.15 }, metallic: 0.0, roughness: 0.6, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Rigidbody
          mass: 400.0
          is_kinematic: true
          use_gravity: false
        - type: KinematicMover
          mode: orbit
          orbit_center: { x: -2.0, y: -1.0, z: 0.05 }
          orbit_radius: 5.0
          speed: 28.0                 # degrees/second: ~2.4 m/s around the circle
      children: []

    # Upper-river crates: carried down the rapids and out into the lake by the current alone.
    - name: river_crate_a
      active: true
      components:
        - type: Transform
          position: { x: 36.0, y: 12.7, z: 6.3 }
          scale: { x: 0.5, y: 0.5, z: 0.5 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.75, g: 0.55, b: 0.3 }, metallic: 0.0, roughness: 0.75, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
          material: wood
        - type: Rigidbody
          mass: 45.0
        - type: Buoyancy
          linear_drag: 2.0
      children: []

    - name: river_crate_b
      active: true
      components:
        - type: Transform
          position: { x: 33.4, y: 13.8, z: 6.0 }
          rotation: { x: 0.0, y: 0.0, z: 40.0 }
          scale: { x: 0.45, y: 0.45, z: 0.45 }
        - type: MeshRenderer
          mesh_path: cube
          material: { albedo: { r: 0.6, g: 0.42, b: 0.22 }, metallic: 0.0, roughness: 0.75, ao: 1.0 }
        - type: BoxCollider
          size: { x: 1.0, y: 1.0, z: 1.0 }
          material: wood
        - type: Rigidbody
          mass: 35.0
        - type: Buoyancy
          linear_drag: 2.0
      children: []

    # ============================================================================
    # CAMERA, LIGHT, SKY
    # ============================================================================
    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 6.0, y: -40.0, z: 30.0 }
          rotation: { x: 55.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 55.0
          near_clip_plane: 0.3
          far_clip_plane: 400.0
        - type: CameraController
          mode: orbit
          target: { x: 6.0, y: 2.0, z: 0.0 }
          distance: 50.0
          yaw_deg: 0.0               # from -Y looking +Y: beach left, river right
          pitch_deg: 38.0
          movement_smoothing: 0.25
          mouse_sensitivity: 0.12
          zoom_speed: 2.0
          min_distance: 4.0
          max_distance: 140.0
          min_pitch_deg: 2.0
          max_pitch_deg: 85.0
          capture_cursor: true
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 40.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          direction: { x: -0.4, y: 0.35, z: -0.85 }
          color: { r: 1.0, g: 0.95, b: 0.86 }
          intensity: 1.2
          cast_shadows: true
          shadow_intensity: 1.0
      children: []

    - name: sky
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: EnvironmentLight
          sky_color: { r: 0.48, g: 0.64, b: 0.9 }
          ground_color: { r: 0.2, g: 0.18, b: 0.14 }
          sky_intensity: 1.0
      children: []
