# ui_demo -- game UI in the engine: world-space canvases, themed widgets and a screen-space HUD.
#
#  * cube           -- carries HealthDriver, which owns a health Resource AND declares the
#    plate above it per frame (an immediate-mode world canvas it builds itself, facing the
#    camera). Its Heal button is a real clickable widget in the world: the host turns the
#    pointer into a ray, the canvas turns that into a point in its own pixels.
#  * wall_canvas    -- a retained canvas with `billboard: Transform`, which honours its own 3D
#    rotation instead of turning to face the camera. Compare the two as the camera orbits.
#  * Hero           -- a retained nameplate canvas of THEMED widgets (ThemedText, StatBar).
#  * hud            -- DemoHud: the screen-space HUD, drawn over the finished frame at full
#    window resolution. Its panels are positioned through assets/ui/demo_hud.tune.yaml.
#  * camera         -- auto-orbits (`auto_rotate_deg_per_sec`), which makes the two billboard
#    modes visible without touching the mouse. Mouse look is off (`mouse_sensitivity: 0.0`) and
#    the cursor is NOT captured, so the pointer is free to hover and click the world-space UI
#    (the Heal button lights up under it).
#
# Run: ./build/toyengine ui_demo        (or SCENE=ui_demo)

scene:
  scene_name: ui_demo
  root_objects:
    - name: floor
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: -0.5 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 3.0, y: 3.0, z: 3.0 }
        - type: MeshRenderer
          mesh_path: plane
          material:
            albedo: { r: 0.30, g: 0.34, b: 0.28 }
            metallic: 0.0
            roughness: 0.85
            ao: 1.0
      children: []

    # An opaque block between the camera and the far canvas, so `occlude: true` has something
    # to actually be occluded BY. Without a real occluder the flag is untestable.
    - name: occluder
      active: true
      components:
        - type: Transform
          # Same corner-origin mesh, so z = the floor height puts its base ON the floor.
          position: { x: 1.4, y: -1.6, z: -0.5 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 0.5, y: 0.5, z: 1.8 }
        - type: MeshRenderer
          mesh_path: cube_corner
          material:
            albedo: { r: 0.22, g: 0.24, b: 0.30 }
            metallic: 0.0
            roughness: 0.7
            ao: 1.0
      children: []

    # NOTE ON PLACEMENT: cube_corner's mesh spans 0..1 on every axis -- its origin is a CORNER,
    # not its centre (check assets/meshes/cube_corner.yaml; the kitchen_sink test scene offsets by -0.5 for the same
    # reason). So the cube sits at -0.5 to centre it on the world origin and rest it on the
    # floor, and health_canvas's local +0.5/+0.5 below cancels that back out so the canvas
    # hangs centred over the cube rather than over one of its vertical edges.
    - name: cube
      active: true
      components:
        - type: Transform
          position: { x: -0.5, y: -0.5, z: -0.5 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: MeshRenderer
          mesh_path: cube_corner
          material:
            albedo: { r: 0.80, g: 0.35, b: 0.25 }
            metallic: 0.0
            roughness: 0.6
            ao: 1.0
        # Owns the coopa::stat::Resource AND declares the plate that shows it, per frame --
        # there is no bar object to bind and nothing to keep in step. The plate is a
        # world-space canvas the component builds above this object; `Heal` is a real
        # clickable widget on it. See toyengine/scene/health_driver.h.
        - type: HealthDriver
          max_health: 100.0
          start_health: 100.0
          damage_per_second: 22.0
          regen_per_second: 14.0
          show_heal_button: true
          theme_ref: ui/themes/game_dark
          # Canvas PIXELS, not world units: 150x38 at 110 px/unit spans ~1.36 x 0.35 metres.
          # text_supersample keeps the glyphs crisp when the camera orbits close.
          world_size: { x: 150.0, y: 48.0 }
          pixels_per_unit: 110.0
          world_text_supersample: 2.1
          world_occlude: false
    # A sign that is physically in the scene: `billboard: Transform` keeps it at its own
    # rotation instead of turning to face you (read it from the front, edge-on from the side),
    # and `world_occlude` lets the occluder cube hide it as the camera orbits behind.
    - name: wall_canvas
      active: true
      components:
        - type: Transform
          position: { x: -1.9, y: 0.2, z: 0.45 }
          rotation: { x: 0.0, y: 0.0, z: 30.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: WorldLabel
          title: Notice
          subtitle: Fixed to the wall
          billboard: Transform
          world_occlude: true
          theme_ref: ui/themes/game_dark
          world_size: { x: 130.0, y: 44.0 }
          pixels_per_unit: 90.0
          world_text_supersample: 2.0

    # A nameplate over a character: faces the camera, and deliberately NOT occluded -- a
    # label you cannot see is worse than one that cheats.
    - name: Hero
      active: true
      components:
        - type: Transform
          position: {x: 3.5, y: 2.0, z: 0.5}
          scale: {x: 0.5, y: 0.5, z: 0.5}
        # Something for the plate to be ABOVE: a nameplate floating over empty ground does
        # not show what a nameplate is for.
        - type: MeshRenderer
          mesh_path: cube_corner
          material:
            albedo: { r: 0.35, g: 0.45, b: 0.70 }
            metallic: 0.0
            roughness: 0.55
        - type: WorldLabel
          title: Aldric
          bar_value: 72
          bar_max: 100
          bar_role: health
          theme_ref: ui/themes/game_dark
          world_size: { x: 260.0, y: 60.0 }
          pixels_per_unit: 160.0
          world_text_supersample: 2.0

    - name: hud
      active: true
      components:
        - type: DemoHud
          theme_ref: ui/themes/game_dark

    # A screen authored entirely in YAML (assets/ui/settings.yaml) -- no C++ for this one.
    # Its rows read and write UserSettings through their `bind` keys.
    - name: settings
      active: true
      components:
        - type: PanelScreen
          panel: ui/settings
          theme_ref: ui/themes/game_dark
          sort_order: 40

    - name: camera
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: -5.0, z: 1.6 }
          rotation: { x: 78.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: Camera
          main: true
          projection: Perspective
          fov: 50.0
          near_clip_plane: 0.1
          far_clip_plane: 1000.0
          # config.yaml's DoF defaults are a manual 8 m focus at f/2.8, which would put this
          # scene's ~5 m subject well out of focus. A per-camera focus_object racks focus onto
          # the cube regardless of dof_focus_mode (see config.yaml's note), and stopping down
          # to f/11 keeps the CUBE legible while leaving DoF visibly on. The UI is unaffected
          # either way -- both canvas layers composite after DoF (and after AA and tilt shift);
          # see ToyRenderPipeline::overlay_target_.
          lens: 50.0
          aperture: 11.0
          focus_object: cube
        - type: CameraController
          mode: orbit
          target: { x: 0.0, y: 0.0, z: 0.6 }
          follow_smoothing: 10.0
          movement_smoothing: 0.8
          # Mouse look OFF and cursor NOT captured: the pointer belongs to the world-space UI
          # here, not to the camera. apply_cursor_capture_() only hides the OS cursor when
          # capture_cursor is true, and there is no in-app way to release it once hidden.
          mouse_sensitivity: 0.0
          capture_cursor: false
          # This is what demonstrates the billboard: the camera circles on its own, so
          # health_canvas stays square-on while wall_canvas turns with the world.
          auto_rotate_deg_per_sec: 18.0
          zoom_speed: 1.0
          min_distance: 2.0
          max_distance: 30.0
          min_pitch_deg: 0.0
          max_pitch_deg: 85.0
      children: []

    - name: sun
      active: true
      components:
        - type: Transform
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        - type: DirectionalLight
          direction: { x: -0.35, y: -0.45, z: -0.82 }
          color: { r: 1.0, g: 0.97, b: 0.9 }
          intensity: 1.0
          cast_shadows: true
          shadow_intensity: 0.6
      children: []
