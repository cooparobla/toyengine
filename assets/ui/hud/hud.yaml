# The in-game HUD: vitals (top left), quest tracker (top right), message log,
# hotbar and controller prompts.
#
# A UI asset (open it in the editor's UI tab). Authored at 1920 x 1080.
# Generated by tools/gen_ui_templates.py.
object:
  name: hud
  components:
    - type: RectTransform
      anchor_min: {x: 0, y: 0}
      anchor_max: {x: 1, y: 1}
      pivot: {x: 0.5, y: 0.5}
      anchored_position: {x: 0, y: 0}
      size_delta: {x: 0, y: 0}
    - type: Canvas
      mode: ScaleWithScreenSize
      reference_resolution: {x: 1920, y: 1080}
      match_width_or_height: 0.5
      sort_order: 0
    - {type: Theme, source: ui/themes/default.yaml}
  children:
    - name: Vitals
      components:
        - type: RectTransform
          anchor_min: {x: 0, y: 1}
          anchor_max: {x: 0, y: 1}
          pivot: {x: 0, y: 1}
          anchored_position: {x: 40, y: -40}
          size_delta: {x: 420, y: 120}
        - {type: HudCorner, flow: vertical, spacing: 10}
      children:
        - name: Health
          components:
            - type: RectTransform
              anchor_min: {x: 0.5, y: 0.5}
              anchor_max: {x: 0.5, y: 0.5}
              pivot: {x: 0.5, y: 0.5}
              anchored_position: {x: 0, y: 0}
              size_delta: {x: 420, y: 28}
            - {type: StatBar, role: health, max: 100, value: 100, bar_height: 24}
        - name: Stamina
          components:
            - type: RectTransform
              anchor_min: {x: 0.5, y: 0.5}
              anchor_max: {x: 0.5, y: 0.5}
              pivot: {x: 0.5, y: 0.5}
              anchored_position: {x: 0, y: 0}
              size_delta: {x: 420, y: 20}
            - {type: StatBar, role: stamina, max: 100, value: 100, bar_height: 16, show_label: false}
        - name: Mana
          components:
            - type: RectTransform
              anchor_min: {x: 0.5, y: 0.5}
              anchor_max: {x: 0.5, y: 0.5}
              pivot: {x: 0.5, y: 0.5}
              anchored_position: {x: 0, y: 0}
              size_delta: {x: 420, y: 20}
            - {type: StatBar, role: mana, max: 60, value: 60, bar_height: 16, show_label: false}
    - name: Quest
      components:
        - type: RectTransform
          anchor_min: {x: 1, y: 1}
          anchor_max: {x: 1, y: 1}
          pivot: {x: 1, y: 1}
          anchored_position: {x: -40, y: -40}
          size_delta: {x: 480, y: 110}
        - {type: HudCorner, flow: vertical, spacing: 6}
      children:
        - name: QuestTitle
          components:
            - type: RectTransform
              anchor_min: {x: 0.5, y: 0.5}
              anchor_max: {x: 0.5, y: 0.5}
              pivot: {x: 0.5, y: 0.5}
              anchored_position: {x: 0, y: 0}
              size_delta: {x: 480, y: 36}
            - {type: ThemedText, text: The Lost Lantern, font_role: Heading, text_role: Accent, align: Right}
        - name: QuestStep
          components:
            - type: RectTransform
              anchor_min: {x: 0.5, y: 0.5}
              anchor_max: {x: 0.5, y: 0.5}
              pivot: {x: 0.5, y: 0.5}
              anchored_position: {x: 0, y: 0}
              size_delta: {x: 480, y: 30}
            - {type: ThemedText, text: Search the old mill for clues, font_role: Body, text_role: Primary, align: Right}
    - name: MessageLog
      components:
        - type: RectTransform
          anchor_min: {x: 0, y: 0}
          anchor_max: {x: 0, y: 0}
          pivot: {x: 0, y: 0}
          anchored_position: {x: 40, y: 140}
          size_delta: {x: 560, y: 200}
        - {type: MessageLog, max_lines: 6, boxed: false}
    - name: Hotbar
      components:
        - type: RectTransform
          anchor_min: {x: 0.5, y: 0}
          anchor_max: {x: 0.5, y: 0}
          pivot: {x: 0.5, y: 0}
          anchored_position: {x: 0, y: 36}
          size_delta: {x: 660, y: 60}
        - {type: Hotbar, count: 10, slot_size: 60, spacing: 6, key_labels: true}
    - name: Prompts
      components:
        - type: RectTransform
          anchor_min: {x: 1, y: 0}
          anchor_max: {x: 1, y: 0}
          pivot: {x: 1, y: 0}
          anchored_position: {x: -40, y: 40}
          size_delta: {x: 560, y: 44}
        - type: PromptBar
          prompts:
            - {action: Confirm, label: Interact}
            - {action: Menu, label: Map}
            - {action: Back, label: Menu}
