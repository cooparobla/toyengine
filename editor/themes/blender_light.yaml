# Blender Light -- after Blender's light theme. Starts from Blender Dark and overrides only
# what differs; delete a line here to fall back to the dark value.
name: Blender Light
author: toyengine
description: Blender's light theme
inherits: blender_dark

colors:
  window_bg: "#8c8c8c"
  panel_bg: "#c8c8c8"
  panel_alt: "#bdbdbd"
  header: "#b3b3b3"
  header_hover: "#a6a6a6"
  subpanel: "#d1d1d1"
  border: "#7a7a7a"
  text: "#1a1a1a"
  text_dim: "#404040"
  text_disabled: "#808080"
  accent: "#5680c2"
  button: "#e6e6e6"
  button_hover: "#f2f2f2"
  button_active: "#5680c2"
  field: "#f0f0f0"
  field_hover: "#ffffff"
  number: "#e6e6e6"
  number_hover: "#f2f2f2"
  selection: "#5680c2cc"
  selection_dim: "#8fa8d1cc"
  row_hover: "#0000000f"
  popup_bg: "#d9d9d9f7"
  scroll_grab: "#7a7a7acc"
  hover_tint: "#00000014"
  edge_highlight: "#ffffff59"
  separator: "#00000033"
  shadow: "#0000000f"
  modal_dim: "#00000040"
  check_mark: "#ffffff"

chrome:
  topbar_bg: "#a3a3a3"
  statusbar_bg: "#a3a3a3"
  play_group_bg: "#bdbdbd"
  play_tint: "#d9b98c"

viewport:
  toolbar_bg: "#c8c8c8eb"
  sidebar_bg: "#c8c8c8f2"
  nav_backdrop: "#ffffff38"
  nav_hover: "#0000001a"
  overlay_text: "#ffffff"

outliner:
  active_label: "#000000"
  mesh: "#c4641c"
  light: "#a8820f"
  camera: "#2f8a2f"
  terrain: "#4d7a35"
