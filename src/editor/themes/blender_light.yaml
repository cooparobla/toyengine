# Blender Light -- after Blender's light theme. Starts from Blender Dark and overrides only
# what differs; delete a line here to fall back to the dark value.
name: Blender Light
author: toyengine
description: Blender's light theme
inherits: blender_dark

colors:
  window_bg: "#8c8c8c"
  panel_bg: "#c8c8c8"
  panel_alt: "#bdbdbd"
  header: "#b3b3b3"
  header_hover: "#a6a6a6"
  subpanel: "#d1d1d1"
  border: "#7a7a7a"
  text: "#1a1a1a"
  text_dim: "#404040"
  text_disabled: "#808080"
  accent: "#5680c2"
  button: "#e6e6e6"
  button_hover: "#f2f2f2"
  button_active: "#5680c2"
  field: "#f0f0f0"
  field_hover: "#ffffff"
  number: "#e6e6e6"
  number_hover: "#f2f2f2"
  selection: "#5680c2cc"
  selection_dim: "#8fa8d1cc"
  row_hover: "#0000000f"
  popup_bg: "#d9d9d9f7"
  scroll_grab: "#7a7a7acc"
  hover_tint: "#00000014"
  edge_highlight: "#ffffff59"
  separator: "#00000033"
  shadow: "#0000000f"
  modal_dim: "#00000040"
  check_mark: "#ffffff"

chrome:
  topbar_bg: "#a3a3a3"
  statusbar_bg: "#a3a3a3"
  play_group_bg: "#bdbdbd"
  play_tint: "#d9b98c"
  setting_override: "#2a7ab040"
  setting_override_bar: "#1f6fa8e6"

viewport:
  toolbar_bg: "#c8c8c8eb"
  sidebar_bg: "#c8c8c8f2"
  nav_backdrop: "#ffffff38"
  nav_hover: "#0000001a"
  overlay_text: "#ffffff"

outliner:
  active_label: "#000000"
  mesh: "#c4641c"
  light: "#a8820f"
  camera: "#2f8a2f"
  terrain: "#4d7a35"

nodegraph:
  grid:            "#00000014"
  grid_major:      "#00000026"
  node_bg:         "#e8e8eaf5"
  node_header:     "#c4c8d1"
  node_outline:    "#00000059"
  node_selected:   "#e07b00"
  node_error:      "#cc3322"
  node_text:       "#1a1a1f"
  wire:            "#4d5560f2"
  wire_selected:   "#e07b00"
  wire_dragging:   "#8c8c33f2"
  wire_invalid:    "#cc3322f2"
  socket_default:  "#6b6b73"
  socket_float:    "#737373"
  socket_int:      "#3d8c3d"
  socket_bool:     "#a65c91"
  socket_vector:   "#4a52b8"
  socket_color:    "#b8a62e"
  socket_string:   "#3d8c99"
  socket_geometry: "#2e9960"
  socket_object:   "#c7762e"
  band_fill:       "#4d7fd92e"
  band_outline:    "#3d6bb8d9"
