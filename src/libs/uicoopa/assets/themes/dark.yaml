# uicoopa default theme — dark.
#
# Mirrors UITheme::builtin_dark() field-for-field (see uicoopa/builder/ui_theme.h).
# ThemeLibrary::active() falls back to that compiled-in palette if this file is
# ever missing or fails to parse, so the two are meant to stay in sync; every
# field below is also optional here — omit any key to inherit builtin_dark()'s
# value for it instead of respecifying it.
name: dark

panel:
  background: { r: 0.08, g: 0.09, b: 0.12, a: 0.95 }
  panel:      { r: 0.13, g: 0.15, b: 0.19, a: 0.90 }
  panel_alt:  { r: 0.11, g: 0.13, b: 0.18, a: 0.95 }
  header_bar: { r: 0.14, g: 0.17, b: 0.24, a: 1.00 }
  border:     { r: 0.25, g: 0.28, b: 0.35, a: 1.00 }

text:
  primary:   { r: 0.95, g: 0.95, b: 0.97, a: 1.0 }
  secondary: { r: 0.65, g: 0.68, b: 0.75, a: 1.0 }
  muted:     { r: 0.55, g: 0.58, b: 0.65, a: 1.0 }
  accent:    { r: 1.00, g: 0.58, b: 0.20, a: 1.0 }
  success:   { r: 0.40, g: 0.85, b: 0.60, a: 1.0 }
  warning:   { r: 0.98, g: 0.85, b: 0.35, a: 1.0 }
  info:      { r: 0.45, g: 0.75, b: 0.95, a: 1.0 }
  selection: { r: 0.85, g: 0.45, b: 0.12, a: 1.0 }
  size_title: 18.0
  size_heading: 16.0
  size_body: 11.0
  size_label: 14.0
  size_small: 11.0
  font_path: ../fonts/DejaVuSans.ttf
  fonts:
    title:   { path: ../fonts/Inter-SemiBold.ttf }
    heading: { path: ../fonts/Inter-SemiBold.ttf }
    body:    { path: ../fonts/Inter-Regular.ttf }
    label:   { path: ../fonts/Inter-Regular.ttf }
    caption: { path: ../fonts/Inter-Regular.ttf }
    numeric: { path: ../fonts/JetBrainsMono-Regular.ttf }

button:
  normal:   { r: 0.22, g: 0.25, b: 0.32, a: 1.0 }
  hover:    { r: 0.30, g: 0.35, b: 0.45, a: 1.0 }
  press:    { r: 0.18, g: 0.20, b: 0.26, a: 1.0 }
  disabled: { r: 0.15, g: 0.16, b: 0.19, a: 0.5 }

button_primary:
  normal:   { r: 0.85, g: 0.45, b: 0.10, a: 1.0 }
  hover:    { r: 1.00, g: 0.56, b: 0.18, a: 1.0 }
  press:    { r: 0.68, g: 0.34, b: 0.06, a: 1.0 }
  disabled: { r: 0.15, g: 0.16, b: 0.19, a: 0.5 }

button_success:
  normal:   { r: 0.22, g: 0.50, b: 0.35, a: 1.0 }
  hover:    { r: 0.28, g: 0.62, b: 0.42, a: 1.0 }
  press:    { r: 0.18, g: 0.42, b: 0.28, a: 1.0 }
  disabled: { r: 0.15, g: 0.16, b: 0.19, a: 0.5 }

slider:
  track:           { r: 0.18, g: 0.20, b: 0.25, a: 1.0 }
  fill:            { r: 0.95, g: 0.55, b: 0.15, a: 1.0 }
  handle:          { r: 0.90, g: 0.92, b: 0.98, a: 1.0 }
  handle_hover:    { r: 1.00, g: 1.00, b: 1.00, a: 1.0 }
  handle_press:    { r: 0.70, g: 0.72, b: 0.80, a: 1.0 }
  handle_disabled: { r: 0.90, g: 0.92, b: 0.98, a: 0.4 }
  height: 18.0
  handle_width: 14.0

toggle:
  bg:          { r: 0.18, g: 0.20, b: 0.25, a: 1.0 }
  bg_hover:    { r: 0.24, g: 0.27, b: 0.34, a: 1.0 }
  bg_press:    { r: 0.14, g: 0.16, b: 0.20, a: 1.0 }
  bg_disabled: { r: 0.18, g: 0.20, b: 0.25, a: 0.5 }
  check:       { r: 0.95, g: 0.55, b: 0.15, a: 1.0 }
  size: 20.0

spinbox:
  bg: { r: 0.16, g: 0.18, b: 0.23, a: 1.0 }
  height: 26.0
  btn_width: 24.0

combobox:
  bg:        { r: 0.20, g: 0.23, b: 0.29, a: 1.0 }
  popup_bg:  { r: 0.15, g: 0.17, b: 0.22, a: 0.98 }
  height: 28.0

slot:
  bg:       { r: 0.15, g: 0.17, b: 0.22, a: 0.9 }
  border:   { r: 0.30, g: 0.34, b: 0.42, a: 1.0 }
  hover:    { r: 0.75, g: 0.50, b: 0.28, a: 1.0 }
  selected: { r: 1.00, g: 0.62, b: 0.15, a: 1.0 }
  tooltip_bg:   { r: 0.05, g: 0.06, b: 0.08, a: 0.95 }
  tooltip_text: { r: 0.95, g: 0.95, b: 0.97, a: 1.0 }

cursor:
  size: 24.0
  color: { r: 1.00, g: 1.00, b: 1.00, a: 1.0 }
  default:  { icon: cursor_default,  hotspot: { x: 0.19, y: 0.16 } }
  pointer:  { icon: cursor_pointer,  hotspot: { x: 0.50, y: 0.19 } }
  text:     { icon: cursor_text,     hotspot: { x: 0.50, y: 0.50 } }
  disabled: { icon: cursor_disabled, hotspot: { x: 0.50, y: 0.50 } }

focus:
  color: { r: 1.00, g: 0.58, b: 0.20, a: 1.0 }
  fill:  { r: 1.00, g: 0.58, b: 0.20, a: 0.0 }
  thickness: 2.0
  padding: 3.0
  move_duration: 0.08
  fade_duration: 0.12

metrics:
  row_height: 28.0
  row_spacing: 8.0
  label_width: 175.0
  header_height: 26.0
  card_header_height: 34.0
  scrollbar_thickness: 8.0
  scroll_frame_padding: 6.0
  button_padding_x: 16.0
  button_min_width: 80.0
  section_spacing: 10.0
  dialog_padding: 16.0
  tab_height: 32.0
  tab_spacing: 4.0
  tab_indicator_height: 3.0
  scrim_alpha: 0.55

tab:
  normal:         { r: 0.13, g: 0.15, b: 0.19, a: 1.0 }
  hover:          { r: 0.20, g: 0.23, b: 0.29, a: 1.0 }
  press:          { r: 0.10, g: 0.11, b: 0.14, a: 1.0 }
  selected:       { r: 0.80, g: 0.42, b: 0.10, a: 1.0 }
  selected_hover: { r: 0.95, g: 0.53, b: 0.16, a: 1.0 }
  indicator:      { r: 1.00, g: 0.58, b: 0.20, a: 1.0 }

hud:
  bar_bg:     { r: 0.10, g: 0.11, b: 0.14, a: 0.85 }
  bar_border: { r: 0.30, g: 0.34, b: 0.42, a: 1.0 }
  bar_text:   { r: 0.95, g: 0.95, b: 0.97, a: 1.0 }
  health_fill:   { r: 0.85, g: 0.22, b: 0.24, a: 1.0 }
  health_ghost:  { r: 0.45, g: 0.12, b: 0.13, a: 1.0 }
  stamina_fill:  { r: 0.80, g: 0.68, b: 0.20, a: 1.0 }
  stamina_ghost: { r: 0.45, g: 0.38, b: 0.12, a: 1.0 }
  hotbar_key:      { r: 0.70, g: 0.72, b: 0.78, a: 0.9 }
  hotbar_selected: { r: 1.00, g: 0.62, b: 0.15, a: 1.0 }
  log_bg:   { r: 0.08, g: 0.09, b: 0.12, a: 0.0 }
  log_text: { r: 0.90, g: 0.91, b: 0.94, a: 1.0 }
  console_bg:        { r: 0.08, g: 0.09, b: 0.12, a: 0.96 }
  console_input_bg:  { r: 0.14, g: 0.16, b: 0.20, a: 1.0 }
  console_text:      { r: 0.92, g: 0.93, b: 0.96, a: 1.0 }
  console_prompt:    { r: 0.60, g: 0.80, b: 1.00, a: 1.0 }
  console_echo:      { r: 0.65, g: 0.68, b: 0.75, a: 1.0 }
  console_error:     { r: 0.92, g: 0.40, b: 0.38, a: 1.0 }
  corner_margin: 16.0
  bar_width: 200.0
  bar_height: 14.0
  bar_spacing: 6.0
  ghost_delay: 0.35
  ghost_speed: 45.0
  log_line_height: 18.0
  log_hold_seconds: 6.0
  log_fade_seconds: 1.0
  console_height: 220.0
  console_input_height: 26.0

tooltip:
  bg:   { r: 0.05, g: 0.06, b: 0.08, a: 0.95 }
  text: { r: 0.95, g: 0.95, b: 0.97, a: 1.0 }
  padding_x: 9.0
  padding_y: 6.0
  max_width: 260.0
  delay: 0.5
  cursor_offset: 16.0
